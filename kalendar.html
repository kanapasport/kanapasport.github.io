<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c8102e">
    <meta name="robots" content="noindex, nofollow">
    <title>Kalendář – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=56">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* ------------------------------------------------------- filtr ----
           Zaškrtávátka nesou rovnou i barvu druhu, takže nahrazují bývalou
           samostatnou legendu – dva řádky se stejnými sedmi slovy pod sebou
           nic nepřidají. Primárně je zapnuté všechno; kdo chce vidět jen
           dovolené, zbytek si odklikne. */
        .filtr { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .filtr__druh { display: inline-flex; align-items: center; gap: 7px;
            min-height: 32px; padding: 0 11px; border: 1px solid var(--line);
            border-radius: 99px; background: var(--surface);
            font-size: 12.5px; font-weight: 700; cursor: pointer; }
        .filtr__druh i { display: inline-block; flex: none; width: 10px; height: 10px;
            border-radius: 3px; font-style: normal; }
        /* vypnutý druh zešedne – ať je na první pohled vidět, že se něco neukazuje */
        .filtr__druh:has(input:not(:checked)) { color: var(--dim); opacity: .6; }
        .filtr__druh:hover { border-color: var(--accent-lt); }
        /* Roletka „Kdo" sedí v prvním řádku hned vedle data období – po lidech
           se filtruje nejčastěji, tak ať je po ruce u přepínání pohledů,
           ne zastrčená mezi zaškrtávátky druhů o řádek níž. */
        .filtr__kdo { display: inline-flex; align-items: center; gap: 7px; }
        .filtr__popisek { font-size: 11.5px; font-weight: 800; letter-spacing: .05em;
            text-transform: uppercase; color: var(--muted); }
        .filtr__pole { width: auto; min-width: 190px; min-height: 32px;
            padding: 4px 10px; font-size: 12.5px; }
        /* stejná výška jako zaškrtávátka i roletka, ať řádek filtru nekouše */
        .filtr__reset { min-height: 32px; padding: 0 12px; }

        /* ------------------------------------------------------- mřížka --- */
        .kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .kal--3 { grid-template-columns: repeat(3, 1fr); }
        .kal__hlava { font-size: 11px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
            color: var(--muted); text-align: center; padding: 4px 0; }
        .kal__den { min-height: 96px; border: 1px solid var(--line-soft); border-radius: var(--radius);
            background: var(--surface); padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; }
        .kal__den--cizi { background: var(--bg-soft); opacity: .6; }
        .kal__den--dnes { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .kal__den--velky { min-height: 190px; }
        .kal__cislo { font-size: 12px; font-weight: 900; color: var(--text-soft); }
        .kal__den--dnes .kal__cislo { color: var(--accent); }
        .kal__vic { font-size: 10.5px; color: var(--muted); cursor: pointer; }
        .ud { display: block; width: 100%; text-align: left; border: none; font: inherit;
            font-size: 10.5px; font-weight: 700; line-height: 1.35; padding: 2px 6px;
            border-radius: 4px; color: #fff; cursor: pointer;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ud--udalost { background: #0f62c4; }
        .ud--dovolena { background: #0d7d3f; }
        .ud--nemoc { background: #c8102e; }
        .ud--skoleni { background: #8a2be2; }
        .ud--homeoffice { background: #0e7490; }
        .ud--ukol { background: #c26a00; }
        .ud--milnik { background: #b3006b; }

        /* Celodenní záznam nemá kdy začít ani skončit, takže v mřížce nemá kam
           sednout – drží se v pruhu nad ní. Výšku pruhu diktuje den s nejvíc
           záznamy (--celodenni), aby mřížky sousedních dnů začínaly ve stejné
           výšce a hodiny šly porovnat pohledem přes celý týden. */
        .kal__celodenni { display: flex; flex-direction: column; gap: 3px;
            margin: 3px -6px 0; padding-bottom: 6px; min-height: var(--celodenni, 22px);
            border-bottom: 1px solid var(--line-soft); }
        /* Přes celou šířku dne a natvrdo barevný: „tenhle den je pryč" musí
           být vidět dřív, než se člověk začte do písmen. */
        .udcely { display: flex; align-items: center; gap: 5px; min-height: 22px;
            padding: 3px 8px; border-radius: 0; font-size: 11px; font-weight: 800;
            box-shadow: inset 4px 0 0 rgba(255, 255, 255, .55); }
        /* Druh stojí vepředu a nekrátí se; ukrojí se až jméno za ním –
           „Dovolená – Ja…" pořád nese tu podstatnou informaci. */
        .udcely__druh { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
        .udcely__sep { flex: none; opacity: .7; }
        .udcely__kdo { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
        /* hodinová mřížka pro týden a 3 dny: 6:00–20:00, řádek = hodina */
        .kal__hodiny { position: relative; height: 504px; /* 14 hodin × 36 px */
            background: repeating-linear-gradient(to bottom,
                var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent 36px); }
        .kal__hodina { position: absolute; left: 2px; font-size: 9px; color: var(--dim); pointer-events: none; }
        .kal__hodiny .ud { position: absolute; left: 24px; right: 2px; white-space: normal; overflow: hidden; }
        @media (max-width: 760px) {
            .kal { grid-template-columns: repeat(1, 1fr); }
            .kal__hlava { display: none; }
            .kal__den--cizi { display: none; }
            .kal__den { min-height: 0; }
            /* dny jsou pod sebou, není co zarovnávat – pruh ať nedrží prázdno */
            .kal__celodenni { min-height: 0; }
        }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main class="wrap" style="padding-top:26px;padding-bottom:60px;display:flex;flex-direction:column;gap:14px">

    <div class="spread">
        <div>
            <h2 style="font-size:20px;font-weight:900;line-height:1.2">Kalendář</h2>
            <p class="small muted" style="margin-top:3px;max-width:860px;line-height:1.6">
                Dovolené, nemoci a školení celé firmy, termíny úkolů a milníky.
                Dovolené, nemoci a školení se sem zapisují z výkazu – tady se
                prohlížejí a kliknutím na záznam se dají smazat.
            </p>
        </div>
    </div>

    <div class="card col" style="gap:12px;padding:14px 16px">
        <div class="row row--wrap" style="gap:8px">
            <button type="button" class="btn btn--ghost btn--sm" id="btnZpet">‹</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btnDnes">Dnes</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btnDal">›</button>
            <b id="obdobi" style="font-size:15px;margin-left:6px"></b>
            <label class="filtr__kdo" style="margin-left:6px"><span class="filtr__popisek">Kdo</span>
                <select id="fKdo" class="field filtr__pole"></select></label>
            <div class="grow"></div>
            <button type="button" class="chip" data-pohled="mesic">Měsíc</button>
            <button type="button" class="chip" data-pohled="tyden">Týden</button>
            <button type="button" class="chip" data-pohled="tri">3 dny</button>
        </div>

        <!-- Filtr je zároveň legenda: u každého druhu svítí jeho barva.
             Nahoře nad mřížkou, ať je vidět bez rolování i u celého měsíce. -->
        <div class="filtr">
            <label class="filtr__druh"><input type="checkbox" data-druh="udalost"><i class="ud--udalost"></i>Události</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="dovolena"><i class="ud--dovolena"></i>Dovolené</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="nemoc"><i class="ud--nemoc"></i>Nemoci</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="skoleni"><i class="ud--skoleni"></i>Školení</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="homeoffice"><i class="ud--homeoffice"></i>Home office</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="ukol"><i class="ud--ukol"></i>Termíny úkolů</label>
            <label class="filtr__druh"><input type="checkbox" data-druh="milnik"><i class="ud--milnik"></i>Milníky</label>
            <button type="button" id="btnVse" class="btn btn--ghost btn--sm filtr__reset"
                title="Vrátí filtr do výchozího stavu – vidět je zase všechno">Zobrazit vše</button>
        </div>

        <div id="mrizka"></div>
    </div>

</main>

<script src="assets/js/taxonomy.js?v=56"></script>
<script src="assets/js/ui.js?v=56"></script>
<script src="assets/js/vykazy.js?v=56"></script>
<script type="module" src="assets/js/store.js?v=56"></script>

<script>
(function () {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const esc = (value) => window.KBUI.esc(value);
    const V = window.KBVYK;

    /* Popisky druhů s velkým písmenem – v kalendáři stojí druh na začátku
       řádku („Dovolená – Jan Novák"), takže se píše jako začátek věty. */
    const DRUHY = { udalost: "Událost", dovolena: "Dovolená", nemoc: "Nemoc",
        skoleni: "Školení", homeoffice: "Home office" };
    const DNY_KRATCE = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
    const MESICE = ["leden", "únor", "březen", "duben", "květen", "červen", "červenec",
        "srpen", "září", "říjen", "listopad", "prosinec"];

    /* Týden je to, co lidi na kalendáři opravdu čtou – kdo dnes a zítra není
       a co se kdy děje. Měsíc je přehled na plánování, ne na každý den. */
    let pohled = "tyden";               // mesic | tyden | tri
    let kotva = new Date();             // den, kolem kterého se kreslí
    let sledovaniZapnuto = false;

    function zapniSledovani() {
        if (sledovaniZapnuto || !window.KB.currentUid()) return;
        sledovaniZapnuto = true;
        // kalendář chodí všem sám; úkoly podle práv (kvůli termínům v mřížce)
        if (window.KBUI.can("vykaz.view")) window.KB.watchUkoly();
        else window.KB.watchMojeUkoly();
    }

    const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
        "-" + String(d.getDate()).padStart(2, "0");
    const dnesIso = () => iso(new Date());
    const posun = (d, dni) => { const n = new Date(d); n.setDate(n.getDate() + dni); return n; };

    /** Pondělí týdne, do kterého den patří. */
    function pondeli(d) {
        const n = new Date(d);
        n.setDate(n.getDate() - ((n.getDay() + 6) % 7));
        return n;
    }

    /* ------------------------------------------------------------- filtr --
       Primárně je vidět všechno – kalendář má napřed ukázat celý provoz firmy
       a teprve pak se dá zúžit. Volba se drží v prohlížeči, aby se po každém
       překreslení (a po návratu na stránku) nemusela klikat znovu. */

    const FILTR_KLIC = "kb-kalendar-filtr";
    const VYCHOZI_DRUHY = { udalost: true, dovolena: true, nemoc: true, skoleni: true,
        homeoffice: true, ukol: true, milnik: true };

    function vychoziFiltr() {
        return { druhy: Object.assign({}, VYCHOZI_DRUHY), kdo: "" };
    }

    function nactiFiltr() {
        try {
            const ulozeno = JSON.parse(localStorage.getItem(FILTR_KLIC) || "{}");
            return {
                // výchozí hodnoty napřed: nově přidaný druh je zapnutý,
                // i když si člověk filtr uložil ještě před jeho vznikem
                druhy: Object.assign({}, VYCHOZI_DRUHY, ulozeno.druhy || {}),
                kdo: String(ulozeno.kdo || "")
            };
        } catch (err) {
            return vychoziFiltr();       // soukromé okno nebo rozbitý zápis
        }
    }

    function ulozFiltr() {
        try { localStorage.setItem(FILTR_KLIC, JSON.stringify(filtr)); }
        catch (err) { /* soukromé okno – filtr prostě nepřežije zavření */ }
    }

    let filtr = nactiFiltr();

    /* Neznámý druh (starší zápis s jinou hodnotou `typ`) se schová jen tehdy,
       když ho někdo výslovně vypnul – jinak by se ztratil beze stopy. */
    const druhZapnut = (druh) => filtr.druhy[druh] !== false;

    /** Srovná zaškrtávátka podle uloženého filtru. */
    function pouzijFiltr() {
        document.querySelectorAll("[data-druh]").forEach(ch => {
            ch.checked = druhZapnut(ch.dataset.druh);
        });
    }

    /** Roletka lidí. Plní se až se seznamem uživatelů, ten chodí ze store. */
    function naplnKdo() {
        const lide = V.lide().map(u => ({ value: u.id, label: V.jmeno(u) }));
        // vybraný člověk mohl mezitím skončit; roletka pak spadne na „Všichni"
        if (filtr.kdo && lide.length && !lide.some(l => l.value === filtr.kdo)) filtr.kdo = "";
        $("fKdo").innerHTML = V.options(lide, filtr.kdo, "Všichni");
    }

    /* ------------------------------------------------ co v který den je */

    /**
     * Rozpad události na druh a jméno.
     * Pořadí je schválně druh napřed a jméno za ním („Dovolená – Jan Novák").
     * V kalendáři se očima hledá druh, ne jméno – stejné slovo na začátku
     * všech řádků se najde rychleji než jméno schované až za ním.
     * U obyčejné události je vepředu její popis, jméno zůstává za ním.
     */
    function popisUdalosti(u) {
        // jméno raději z uid – uložené se mohlo mezitím změnit
        const clovek = V.clovek(u.uid);
        const kdo = clovek ? V.jmeno(clovek) : (u.osoba || "");
        const druh = (u.typ || "udalost") === "udalost"
            ? (u.text || DRUHY.udalost)
            : (DRUHY[u.typ] || DRUHY.udalost) + (u.text ? " · " + u.text : "");
        return { druh: druh, kdo: kdo, popis: druh + (kdo ? " – " + kdo : "") };
    }

    /* `kdo` a `co` jsou rozdělené schválně: celodenní pruh je sází zvlášť
       (druh vepředu, jméno za pomlčkou), zatímco v měsíci jde všechno do
       jednoho řádku `text`. */
    function udalostiDne(den) {
        const out = [];

        (window.KB.kalendar || []).forEach(u => {
            const typ = u.typ || "udalost";
            if (!druhZapnut(typ)) return;
            if (filtr.kdo && u.uid !== filtr.kdo) return;
            if ((u.od || "") <= den && den <= (u.do || u.od || "")) {
                const cas = (!u.celyDen && u.odCas) ? u.odCas + " " : "";
                const p = popisUdalosti(u);
                out.push({ typ: typ, id: u.id, muj: u.uid === window.KB.currentUid(),
                    odCas: u.celyDen ? "" : (u.odCas || ""), doCas: u.celyDen ? "" : (u.doCas || ""),
                    kdo: p.kdo, co: p.druh, text: cas + p.popis });
            }
        });

        if (druhZapnut("ukol")) (window.KB.ukoly || []).forEach(u => {
            if (filtr.kdo && (u.prirazeni || []).indexOf(filtr.kdo) === -1) return;
            if (u.termin === den && u.stav !== "hotovo") {
                const text = "úkol: " + (u.nazev || "") +
                    ((u.prirazeni || []).length ? " – " + u.prirazeni.map(uid => {
                        const cl = V.clovek(uid); return cl ? (cl.first || V.jmeno(cl)) : "";
                    }).filter(Boolean).join(", ") : "");
                out.push({ typ: "ukol", kdo: "", co: text, text: text });
            }
        });

        if (druhZapnut("milnik")) (window.KB.milniky || []).forEach(m => {
            /* Milník má lidi v poli `owners`, ale starší záznamy ho nemají
               vyplněné. Kde chybí, nefiltruje se podle člověka vůbec – milník
               zůstane vidět. Schovat ho jen proto, že u něj někdo zapomněl
               vyplnit jména, by znamenalo ztratit termín odevzdání. */
            if (filtr.kdo && (m.owners || []).length &&
                m.owners.indexOf(filtr.kdo) === -1) return;
            if (m.datum === den && !m.hotovo) {
                const text = "milník: " + (m.cinnost || "") +
                    (m.zakazka ? " (" + m.zakazka + ")" : "");
                out.push({ typ: "milnik", kdo: "", co: text, text: text });
            }
        });

        return out;
    }

    function udalostHtml(u) {
        return '<button type="button" class="ud ud--' + esc(u.typ) + '"' +
            (u.id ? ' data-udalost="' + esc(u.id) + '"' : "") +
            ' title="' + esc(u.text) + '">' + esc(u.text) + "</button>";
    }

    /** Celodenní pruh v týdnu a 3 dnech: druh a za ním jméno, přes celou šířku dne. */
    function celodenniHtml(u) {
        const kdo = u.kdo
            ? '<span class="udcely__sep">–</span>' +
              '<span class="udcely__kdo">' + esc(u.kdo) + "</span>"
            : "";
        return '<button type="button" class="ud udcely ud--' + esc(u.typ) + '"' +
            (u.id ? ' data-udalost="' + esc(u.id) + '"' : "") +
            ' title="' + esc(u.text) + '">' +
            '<b class="udcely__druh">' + esc(u.co || u.text) + "</b>" + kdo + "</button>";
    }

    /* Bez času nevíme, kam do mřížky s tím sednout – patří to nahoru. */
    const minuty = (cas) => {
        const m = /^(\d{1,2}):(\d{2})$/.exec(cas || "");
        return m ? Number(m[1]) * 60 + Number(m[2]) : null;
    };
    const jeCelodenni = (u) => minuty(u.odCas) === null;

    /* Výška pruhu podle počtu záznamů: proužek 22 px, mezera 3, spodní odsazení
       pruhu 6 a linka 1. Raději o pár pixelů víc – kdyby vyšla míň, nejplnější
       den by pruh přerostl a mřížky sousedních dnů by se rozjely. */
    const vyskaCelodennich = (pocet) => pocet ? pocet * 25 + 7 : 12;

    /* ------------------------------------------------------- vykreslení */

    function denHtml(d, moznosti) {
        const den = iso(d);
        const seznam = moznosti.seznam || udalostiDne(den);
        const hlava = '<span class="kal__cislo">' + d.getDate() + ". " + (d.getMonth() + 1) + "." +
            (moznosti.velky ? " · " + DNY_KRATCE[(d.getDay() + 6) % 7] : "") + "</span>";
        const obal = (vnitrek) => '<div class="kal__den' +
            (moznosti.cizi ? " kal__den--cizi" : "") +
            (den === dnesIso() ? " kal__den--dnes" : "") +
            (moznosti.velky ? " kal__den--velky" : "") + '">' + hlava + vnitrek + "</div>";

        // měsíc: prostý seznam s limitem
        if (!moznosti.velky) {
            const videt = seznam.slice(0, 4);
            const zbytek = seznam.length - videt.length;
            return obal(videt.map(udalostHtml).join("") +
                (zbytek > 0 ? '<span class="kal__vic">+ ' + zbytek + " dalších</span>" : ""));
        }

        /* Týden a 3 dny: den rozdělený po hodinách (6:00–20:00). Co má čas,
           sedí na své hodině; celodenní věci (dovolené, úkoly, milníky)
           zůstávají v pruhu nahoře. */
        const ZAC = 6, KON = 20, VYSKA_HODINY = 36;
        const celodenni = [], casovane = [];
        seznam.forEach(u => (jeCelodenni(u) ? celodenni : casovane).push(u));

        let hodiny = "";
        for (let h = ZAC; h <= KON; h += 2) {
            hodiny += '<span class="kal__hodina" style="top:' +
                ((h - ZAC) * VYSKA_HODINY - 5) + 'px">' + h + ":00</span>";
        }
        hodiny += casovane.map(u => {
            const od = Math.max(ZAC * 60, Math.min(KON * 60, minuty(u.odCas)));
            const doM = minuty(u.doCas);
            const konec = doM === null ? od + 60 : Math.max(od + 30, Math.min(KON * 60, doM));
            const vrch = (od - ZAC * 60) / 60 * VYSKA_HODINY;
            const vyska = (konec - od) / 60 * VYSKA_HODINY - 2;
            return udalostHtml(u).replace('class="ud ',
                'style="top:' + vrch.toFixed(0) + 'px;height:' + vyska.toFixed(0) + 'px" class="ud ');
        }).join("");

        return obal('<div class="kal__celodenni">' + celodenni.map(celodenniHtml).join("") + "</div>" +
            '<div class="kal__hodiny">' + hodiny + "</div>");
    }

    function vykresli() {
        document.querySelectorAll("[data-pohled]").forEach(ch =>
            ch.classList.toggle("chip--active", ch.dataset.pohled === pohled));

        const mrizka = $("mrizka");

        if (pohled === "mesic") {
            const prvni = new Date(kotva.getFullYear(), kotva.getMonth(), 1);
            const start = pondeli(prvni);
            $("obdobi").textContent = MESICE[kotva.getMonth()] + " " + kotva.getFullYear();

            let html = '<div class="kal">' +
                DNY_KRATCE.map(d => '<div class="kal__hlava">' + d + "</div>").join("");
            for (let i = 0; i < 42; i++) {
                const d = posun(start, i);
                if (i === 35 && d.getMonth() !== kotva.getMonth()) break;   // šestý řádek jen když je potřeba
                html += denHtml(d, { cizi: d.getMonth() !== kotva.getMonth() });
            }
            mrizka.innerHTML = html + "</div>";
            return;
        }

        const dnu = pohled === "tyden" ? 7 : 3;
        const start = pohled === "tyden" ? pondeli(kotva) : new Date(kotva);
        const konec = posun(start, dnu - 1);
        $("obdobi").textContent = start.getDate() + ". " + (start.getMonth() + 1) + ". – " +
            konec.getDate() + ". " + (konec.getMonth() + 1) + ". " + konec.getFullYear();

        // dny se počítají napřed: pruh celodenních musí být ve všech stejně vysoký
        const dny = [];
        for (let i = 0; i < dnu; i++) {
            const d = posun(start, i);
            dny.push({ d: d, seznam: udalostiDne(iso(d)) });
        }
        const nejvic = dny.reduce((max, den) =>
            Math.max(max, den.seznam.filter(jeCelodenni).length), 0);

        let html = '<div class="kal' + (dnu === 3 ? " kal--3" : "") +
            '" style="--celodenni:' + vyskaCelodennich(nejvic) + 'px">';
        dny.forEach(den => { html += denHtml(den.d, { velky: true, seznam: den.seznam }); });
        mrizka.innerHTML = html + "</div>";
    }

    /* ------------------------------------------------------------ mazání --
       Ruční přidávání událostí kalendář nemá – dovolené, nemoci a školení
       se sem propisují z výkazu. Klik na záznam ale zůstává: propsaný zápis
       musí jít z kalendáře i odstranit. */

    async function klikNaUdalost(id) {
        const u = (window.KB.kalendar || []).find(x => x.id === id);
        if (!u) return;
        const moje = u.uid === window.KB.currentUid();
        const popis = popisUdalosti(u).popis +
            " (" + V.czDatum(u.od) + (u.do && u.do !== u.od ? " až " + V.czDatum(u.do) : "") + ")";
        if (!moje && !window.KBUI.can("vykaz.view")) return void window.KBUI.toast(popis);
        if (confirm(popis + "\n\nSmazat tuhle událost?")) {
            await window.KB.deleteUdalost(id).catch(() =>
                window.KBUI.toast("Smazání selhalo – cizí události maže jen manažer.", "error"));
        }
    }

    /* -------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "kalendar.html" });

        $("btnDnes").addEventListener("click", () => { kotva = new Date(); vykresli(); });
        $("btnZpet").addEventListener("click", () => {
            kotva = pohled === "mesic"
                ? new Date(kotva.getFullYear(), kotva.getMonth() - 1, 1)
                : posun(kotva, pohled === "tyden" ? -7 : -3);
            vykresli();
        });
        $("btnDal").addEventListener("click", () => {
            kotva = pohled === "mesic"
                ? new Date(kotva.getFullYear(), kotva.getMonth() + 1, 1)
                : posun(kotva, pohled === "tyden" ? 7 : 3);
            vykresli();
        });
        document.querySelectorAll("[data-pohled]").forEach(ch =>
            ch.addEventListener("click", () => { pohled = ch.dataset.pohled; vykresli(); }));

        // filtr: klik = uložit volbu a hned překreslit, ať je změna vidět
        document.querySelectorAll("[data-druh]").forEach(ch =>
            ch.addEventListener("change", () => {
                filtr.druhy[ch.dataset.druh] = ch.checked;
                ulozFiltr();
                vykresli();
            }));
        $("fKdo").addEventListener("change", () => {
            filtr.kdo = $("fKdo").value;
            ulozFiltr();
            vykresli();
        });
        $("btnVse").addEventListener("click", () => {
            filtr = vychoziFiltr();
            ulozFiltr();
            pouzijFiltr();
            naplnKdo();
            vykresli();
        });
        pouzijFiltr();

        document.addEventListener("click", (event) => {
            const ud = event.target.closest("[data-udalost]");
            if (ud) klikNaUdalost(ud.dataset.udalost);
        });

        const obnov = () => { zapniSledovani(); naplnKdo(); vykresli(); };
        document.addEventListener("kb-role", obnov);
        window.KB.on("users", obnov);
        window.KB.on("kalendar", vykresli);
        window.KB.on("ukoly", vykresli);
        window.KB.on("milniky", vykresli);
        obnov();
    });
})();
</script>
</body>
</html>
