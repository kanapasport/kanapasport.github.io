<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c8102e">
    <title>Návody – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=4">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
</head>
<body>

<div id="appHeader"></div>

<main class="wrap" style="padding-top:26px;padding-bottom:60px;display:flex;flex-direction:column;gap:22px">

    <!-- ------------------------------------------------------------ hlava -->
    <div class="section-head" style="margin-bottom:2px">
        <h2 id="pageTitle">Všechny návody</h2>
        <p id="pageDesc">Kompletní databáze firemních postupů.</p>
    </div>

    <!-- ----------------------------------------------------------- filtry -->
    <div class="col" style="gap:12px">
        <div id="catRow" class="row row--wrap" style="justify-content:center;gap:8px"></div>
        <div id="groupRow" class="row row--wrap" style="justify-content:center;gap:8px"></div>
        <div id="subRow" class="row row--wrap" style="justify-content:center;gap:8px"></div>
    </div>

    <div class="row row--wrap" style="gap:12px">
        <div class="grow" style="position:relative">
            <svg style="width:18px;height:18px;position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input id="search" type="search" autocomplete="off" class="field"
                   placeholder="Hledat v návodech…" style="padding-left:42px">
        </div>
        <a href="editor.html" class="btn btn--primary">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Nový návod
        </a>
    </div>

    <!-- ----------------------------------------------------------- seznam -->
    <div class="spread">
        <div id="listCount" class="tiny" style="font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Načítám…</div>
        <button id="btnPrompt" class="btn btn--ghost btn--sm">Zkopírovat pokyn pro AI k této kategorii</button>
    </div>

    <div id="list" class="col" style="gap:10px"></div>
</main>

<script src="assets/js/taxonomy.js?v=4"></script>
<script src="assets/js/doc.js?v=4"></script>
<script src="assets/js/ui.js?v=4"></script>
<script type="module" src="assets/js/store.js?v=4"></script>

<script>
(function () {
    const esc = (value) => window.KBUI.esc(value);
    const params = new URLSearchParams(location.search);

    let activeCat = params.get("kat") || "";
    let activeSub = params.get("sub") || "";   // může být skupina (program) i konkrétní téma

    /* ------------------------------------------------------------ filtry */

    function setFilter(cat, sub) {
        activeCat = cat || "";
        activeSub = sub || "";
        const next = new URLSearchParams();
        if (activeCat) next.set("kat", activeCat);
        if (activeSub) next.set("sub", activeSub);
        history.replaceState(null, "", location.pathname + (next.toString() ? "?" + next : ""));
        paintFilters();
        paintList();
    }
    window.__setFilter = setFilter;

    const chip = (label, active, cat, sub) =>
        '<button type="button" class="chip' + (active ? " chip--active" : "") + '" ' +
        "onclick=\"__setFilter('" + cat + "','" + sub + "')\">" + esc(label) + "</button>";

    function paintFilters() {
        const category = window.KB_findCategory(activeCat);
        const hit = window.KB_findNode(activeCat, activeSub);
        const path = hit ? hit.path : [];

        // 1. řádek – kategorie
        document.getElementById("catRow").innerHTML =
            chip("VŠE", !activeCat, "", "") +
            window.KB_CATEGORIES.map(c => chip(c.title, c.id === activeCat, c.id, "")).join("");

        // 2. řádek – přímí potomci kategorie (u PROGRAMŮ jsou to názvy programů)
        const groupRow = document.getElementById("groupRow");
        const groups = category && category.children ? category.children : [];
        groupRow.hidden = !groups.length;
        groupRow.innerHTML = groups.length
            ? chip("Vše v kategorii", !activeSub, activeCat, "") +
              groups.map(g => chip(g.title, path[0] && path[0].id === g.id, activeCat, g.id)).join("")
            : "";

        // 3. řádek – rozdělení uvnitř vybraného programu
        const subRow = document.getElementById("subRow");
        const group = path[0];
        const children = group && group.children ? group.children : [];
        subRow.hidden = !children.length;
        subRow.innerHTML = children.length
            ? chip("Celý " + group.title, activeSub === group.id, activeCat, group.id) +
              children.map(c => chip(c.title, c.id === activeSub, activeCat, c.id)).join("")
            : "";

        // nadpis stránky
        const title = document.getElementById("pageTitle");
        const desc = document.getElementById("pageDesc");
        if (!category) {
            title.textContent = "Všechny návody";
            desc.textContent = "Kompletní databáze firemních postupů.";
        } else {
            title.textContent = path.length ? path[path.length - 1].title : category.title;
            desc.textContent = path.length
                ? category.title.charAt(0) + category.title.slice(1).toLowerCase()
                : (category.sub || "");
        }
    }

    /* ------------------------------------------------------------ seznam */

    function guideRow(guide, query) {
        const date = guide.updatedMs ? new Date(guide.updatedMs).toLocaleDateString("cs-CZ") : "";
        const images = (guide.steps || []).reduce((sum, s) => sum + ((s.images || []).length), 0);

        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div class="row" style="align-items:flex-start;gap:16px">' +
                '<div class="grow">' +
                    '<div class="row row--wrap" style="gap:8px;margin-bottom:6px">' +
                        '<span class="tag">' + esc(window.KB_categoryLabel(guide)) + "</span>" +
                        '<span class="tiny muted">' + esc(guide.author || "Neznámý autor") + "</span>" +
                        (guide.version ? '<span class="tiny" style="color:var(--dim)">' + esc(guide.version) + "</span>" : "") +
                    "</div>" +
                    '<div style="font-size:15px;font-weight:800;line-height:1.3">' +
                        window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
                    (guide.desc ? '<div class="small muted" style="margin-top:5px;line-height:1.5">' +
                        window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
                "</div>" +
                '<div class="tiny" style="text-align:right;flex:none;color:var(--dim);line-height:1.6">' +
                    (date ? date + "<br>" : "") +
                    ((guide.steps || []).length) + " kroků" +
                    (images ? "<br>" + images + " obr." : "") +
                "</div>" +
            "</div>" +
        "</a>";
    }

    function paintList() {
        const query = document.getElementById("search").value.trim();
        const listEl = document.getElementById("list");
        const all = window.KB.guides || [];

        let items = all;
        let note = "";

        if (activeCat) {
            // u skupiny (např. celý ArcGIS) bereme i všechna témata pod ní
            const allowed = activeSub ? window.KB_descendantIds(activeCat, activeSub) : null;
            const inCategory = all.filter(g =>
                g.cat === activeCat && (!allowed || allowed.indexOf(g.subcat) !== -1));

            if (inCategory.length) {
                items = inCategory;
            } else {
                items = all;
                note = '<div class="card" style="padding:14px 16px;font-size:12.5px;color:var(--warn);' +
                       'background:#fff8ed;border-color:#f6dcb4">' +
                       "Tady zatím žádný návod zařazený není, proto se zobrazují všechny. " +
                       "Zařazení nastavíš u návodu v editoru.</div>";
            }
        }

        items = window.KBUI.searchGuides(items, query);

        document.getElementById("listCount").textContent = items.length === 0 ? "Žádné návody"
            : items.length + (items.length === 1 ? " návod" : items.length < 5 ? " návody" : " návodů");

        listEl.innerHTML = note + (items.length
            ? items.map(g => guideRow(g, query)).join("")
            : '<div class="card" style="padding:44px;text-align:center;color:var(--muted);font-size:14px">' +
              "Zatím tu nic není.<br>" +
              '<a href="editor.html" style="color:var(--accent);font-weight:700">Vytvořit první návod</a></div>');
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "navody.html" });
        paintFilters();
        paintList();

        document.getElementById("search").addEventListener("input", paintList);
        document.getElementById("btnPrompt").addEventListener("click",
            () => window.KBUI.copyAiPrompt(activeCat, activeSub));

        window.KB.on("guides", paintList);
    });
})();
</script>
</body>
</html>
