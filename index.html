<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pasport Kaňa">
    <meta name="theme-color" content="#c8102e">
    <title>Pasport Kaňa – firemní knowledge base</title>
    <link rel="stylesheet" href="assets/css/app.css?v=2">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
</head>
<body>

<div id="appHeader"></div>

<main>

    <!-- ============================================================ úvod -->
    <section class="wrap" style="padding-top:44px;padding-bottom:34px;text-align:center">
        <img src="Pasport_Kana_black.png" alt="Pasport Kaňa"
             style="height:92px;margin:0 auto;object-fit:contain;display:block">

        <h1 class="hero__title">Firemní knowledge base</h1>
        <p class="hero__lead">
            Návody, pracovní postupy a úkolovník na jednom místě.
            Vyber si oblast, nebo rovnou hledej v celé databázi.
        </p>
        <div style="margin-top:10px;font-size:12px" data-cloud-status>Připojuji…</div>

        <div style="margin:26px auto 0;max-width:640px;position:relative">
            <svg style="width:20px;height:20px;position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input id="globalSearch" type="search" autocomplete="off" class="field"
                   placeholder="Hledat v návodech – název, postup, program, chyba…"
                   style="min-height:52px;padding-left:46px;border-radius:16px;font-size:15px;box-shadow:var(--shadow)">
        </div>
    </section>

    <!-- ======================================================== výsledky -->
    <section id="searchResults" class="wrap" hidden style="padding-bottom:56px">
        <div class="section-head">
            <h2>Výsledky hledání</h2>
            <p id="searchCount"></p>
        </div>
        <div id="searchList" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>

    <!-- =========================================================== sekce -->
    <div id="sections" class="wrap" style="padding-bottom:70px;display:flex;flex-direction:column;gap:58px"></div>

    <footer style="border-top:1px solid var(--line);padding:26px 0 calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--dim)">
        Pasport Kaňa · interní dokumentace · data jsou určena pouze pro potřeby firmy
    </footer>
</main>

<script src="assets/js/taxonomy.js?v=2"></script>
<script src="assets/js/doc.js?v=2"></script>
<script src="assets/js/ui.js?v=2"></script>
<script type="module" src="assets/js/store.js?v=2"></script>

<script>
(function () {
    const esc = (value) => window.KBUI.esc(value);
    const icon = (name) =>
        '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' + (window.KB_ICONS[name] || "") + "</svg>";

    /* ------------------------------------------------------- dlaždice */

    function tileHtml(tile) {
        const head =
            '<div class="tile__head">' +
                '<div class="tile__icon">' + icon(tile.icon) + "</div>" +
                '<div class="tile__title">' + esc(tile.title) + "</div>" +
            "</div>" +
            (tile.sub ? '<div class="tile__sub">' + esc(tile.sub) + "</div>" : "");

        // štítky podkategorií jsou samostatné odkazy (proto dlaždice není celá <a>)
        const chips = (tile.children && tile.children.length)
            ? '<div class="tile__children">' + tile.children.map(child =>
                '<a class="chip" href="navody.html?kat=' + tile.cat + "&sub=" + child.id + '">' +
                esc(child.title) + "</a>").join("") + "</div>"
            : "";

        const meta = tile.cat ? '<div class="tile__meta" data-count="' + tile.cat + '">—</div>'
            : tile.tasks ? '<div class="tile__meta" data-tasks>—</div>'
            : tile.soon ? '<div class="tile__meta">Připravujeme</div>' : "";

        if (tile.soon) return '<div class="tile tile--soon"><div class="tile__main">' + head + "</div>" + meta + "</div>";

        const main = tile.action
            ? '<button type="button" class="tile__main" data-action="' + tile.action + '" style="cursor:pointer;background:none;border:none;font:inherit">' + head + "</button>"
            : '<a class="tile__main" href="' + tile.href + '">' + head + "</a>";

        return '<div class="tile">' + main + chips + meta + "</div>";
    }

    function renderSections() {
        document.getElementById("sections").innerHTML = window.KB_SECTIONS.map(section =>
            "<section>" +
                '<div class="section-head">' +
                    "<h2>" + esc(section.title) + "</h2>" +
                    (section.desc ? "<p>" + esc(section.desc) + "</p>" : "") +
                "</div>" +
                '<div class="tilegrid">' + section.tiles.map(tileHtml).join("") + "</div>" +
            "</section>"
        ).join("");

        document.querySelectorAll("[data-action='ai-prompt']").forEach(button =>
            button.addEventListener("click", () => window.KBUI.copyAiPrompt()));
    }

    /* ------------------------------------------- počty v dlaždicích */

    function paintCounts(guides) {
        document.querySelectorAll("[data-count]").forEach(el => {
            const count = guides.filter(g => g.cat === el.dataset.count).length;
            el.textContent = count === 0 ? "Zatím bez návodů"
                : count === 1 ? "1 návod"
                : count < 5 ? count + " návody"
                : count + " návodů";
        });
    }

    function paintTasks(tasks) {
        const el = document.querySelector("[data-tasks]");
        if (!el) return;
        if (!tasks.length) return void (el.textContent = "Zatím žádné úkoly");
        const open = tasks.filter(t => {
            const subs = t.subtasks || [];
            return !subs.length || subs.some(s => (s.percent || 0) < 100);
        }).length;
        el.textContent = open ? open + " rozdělaných z " + tasks.length : "Vše hotovo (" + tasks.length + ")";
    }

    /* ---------------------------------------------------------- hledání */

    function guideRow(guide, query) {
        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">' +
                '<span class="tag">' + esc(window.KB_categoryLabel(guide)) + "</span>" +
                '<span style="font-size:11.5px;color:var(--dim)">' + esc(guide.author || "Neznámý autor") + "</span>" +
            "</div>" +
            '<div style="font-size:15px;font-weight:800">' + window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
            (guide.desc ? '<div style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5">' +
                window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
        "</a>";
    }

    function runSearch() {
        const query = document.getElementById("globalSearch").value.trim();
        const results = document.getElementById("searchResults");
        const sections = document.getElementById("sections");

        if (!query) {
            results.hidden = true;
            sections.hidden = false;
            return;
        }

        const found = window.KBUI.searchGuides(window.KB.guides, query);
        results.hidden = false;
        sections.hidden = true;
        document.getElementById("searchCount").textContent =
            found.length + " z " + window.KB.guides.length + " návodů";
        document.getElementById("searchList").innerHTML = found.length
            ? found.map(g => guideRow(g, query)).join("")
            : '<div class="card" style="padding:34px;text-align:center;color:var(--muted);font-size:14px">' +
              'Nic nenalezeno. Zkus jiné slovo nebo <a href="navody.html" style="color:var(--accent)">projdi celou databázi</a>.</div>';
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "index.html" });
        renderSections();
        window.KBUI.bindCloudStatus("[data-cloud-status]");
        document.getElementById("globalSearch").addEventListener("input", runSearch);

        window.KB.on("guides", (event) => {
            paintCounts(event.detail);
            if (document.getElementById("globalSearch").value.trim()) runSearch();
        });
        window.KB.on("tasks", (event) => paintTasks(event.detail));

        if (window.KB.guides.length) paintCounts(window.KB.guides);
        if (window.KB.tasks.length) paintTasks(window.KB.tasks);
    });
})();
</script>
</body>
</html>
