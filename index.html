<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pasport Kaňa">
    <meta name="theme-color" content="#c8102e">
    <title>Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=50">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* nástěnka: dvě poloviny, na úzkém okně pod sebou */
        .nastenka { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
        @media (max-width: 900px) { .nastenka { grid-template-columns: 1fr; } }
        .mujukol { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
            border: 1px solid var(--line-soft); border-radius: var(--radius);
            background: var(--surface); cursor: pointer; text-align: left; font: inherit; width: 100%; }
        .mujukol:hover { border-color: var(--accent-lt); }
        .mujukol.je-vybrany { border-color: var(--accent); background: var(--accent-tint); }
        .mujukol__nazev { font-weight: 700; font-size: 13.5px; }
        .mujukol__meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .mujukol__prubeh { flex: none; width: 90px; height: 7px; border-radius: 99px; background: var(--bg); overflow: hidden; }
        .mujukol__prubeh i { display: block; height: 100%; background: var(--accent); }
        .mujukol__pct { flex: none; font-weight: 900; font-size: 12.5px; width: 40px; text-align: right; }
        .ntodo { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line-soft); }
        .ntodo:last-child { border-bottom: none; }
        .ntodo__text { flex: 1; min-width: 0; font-size: 13.5px; }
        .ntodo__pcts { display: flex; gap: 4px; flex-wrap: wrap; }
        .ntodo__pct { border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
            padding: 3px 8px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--muted); }
        .ntodo__pct.je-aktivni { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ntodo__pct:disabled { cursor: default; opacity: .55; }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main>

    <!-- ======================================================== výsledky -->
    <section id="searchResults" class="wrap" hidden style="padding-top:24px;padding-bottom:56px">
        <div class="section-head">
            <h2>Výsledky hledání</h2>
            <p id="searchCount"></p>
        </div>
        <div id="searchList" class="col" style="gap:10px"></div>
    </section>

    <!-- ================================================ nástěnka člověka -->
    <section id="nastenka" class="wrap" style="padding-top:26px">
        <div class="section-head" style="margin-bottom:14px">
            <h2 id="nastenkaPozdrav" style="font-size:24px">Moje nástěnka</h2>
            <p id="nastenkaPopis">Zadané úkoly vlevo, postup práce vybraného úkolu vpravo.</p>
        </div>
        <div class="nastenka">
            <div class="card col" style="gap:8px;padding:16px">
                <div class="spread">
                    <b>Zadané úkoly</b>
                    <a class="linkbtn" style="border-color:var(--line)" href="ukoly.html?moje=1">všechny →</a>
                </div>
                <div id="mojeUkoly" class="col" style="gap:6px"></div>
            </div>
            <div class="card col" style="gap:8px;padding:16px">
                <div class="spread">
                    <b>TO-DO — postup práce</b>
                    <a id="todoOdkaz" class="linkbtn" style="border-color:var(--line)" href="ukoly.html" hidden>otevřít →</a>
                </div>
                <div id="todoRozpad" class="col" style="gap:4px"></div>
            </div>
        </div>
    </section>

    <!-- =========================================================== sekce -->
    <div id="sections" class="wrap" style="padding:34px 20px 70px;display:flex;flex-direction:column;gap:46px"></div>

    <footer style="border-top:1px solid var(--line);padding:26px 0 calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--dim)">
        Pasport Kaňa · interní dokumentace · data jsou určena pouze pro potřeby firmy
    </footer>
</main>

<script src="assets/js/taxonomy.js?v=50"></script>
<script src="assets/js/doc.js?v=50"></script>
<script src="assets/js/ui.js?v=50"></script>
<script type="module" src="assets/js/store.js?v=50"></script>

<script>
(function () {
    const esc = (value) => window.KBUI.esc(value);
    const icon = (name) =>
        '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' + (window.KB_ICONS[name] || "") + "</svg>";

    /* ------------------------------------------------------- dlaždice */

    const VISIBLE_CHIPS = 4;

    /**
     * Seřadí podsekce podle toho, kde se naposledy něco upravovalo –
     * v dlaždici je pak vidět poslední čtyři, zbytek se dá rozbalit.
     */
    function sortedChildren(tile) {
        const guides = window.KB.guides || [];
        return (tile.children || []).map(child => {
            const ids = window.KB_descendantIds(tile.cat, child.id);
            const last = guides.reduce((max, guide) =>
                (guide.cat === tile.cat && ids.indexOf(guide.subcat) !== -1)
                    ? Math.max(max, guide.updatedMs || 0) : max, 0);
            return { id: child.id, title: child.title, last: last };
        }).sort((a, b) => b.last - a.last);
    }

    function tileHtml(tile) {
        const head =
            '<div class="tile__head">' +
                '<div class="tile__icon">' + icon(tile.icon) + "</div>" +
                '<div class="tile__title">' + esc(tile.title) + "</div>" +
            "</div>" +
            (tile.sub ? '<div class="tile__sub">' + esc(tile.sub) + "</div>" : "");

        if (tile.soon) {
            return '<div class="tile tile--soon"><div class="tile__main">' + head + "</div>" +
                '<div class="tile__meta">Připravujeme</div></div>';
        }

        // štítky podsekcí jsou samostatné odkazy (proto dlaždice není celá <a>)
        const children = sortedChildren(tile);
        const link = (child) =>
            '<a class="chip" href="navody.html?kat=' + tile.cat + "&sub=" + child.id + '">' +
            esc(child.title) + "</a>";

        let chips = "";
        if (children.length) {
            chips = '<div class="tile__children">' +
                children.slice(0, VISIBLE_CHIPS).map(link).join("") + "</div>";

            const rest = children.slice(VISIBLE_CHIPS);
            if (rest.length) {
                chips += '<div class="tile__children">' +
                        '<button type="button" class="chip chip--more" data-more="' + tile.cat + '">' +
                        "Další sekce (" + rest.length + ") ▾</button>" +
                    "</div>" +
                    '<div class="tile__children" data-morelist="' + tile.cat + '" hidden>' +
                        rest.map(link).join("") + "</div>";
            }
        }

        const main = tile.action
            ? '<button type="button" class="tile__main" data-action="' + tile.action + '" style="cursor:pointer;background:none;border:none;font:inherit">' + head + "</button>"
            : '<a class="tile__main" href="' + tile.href + '">' + head + "</a>";

        return '<div class="tile">' + main + chips + "</div>";
    }

    // nadpis sekce je rovnou proklik na její výpis (stejný princip jako
    // tlačítka nad lištou); bez odkazu zůstává obyčejný nadpis
    const sectionHtml = (section, tiles) =>
        '<section id="sec-' + section.id + '">' +
            '<div class="section-head">' +
                (section.href
                    ? '<a class="sectionbtn" href="' + section.href + '">' +
                        icon(section.icon || "library") + esc(section.title) + "</a>"
                    : "<h2>" + esc(section.title) + "</h2>") +
                (section.desc ? "<p>" + esc(section.desc) + "</p>" : "") +
            "</div>" +
            '<div class="tilegrid">' + tiles + "</div>" +
        "</section>";

    function renderSections() {
        document.getElementById("sections").innerHTML = window.KB_SECTIONS
            .map(section => sectionHtml(section, section.tiles.map(tileHtml).join(""))).join("");
    }

    // rozbalení zbylých podsekcí v dlaždici
    document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-more]");
        if (!button) return;
        const list = document.querySelector('[data-morelist="' + button.dataset.more + '"]');
        if (!list) return;
        list.hidden = !list.hidden;
        button.textContent = list.hidden
            ? "Další sekce (" + list.children.length + ") ▾"
            : "Skrýt ▴";
    });

    /* ------------------------------------------------- nástěnka člověka --
       Dvě poloviny: vlevo úkoly zadané přihlášenému, vpravo TO-DO rozpad
       vybraného úkolu. Postup se zapisuje rovnou tady – posílá se jen
       `todo` a `stav` (KB.ulozUkolPostup), víc pravidla nedovolí. */

    const PCT_KROKY = [0, 25, 50, 75, 95, 100];
    let vybranyUkol = "";
    let sledovaniZapnuto = false;

    function zapniSledovani() {
        if (sledovaniZapnuto || !window.KB.currentUid || !window.KB.currentUid()) return;
        sledovaniZapnuto = true;
        // manažer poslouchá všechno (kvůli roletce projektů v liště),
        // ostatní jen svoje – širší dotaz by jim databáze odmítla
        if (window.KBUI.can("vykaz.view")) {
            window.KB.watchUkoly();
            window.KB.watchProjekty();
        } else {
            window.KB.watchMojeUkoly();
            window.KB.watchMojeProjekty();
        }
    }

    const czDatum = (iso) => {
        if (!iso) return "";
        const [y, m, d] = iso.split("-");
        return Number(d) + ". " + Number(m) + ". " + y;
    };

    const pctUkolu = (u) => (u.todo && u.todo.length)
        ? Math.round(u.todo.reduce((s, t) => s + (Number(t.pct) || 0), 0) / u.todo.length)
        : (u.stav === "hotovo" ? 100 : 0);

    function mojeUkoly() {
        const uid = window.KB.currentUid ? window.KB.currentUid() : "";
        return (window.KB.ukoly || [])
            .filter(u => u.stav !== "hotovo" && (u.prirazeni || []).indexOf(uid) !== -1);
    }

    function renderNastenka() {
        const krestni = (window.KB_USER || "").split(" ")[0];
        document.getElementById("nastenkaPozdrav").textContent =
            krestni ? "Nástěnka – " + krestni : "Moje nástěnka";

        const seznam = mojeUkoly();
        if (!seznam.some(u => u.id === vybranyUkol)) vybranyUkol = seznam.length ? seznam[0].id : "";

        document.getElementById("mojeUkoly").innerHTML = seznam.map(u => {
            const pct = pctUkolu(u);
            const meta = [u.projekt, u.termin ? "termín " + czDatum(u.termin) : ""]
                .filter(Boolean).join(" · ");
            return '<button type="button" class="mujukol' +
                (u.id === vybranyUkol ? " je-vybrany" : "") + '" data-vyber="' + esc(u.id) + '">' +
                '<span class="grow"><span class="mujukol__nazev">' + esc(u.nazev) + "</span>" +
                '<span class="mujukol__meta" style="display:block">' + esc(meta) + "</span></span>" +
                '<span class="mujukol__prubeh"><i style="width:' + pct + '%"></i></span>' +
                '<span class="mujukol__pct">' + pct + " %</span>" +
            "</button>";
        }).join("") || '<div class="tiny muted" style="padding:10px 2px;line-height:1.6">' +
            "Žádný otevřený úkol. Nové úkoly zadávají manažeři na stránce Úkoly.</div>";

        const u = seznam.find(x => x.id === vybranyUkol);
        const odkaz = document.getElementById("todoOdkaz");
        odkaz.hidden = !u;
        if (u) odkaz.href = "ukoly.html?zak=" + encodeURIComponent(window.KBUI.slug(u.projekt || ""));

        document.getElementById("todoRozpad").innerHTML = !u
            ? '<div class="tiny muted" style="padding:10px 2px">Vyber vlevo úkol.</div>'
            : ((u.todo || []).map(t => {
                const kroky = PCT_KROKY.map(p =>
                    '<button type="button" class="ntodo__pct' +
                    ((Number(t.pct) || 0) === p ? " je-aktivni" : "") +
                    '" data-npct="' + p + '" data-ntodo="' + esc(t.id) + '">' + p + "&nbsp;%</button>").join("");
                return '<div class="ntodo"><span class="ntodo__text">' + esc(t.text) + "</span>" +
                    '<span class="ntodo__pcts">' + kroky + "</span></div>";
            }).join("") || '<div class="tiny muted" style="padding:10px 2px">Úkol nemá TO-DO rozpad.</div>');
    }

    async function zapisPct(todoId, pct) {
        const u = mojeUkoly().find(x => x.id === vybranyUkol);
        if (!u) return;
        const todo = (u.todo || []).map(t => t.id === todoId
            ? Object.assign({}, t, { pct: pct, by: window.KB_USER || "", ms: Date.now() }) : t);
        const hotovo = todo.length && todo.every(t => (Number(t.pct) || 0) === 100);
        try {
            await window.KB.ulozUkolPostup(u.id, todo, hotovo ? "hotovo" : "otevreny");
            if (hotovo) window.KBUI.toast("Úkol je hotový. 🎉");
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Zápis se nepovedl.", "error");
        }
    }

    document.addEventListener("click", (event) => {
        const vyber = event.target.closest("[data-vyber]");
        if (vyber) { vybranyUkol = vyber.dataset.vyber; return void renderNastenka(); }
        const pct = event.target.closest("[data-npct]");
        if (pct) zapisPct(pct.dataset.ntodo, Number(pct.dataset.npct));
    });

    /** Vloží nebo nahradí sekci; pořadí drží podle seznamu následníků. */
    function placeSection(id, html, beforeIds) {
        const host = document.getElementById(id);
        if (host) return void (host.outerHTML = html);

        const wrap = document.getElementById("sections");
        const holder = document.createElement("div");
        holder.innerHTML = html;
        const anchor = beforeIds.map(x => document.getElementById(x)).find(Boolean);
        wrap.insertBefore(holder.firstChild, anchor || null);
    }

    /* --------------------------------------------------- tabule na nápady */

    function renderBoards(boards) {
        const section = {
            id: "boards", title: "Tabule", href: "tabule.html", icon: "board",
            desc: "Nekonečné plátno na myšlenkové mapy, poznámky a náčrtky."
        };

        const list = (boards || []).slice(0, 6);
        const tiles = list.length
            ? list.map(board =>
                '<div class="tile">' +
                    '<a class="tile__main" href="tabule.html?id=' + encodeURIComponent(board.id) + '">' +
                        '<div class="tile__head">' +
                            '<div class="tile__icon">' + icon("board") + "</div>" +
                            '<div class="tile__title">' + esc((board.title || "Bez názvu").toUpperCase()) + "</div>" +
                        "</div>" +
                        '<div class="tile__sub">' +
                            (board.updatedBy ? "naposledy kreslil " + esc(board.updatedBy) : "zatím prázdná") +
                            (board.updatedMs ? " · " + new Date(board.updatedMs).toLocaleDateString("cs-CZ") : "") +
                        "</div>" +
                    "</a>" +
                "</div>").join("")
            : '<div class="tile"><a class="tile__main" href="tabule.html">' +
                '<div class="tile__head"><div class="tile__icon">' + icon("board") + "</div>" +
                '<div class="tile__title">ZALOŽIT TABULI</div></div>' +
                '<div class="tile__sub">Zatím tu žádná není. Klikni a založ první.</div>' +
              "</a></div>";

        placeSection("sec-boards", sectionHtml(section, tiles), ["sec-pripravujeme"]);
    }

    /* ---------------------------------------------------------- hledání */

    function guideRow(guide, query) {
        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div class="row row--wrap" style="gap:8px;margin-bottom:6px">' +
                '<span class="tag">' + esc(window.KB_categoryLabel(guide)) + "</span>" +
                '<span class="tiny muted">' + esc(guide.author || "Neznámý autor") + "</span>" +
            "</div>" +
            '<div style="font-size:15px;font-weight:900">' + window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
            (guide.desc ? '<div class="small muted" style="margin-top:4px;line-height:1.5">' +
                window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
        "</a>";
    }

    function runSearch(query) {
        const results = document.getElementById("searchResults");
        const sections = document.getElementById("sections");

        if (!query) {
            results.hidden = true;
            sections.hidden = false;
            return;
        }

        const found = window.KBUI.searchGuides(window.KB.guides, query);
        results.hidden = false;
        sections.hidden = true;
        document.getElementById("searchCount").textContent =
            found.length + " z " + window.KB.guides.length + " návodů";
        document.getElementById("searchList").innerHTML = found.length
            ? found.map(g => guideRow(g, query)).join("")
            : '<div class="card center" style="padding:34px;color:var(--muted);font-size:14px">' +
              'Nic nenalezeno. Zkus jiné slovo nebo <a href="navody.html" style="color:var(--accent)">projdi celou databázi</a>.</div>';
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "index.html", big: true });
        renderSections();
        renderNastenka();
        window.KBUI.onSearch(runSearch);

        // pořadí štítků závisí na tom, kde se naposledy upravovalo
        window.KB.on("guides", () => {
            renderSections();
            runSearch(window.KBUI.searchValue());
        });
        const obnov = () => { zapniSledovani(); renderNastenka(); };
        document.addEventListener("kb-role", obnov);
        window.KB.on("users", obnov);
        window.KB.on("ukoly", renderNastenka);
        renderBoards(window.KB.boards);
        window.KB.on("boards", (event) => renderBoards(event.detail));
    });
})();
</script>
</body>
</html>
