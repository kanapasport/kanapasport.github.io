<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pasport Kaňa">
    <meta name="theme-color" content="#c8102e">
    <title>Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=51">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* Nástěnka: dlaždice stejné velikosti (přání Michala) – proto pevná
           výška karty a rolování uvnitř, ne podle délky obsahu.
           Dvě vedle sebe a druhé dvě pod nimi, i na širokém monitoru: čtyři
           úzké sloupce ořezávaly názvy úkolů a jména víc, než kolik přinesly. */
        .nastenka { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 900px)  { .nastenka { grid-template-columns: 1fr; } }
        .nastenka__karta { display: flex; flex-direction: column; gap: 8px; padding: 16px; height: 330px; }
        .nastenka__telo { overflow-y: auto; flex: 1; min-height: 0; padding-right: 2px; }
        /* přepínač rozsahu v hlavičce karty – drobnější než běžný chip,
           aby hlavička zůstala jednořádková i na užším okně */
        .nastenka__prep { display: flex; align-items: center; gap: 6px; }
        .nastenka__prep .chip { padding: 3px 9px; font-size: 11px; }
        .mujukol { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
            border: 1px solid var(--line-soft); border-radius: var(--radius);
            background: var(--surface); cursor: pointer; text-align: left; font: inherit; width: 100%; }
        .mujukol:hover { border-color: var(--accent-lt); }
        .mujukol.je-vybrany { border-color: var(--accent); background: var(--accent-tint); }
        .mujukol__nazev { font-weight: 700; font-size: 13.5px; }
        .mujukol__meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .mujukol__prubeh { flex: none; width: 90px; height: 7px; border-radius: 99px; background: var(--bg); overflow: hidden; }
        .mujukol__prubeh i { display: block; height: 100%; background: var(--accent); }
        .mujukol__pct { flex: none; font-weight: 900; font-size: 12.5px; width: 40px; text-align: right; }
        .ntodo { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line-soft); }
        .ntodo:last-child { border-bottom: none; }
        .ntodo__text { flex: 1; min-width: 0; font-size: 13.5px; }
        .ntodo__pcts { display: flex; gap: 4px; flex-wrap: wrap; }
        .ntodo__pct { border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
            padding: 3px 8px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--muted); }
        .ntodo__pct.je-aktivni { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ntodo__pct:disabled { cursor: default; opacity: .55; }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main>

    <!-- ======================================================== výsledky -->
    <section id="searchResults" class="wrap" hidden style="padding-top:24px;padding-bottom:56px">
        <div class="section-head">
            <h2>Výsledky hledání</h2>
            <p id="searchCount"></p>
        </div>
        <div id="searchList" class="col" style="gap:10px"></div>
    </section>

    <!-- ================================================ nástěnka člověka -->
    <section id="nastenka" class="wrap" style="padding-top:22px">
        <div class="row" style="justify-content:flex-end;margin-bottom:10px">
            <button type="button" id="btnPrizpusob" class="btn btn--ghost btn--sm">Přizpůsobit</button>
        </div>
        <!-- co kdo na nástěnce chce – pamatuje si to prohlížeč každého zvlášť -->
        <div id="nastenkaVolby" class="row row--wrap card" hidden
             style="gap:14px;padding:10px 14px;margin-bottom:12px;font-size:13px">
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="ukoly" checked> Zadané úkoly</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="todo" checked> TO-DO</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="online" checked> Kdo tu byl</label>
            <label class="row" style="gap:6px;cursor:pointer" data-need="vykaz.view" hidden>
                <input type="checkbox" data-widget="aktivita" checked> Poslední aktivita</label>
        </div>

        <!-- všechny dlaždice stejně velké; delší obsah roluje uvnitř -->
        <div class="nastenka">
            <div class="card nastenka__karta" id="wUkoly">
                <div class="spread">
                    <b>Zadané úkoly</b>
                    <span class="nastenka__prep">
                        <button type="button" class="chip" data-rozsah="moje">Moje</button>
                        <button type="button" class="chip" data-rozsah="vse">Všechny</button>
                        <a class="linkbtn" href="ukoly.html?moje=1">otevřít →</a>
                    </span>
                </div>
                <div id="mojeUkoly" class="nastenka__telo col" style="gap:6px"></div>
            </div>
            <div class="card nastenka__karta" id="wTodo">
                <div class="spread">
                    <b>TO-DO — postup práce</b>
                    <a id="todoOdkaz" class="linkbtn" href="ukoly.html" hidden>otevřít →</a>
                </div>
                <div id="todoRozpad" class="nastenka__telo col" style="gap:2px"></div>
            </div>
            <div class="card nastenka__karta" id="wOnline">
                <div class="spread">
                    <b>Kdo tu byl</b>
                    <a class="linkbtn" href="reporty.html" data-need="vykaz.view" hidden>historie →</a>
                </div>
                <div id="onlineSeznam" class="nastenka__telo col" style="gap:4px"></div>
            </div>
            <!-- poslední aktivita je jen pro manažery – bez práv se karta nevykreslí -->
            <div class="card nastenka__karta" id="wAktivita" data-need="vykaz.view" hidden>
                <div class="spread">
                    <b>Poslední aktivita</b>
                    <a class="linkbtn" href="reporty.html">historie →</a>
                </div>
                <div id="aktivitaSeznam" class="nastenka__telo col" style="gap:4px;font-size:12.5px"></div>
            </div>
        </div>
    </section>

    <footer style="border-top:1px solid var(--line);padding:26px 0 calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--dim)">
        Pasport Kaňa · interní systém · data jsou určena pouze pro potřeby firmy
    </footer>
</main>

<script src="assets/js/taxonomy.js?v=51"></script>
<script src="assets/js/doc.js?v=51"></script>
<script src="assets/js/ui.js?v=51"></script>
<script src="assets/js/vykazy.js?v=51"></script>
<script type="module" src="assets/js/store.js?v=51"></script>

<script>
(function () {
    const esc = (value) => window.KBUI.esc(value);
    const V = window.KBVYK;
    const icon = (name) =>
        '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' + (window.KB_ICONS[name] || "") + "</svg>";

    /* ------------------------------------------------- nástěnka člověka --
       Dvě poloviny: vlevo úkoly zadané přihlášenému, vpravo TO-DO rozpad
       vybraného úkolu. Postup se zapisuje rovnou tady – posílá se jen
       `todo` a `stav` (KB.ulozUkolPostup), víc pravidla nedovolí. */

    const PCT_KROKY = [0, 25, 50, 75, 95, 100];
    let vybranyUkol = "";
    let sledovaniZapnuto = false;
    // rozsah karty úkolů: "moje" | "vse"; drží se jen v paměti stránky,
    // aby přepnutí přežilo překreslení, ale po načtení se začínalo od svých
    let rozsahUkolu = "moje";

    function zapniSledovani() {
        if (sledovaniZapnuto || !window.KB.currentUid || !window.KB.currentUid()) return;
        sledovaniZapnuto = true;
        // manažer poslouchá všechno (kvůli roletce projektů v liště),
        // ostatní jen svoje – širší dotaz by jim databáze odmítla
        if (window.KBUI.can("vykaz.view")) {
            window.KB.watchUkoly();
            window.KB.watchProjekty();
            window.KB.watchAktivity();
        } else {
            window.KB.watchMojeUkoly();
            window.KB.watchMojeProjekty();
        }
    }

    /* ---------------------------------------------- volitelné widgety ---
       Každý si zvolí, co na nástěnce chce; volba se drží v prohlížeči
       (na jiném počítači si ji člověk klikne znovu – to je v pořádku). */

    const VOLBY_KLIC = "kb-nastenka";

    const VYCHOZI_VOLBY = { ukoly: true, todo: true, online: true, aktivita: true };

    function nactiVolby() {
        try { return Object.assign({}, VYCHOZI_VOLBY,
            JSON.parse(localStorage.getItem(VOLBY_KLIC) || "{}")); }
        catch (err) { return Object.assign({}, VYCHOZI_VOLBY); }
    }

    function pouzijVolby() {
        const volby = nactiVolby();
        document.querySelectorAll("[data-widget]").forEach(ch => { ch.checked = volby[ch.dataset.widget] !== false; });
        // karta s data-need se skrývá i podle práv (paintUser), tady jen podle volby
        [["ukoly", "wUkoly"], ["todo", "wTodo"], ["online", "wOnline"], ["aktivita", "wAktivita"]]
            .forEach(([klic, id]) => {
                const karta = document.getElementById(id);
                if (volby[klic] === false) karta.style.display = "none";
                else karta.style.removeProperty("display");
            });
    }

    /**
     * Kdo tu byl. Otisk se obnovuje po pěti minutách, takže „před 3 minutami"
     * znamená „je tady teď"; starší časy říkají, kdy kdo naposledy pracoval.
     * Šest posledních – delší seznam patří do Reportů.
     */
    function predJakDlouho(ms) {
        const minut = Math.max(0, Math.round((Date.now() - ms) / 60000));
        if (minut < 6) return "právě teď";
        if (minut < 60) return "před " + minut + " minutami";
        const hodin = Math.round(minut / 60);
        if (hodin < 24) return "před " + hodin + (hodin === 1 ? " hodinou" :
            hodin < 5 ? " hodinami" : " hodinami");
        const dnu = Math.round(hodin / 24);
        return "před " + dnu + (dnu === 1 ? " dnem" : " dny");
    }

    function renderOnline() {
        const tady = (window.KB.pritomnost || [])
            .map(p => {
                const u = (window.KB.users || []).find(x => x.id === p.id);
                return { jmeno: u ? ((u.first || "") + " " + (u.last || "")).trim() : (p.jmeno || ""),
                         ms: Number(p.ms) || 0 };
            })
            .filter(p => p.jmeno)
            .sort((a, b) => b.ms - a.ms)
            .slice(0, 6);

        document.getElementById("onlineSeznam").innerHTML = tady.length
            ? tady.map(p => {
                const cerstvy = Date.now() - p.ms < 10 * 60 * 1000;
                return '<div class="row" style="gap:8px;padding:4px 0;border-bottom:1px dashed var(--line-soft)">' +
                    '<span style="flex:none;width:8px;height:8px;border-radius:50%;background:' +
                        (cerstvy ? "var(--ok)" : "var(--dim)") + '"></span>' +
                    '<span class="grow truncate" style="font-size:13px">' + esc(p.jmeno) + "</span>" +
                    '<span class="tiny muted" style="flex:none">' + esc(predJakDlouho(p.ms)) + "</span>" +
                "</div>";
            }).join("")
            : '<span class="tiny muted">Zatím tu nikdo nebyl – seznam se plní sám, jak se lidé přihlašují.</span>';
    }

    /** Poslední aktivita – jen manažeři (data chodí jen jim). */
    function renderAktivita() {
        const cas = (ms) => {
            const d = new Date(ms);
            return d.getDate() + ". " + (d.getMonth() + 1) + ". " +
                String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        };
        document.getElementById("aktivitaSeznam").innerHTML =
            (window.KB.aktivity || []).slice(0, 10).map(a =>
                '<div class="row" style="gap:8px;align-items:baseline">' +
                    '<span class="tiny muted" style="flex:none;width:86px">' + cas(a.ms) + "</span>" +
                    "<span><b>" + esc(a.jmeno || "") + "</b> " + esc(a.text || "") + "</span>" +
                "</div>").join("")
            || '<span class="tiny muted">Zatím žádné záznamy – historie se začne plnit používáním webu.</span>';
    }

    const czDatum = (iso) => {
        if (!iso) return "";
        const [y, m, d] = iso.split("-");
        return Number(d) + ". " + Number(m) + ". " + y;
    };

    const pctUkolu = (u) => (u.todo && u.todo.length)
        ? Math.round(u.todo.reduce((s, t) => s + (Number(t.pct) || 0), 0) / u.todo.length)
        : (u.stav === "hotovo" ? 100 : 0);

    const mojeUid = () => (window.KB.currentUid ? window.KB.currentUid() : "") || "";
    const jmenoUid = (uid) => { const u = V.clovek(uid); return u ? V.jmeno(u) : ""; };
    const jeMuj = (u) => (u.prirazeni || []).indexOf(mojeUid()) !== -1;

    /**
     * Co karta ukáže. „Moje" jsou úkoly, kde je přihlášený v `prirazeni`.
     * „Všechny" je prostě celé `KB.ukoly` – manažerovi tam databáze pošle
     * všechny úkoly, ostatním jen ty jejich (dotaz i pravidla to omezují),
     * takže víc než svoje stejně neuvidí a přepínač jim nic neprozradí.
     */
    function seznamUkolu() {
        return (window.KB.ukoly || []).filter(u => u.stav !== "hotovo" &&
            (rozsahUkolu === "vse" || jeMuj(u)));
    }

    function renderNastenka() {
        const seznam = seznamUkolu();
        // po přepnutí rozsahu může vybraný úkol z výpisu zmizet – ať pak
        // vpravo nesvítí TO-DO něčeho, co v seznamu vlevo není vidět
        if (!seznam.some(u => u.id === vybranyUkol)) vybranyUkol = seznam.length ? seznam[0].id : "";

        document.querySelectorAll("[data-rozsah]").forEach(tlacitko => {
            const zapnuto = tlacitko.dataset.rozsah === rozsahUkolu;
            tlacitko.classList.toggle("chip--active", zapnuto);
            tlacitko.setAttribute("aria-pressed", zapnuto ? "true" : "false");
        });

        document.getElementById("mojeUkoly").innerHTML = seznam.map(u => {
            const pct = pctUkolu(u);
            // u cizího úkolu je potřeba vědět, komu patří – u svých je to zbytečné
            const kdo = jeMuj(u) ? "" : (u.prirazeni || []).map(jmenoUid).filter(Boolean).join(", ");
            const meta = [u.projekt, kdo, u.termin ? "termín " + czDatum(u.termin) : ""]
                .filter(Boolean).join(" · ");
            return '<button type="button" class="mujukol' +
                (u.id === vybranyUkol ? " je-vybrany" : "") + '" data-vyber="' + esc(u.id) + '">' +
                '<span class="grow"><span class="mujukol__nazev">' + esc(u.nazev) + "</span>" +
                '<span class="mujukol__meta" style="display:block">' + esc(meta) + "</span></span>" +
                '<span class="mujukol__prubeh"><i style="width:' + pct + '%"></i></span>' +
                '<span class="mujukol__pct">' + pct + " %</span>" +
            "</button>";
        }).join("") || '<div class="tiny muted" style="padding:10px 2px;line-height:1.6">' +
            "Žádný otevřený úkol. Nové úkoly zadávají manažeři na stránce Úkoly.</div>";

        const u = seznam.find(x => x.id === vybranyUkol);
        const odkaz = document.getElementById("todoOdkaz");
        odkaz.hidden = !u;
        if (u) odkaz.href = "ukoly.html?zak=" + encodeURIComponent(window.KBUI.slug(u.projekt || ""));

        document.getElementById("todoRozpad").innerHTML = !u
            ? '<div class="tiny muted" style="padding:10px 2px">Vyber vlevo úkol.</div>'
            : ((u.todo || []).map(t => {
                const kroky = PCT_KROKY.map(p =>
                    '<button type="button" class="ntodo__pct' +
                    ((Number(t.pct) || 0) === p ? " je-aktivni" : "") +
                    '" data-npct="' + p + '" data-ntodo="' + esc(t.id) + '">' + p + "&nbsp;%</button>").join("");
                return '<div class="ntodo"><span class="ntodo__text">' + esc(t.text) + "</span>" +
                    '<span class="ntodo__pcts">' + kroky + "</span></div>";
            }).join("") || '<div class="tiny muted" style="padding:10px 2px">Úkol nemá TO-DO rozpad.</div>');
    }

    async function zapisPct(todoId, pct) {
        const u = seznamUkolu().find(x => x.id === vybranyUkol);
        if (!u) return;
        const todo = (u.todo || []).map(t => t.id === todoId
            ? Object.assign({}, t, { pct: pct, by: window.KB_USER || "", ms: Date.now() }) : t);
        const hotovo = todo.length && todo.every(t => (Number(t.pct) || 0) === 100);
        try {
            await window.KB.ulozUkolPostup(u.id, todo, hotovo ? "hotovo" : "otevreny");
            if (hotovo) window.KBUI.toast("Úkol je hotový. 🎉");
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Zápis se nepovedl.", "error");
        }
    }

    document.addEventListener("click", (event) => {
        const rozsah = event.target.closest("[data-rozsah]");
        if (rozsah) { rozsahUkolu = rozsah.dataset.rozsah; return void renderNastenka(); }
        const vyber = event.target.closest("[data-vyber]");
        if (vyber) { vybranyUkol = vyber.dataset.vyber; return void renderNastenka(); }
        const pct = event.target.closest("[data-npct]");
        if (pct) zapisPct(pct.dataset.ntodo, Number(pct.dataset.npct));
    });

    /* ---------------------------------------------------------- hledání */

    function guideRow(guide, query) {
        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div class="row row--wrap" style="gap:8px;margin-bottom:6px">' +
                '<span class="tag">' + esc(window.KB_categoryLabel(guide)) + "</span>" +
                '<span class="tiny muted">' + esc(guide.author || "Neznámý autor") + "</span>" +
            "</div>" +
            '<div style="font-size:15px;font-weight:900">' + window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
            (guide.desc ? '<div class="small muted" style="margin-top:4px;line-height:1.5">' +
                window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
        "</a>";
    }

    /* Hledání zůstává i tady – při psaní do pole v pásu se místo nástěnky
       ukážou nalezené návody. Dlaždice návodů na domovské stránce ale už
       nejsou, na ty vede lišta. */
    function runSearch(query) {
        const results = document.getElementById("searchResults");
        const nastenka = document.getElementById("nastenka");

        if (!query) {
            results.hidden = true;
            nastenka.hidden = false;
            return;
        }

        const found = window.KBUI.searchGuides(window.KB.guides, query);
        results.hidden = false;
        nastenka.hidden = true;
        document.getElementById("searchCount").textContent =
            found.length + " z " + window.KB.guides.length + " návodů";
        document.getElementById("searchList").innerHTML = found.length
            ? found.map(g => guideRow(g, query)).join("")
            : '<div class="card center" style="padding:34px;color:var(--muted);font-size:14px">' +
              'Nic nenalezeno. Zkus jiné slovo nebo <a href="navody.html" style="color:var(--accent)">projdi celou databázi</a>.</div>';
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "index.html", big: true });
        renderNastenka();
        window.KBUI.onSearch(runSearch);

        window.KB.on("guides", () => runSearch(window.KBUI.searchValue()));
        const obnov = () => { zapniSledovani(); renderNastenka(); renderOnline(); };
        document.addEventListener("kb-role", obnov);
        window.KB.on("users", obnov);
        window.KB.on("ukoly", renderNastenka);
        window.KB.on("pritomnost", renderOnline);
        window.KB.on("aktivity", renderAktivita);

        // přizpůsobení nástěnky
        document.getElementById("btnPrizpusob").addEventListener("click", () => {
            const volby = document.getElementById("nastenkaVolby");
            volby.hidden = !volby.hidden;
        });
        document.getElementById("nastenkaVolby").addEventListener("change", () => {
            const volby = {};
            document.querySelectorAll("[data-widget]").forEach(ch => { volby[ch.dataset.widget] = ch.checked; });
            try { localStorage.setItem(VOLBY_KLIC, JSON.stringify(volby)); } catch (err) {}
            pouzijVolby();
        });
        pouzijVolby();
        renderOnline();
    });
})();
</script>
</body>
</html>
