<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pasport Kaňa">
    <meta name="theme-color" content="#c8102e">
    <title>Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=61">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* Nástěnka: dlaždice stejné velikosti (přání Michala) – proto pevná
           výška karty a rolování uvnitř, ne podle délky obsahu.
           Šest dlaždic ve dvou sloupcích (2×3), i na širokém monitoru: víc
           úzkých sloupců ořezávalo názvy úkolů a jména víc, než kolik přineslo. */
        .nastenka { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 900px)  { .nastenka { grid-template-columns: 1fr; } }
        /* Dlaždice mají hlavičku jako blok nového výkazu: červený pruh
           s bílým štítkem. Karta se tím dá poznat okem dřív, než se člověk
           začte do nadpisu (přání Michala „udělej je barevnější"). */
        .nastenka__karta { display: flex; flex-direction: column; height: 330px;
            padding: 0; overflow: hidden; border-color: var(--accent-lt); }
        /* Hlavička je proklik: kliknutím na červené se otevře, co dlaždice
           nese (přání Michala – žádné drobné „otevřít" vpravo). Stejná výška
           u všech, i když v ní nejsou tlačítka. */
        .nastenka__hlava { display: flex; align-items: center; justify-content: space-between;
            gap: 10px; min-height: 42px; padding: 4px 14px; background: var(--accent);
            cursor: pointer; }
        .nastenka__hlava:hover { background: var(--accent-dark); }
        .nastenka__hlava b { font-size: 12px; font-weight: 900; letter-spacing: .09em;
            text-transform: uppercase; color: #fff; }
        .nastenka__telo { overflow-y: auto; flex: 1; min-height: 0; padding: 12px 14px; }
        /* přepínač rozsahu v hlavičce karty – drobnější než běžný chip,
           aby hlavička zůstala jednořádková i na užším okně */
        .nastenka__prep { display: flex; align-items: center; gap: 6px; }
        .nastenka__prep .chip { padding: 3px 9px; font-size: 11px;
            background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .45); color: #fff; }
        .nastenka__prep .chip--active { background: #fff; color: var(--accent); border-color: #fff; }

        /* Úkol i TO-DO nesou barvu podle rozpracovanosti – stejná stupnice
           jako na stránce úkolů, ať se to nikde nečte jinak. */
        .mujukol { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
            border: 1px solid var(--line-soft); border-radius: var(--radius);
            background: var(--surface); cursor: pointer; text-align: left; font: inherit; width: 100%; }
        .mujukol:hover { border-color: var(--accent-lt); }
        .mujukol.je-vybrany { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .mujukol--p0   { background: var(--p0-bg); }
        .mujukol--p50  { background: var(--p50-bg); }
        .mujukol--p75  { background: var(--p75-bg); }
        .mujukol--p95  { background: var(--p95-bg); }
        .mujukol--p100 { background: var(--p100-bg); }
        .mujukol__nazev { font-weight: 800; font-size: 13.5px; }
        .mujukol__meta { font-size: 11.5px; color: var(--text-soft); margin-top: 1px; }
        .mujukol__prubeh { flex: none; width: 90px; height: 7px; border-radius: 99px;
            background: rgba(255, 255, 255, .65); overflow: hidden; }
        .mujukol__prubeh i { display: block; height: 100%; background: var(--accent); }
        .mujukol--p100 .mujukol__prubeh i { background: var(--p100-fg); }
        .mujukol__pct { flex: none; font-weight: 900; font-size: 12.5px; width: 40px; text-align: right; }
        .mujukol--p0   .mujukol__pct { color: var(--p0-fg); }
        .mujukol--p50  .mujukol__pct { color: var(--p50-fg); }
        .mujukol--p75  .mujukol__pct { color: var(--p75-fg); }
        .mujukol--p95  .mujukol__pct { color: var(--p95-fg); }
        .mujukol--p100 .mujukol__pct { color: var(--p100-fg); }

        /* Stejná výška řádku v obou stylech zapisování procent – přepnutí
           na „styl %" nesmí řádky přeskládat (přání Michala). */
        .ntodo { display: flex; align-items: center; gap: 10px; padding: 4px 10px;
            min-height: 44px; border-radius: var(--radius); margin-bottom: 4px; }
        .ntodo--p0   { background: var(--p0-bg); }
        .ntodo--p50  { background: var(--p50-bg); }
        .ntodo--p75  { background: var(--p75-bg); }
        .ntodo--p95  { background: var(--p95-bg); }
        .ntodo--p100 { background: var(--p100-bg); }
        .ntodo__text { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; }
        .ntodo--p100 .ntodo__text { text-decoration: line-through; opacity: .75; }
        .ntodo__pcts { display: flex; gap: 4px; flex-wrap: wrap; }
        .ntodo__pct { border: 1px solid rgba(0, 0, 0, .12); background: rgba(255, 255, 255, .7);
            border-radius: 99px; padding: 3px 8px; font-size: 11px; font-weight: 700;
            cursor: pointer; color: var(--text-soft); }
        .ntodo__pct.je-aktivni { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ntodo__pct:disabled { cursor: default; opacity: .55; }
        /* jedno číslo, na které se klikne a posune se po krocích – výchozí
           způsob ze starého webu; podrobná řada se zapne přepínačem */
        .ntodo__cyklus { border: 1px solid rgba(0, 0, 0, .12); background: rgba(255, 255, 255, .7);
            border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 900;
            cursor: pointer; color: var(--text-soft); min-width: 56px; }
        .ntodo--p0   .ntodo__cyklus { color: var(--p0-fg); }
        .ntodo--p50  .ntodo__cyklus { color: var(--p50-fg); }
        .ntodo--p75  .ntodo__cyklus { color: var(--p75-fg); }
        .ntodo--p95  .ntodo__cyklus { color: var(--p95-fg); }
        .ntodo--p100 .ntodo__cyklus { color: var(--p100-fg); }
        /* Nadpis vybraného úkolu hned pod hlavičkou TO-DO – opravdový
           nadpis, ne drobný řádek: podle něj se člověk orientuje, čí postup
           dole odškrtává. Projekt za ním jde menším šedým písmem. */
        .todonazev { font-size: 16px; font-weight: 900; line-height: 1.3;
            padding: 10px 14px 0; }
        .todonazev span { font-size: 12.5px; font-weight: 400; color: var(--muted); }

        /* Quick TO-DO: vzkaz s fajfkou vlevo; hotové řádky blednou, ať oči
           táhnou jen ty, co ještě čekají. */
        .qt { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0;
            border-bottom: 1px dashed var(--line-soft); }
        .qt:last-child { border-bottom: none; }
        .qt__fajfka { flex: none; width: 15px; height: 15px; margin-top: 3px; cursor: pointer; }
        .qt__text { font-weight: 700; font-size: 13.5px; line-height: 1.4; }
        .qt--hotovy .qt__text { color: var(--muted); text-decoration: line-through; font-weight: 600; }
        .qt__meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        /* prošlý termín červeně – stejný odstín jako přečerpaný rozpočet ve výkazech */
        .qt__meta--pozde { color: #b91c1c; font-weight: 700; }
        .qt__smaz { flex: none; border: none; background: none; font: inherit; font-size: 16px;
            line-height: 1; padding: 2px 5px; color: var(--muted); cursor: pointer; border-radius: 4px; }
        .qt__smaz:hover { color: #b91c1c; background: var(--bg); }
        .qtposlal { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
        .qtposlal__nadpis { font-size: 10.5px; font-weight: 900; letter-spacing: .07em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
        .qtposlal__radek { display: flex; align-items: center; gap: 8px; padding: 3px 0;
            font-size: 12px; color: var(--text-soft); min-width: 0; }
        .qtposlal__stav { flex: none; color: var(--muted); }
        .qtposlal__stav.je-hotovo { color: var(--ok); font-weight: 700; }

        /* Kalendář na nástěnce: dny pod sebou, tečky nesou stejné barvy druhů
           jako kalendar.html (.ud--*) – ať obě stránky čtou stejně. */
        .kden__nazev { font-size: 10.5px; font-weight: 900; letter-spacing: .07em;
            text-transform: uppercase; color: var(--muted); padding: 6px 0 3px;
            border-bottom: 1px solid var(--line-soft); margin-bottom: 3px; }
        .kden--dnes .kden__nazev { color: var(--accent); }
        .kudal { display: flex; align-items: center; gap: 8px; padding: 3px 0;
            font-size: 13px; min-width: 0; }
        /* neznámý druh (starší zápis) zůstane šedý, ať se neztratí beze stopy */
        .kudal__tecka { flex: none; width: 9px; height: 9px; border-radius: 3px; background: var(--dim); }
        .kudal--ukol { color: #c26a00; font-weight: 700; }
        .ktyp--udalost { background: #0f62c4; }
        .ktyp--dovolena { background: #0d7d3f; }
        .ktyp--nemoc { background: #c8102e; }
        .ktyp--skoleni { background: #8a2be2; }
        .ktyp--homeoffice { background: #0e7490; }
        .ktyp--ukol { background: #c26a00; }

        /* Poslední aktivita: čas drobně nad textem, jméno tučně – jedno malé
           písmo v řádku splývalo do šedé kaše a špatně se četlo. */
        .akt { display: flex; flex-direction: column; gap: 1px; }
        .akt__cas { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .akt__text { font-size: 13.5px; line-height: 1.55; }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main>

    <!-- ======================================================== výsledky -->
    <section id="searchResults" class="wrap" hidden style="padding-top:24px;padding-bottom:56px">
        <div class="section-head">
            <h2>Výsledky hledání</h2>
            <p id="searchCount"></p>
        </div>
        <div id="searchList" class="col" style="gap:10px"></div>
    </section>

    <!-- ================================================ nástěnka člověka -->
    <section id="nastenka" class="wrap" style="padding-top:22px">
        <div class="row" style="justify-content:flex-end;margin-bottom:10px">
            <button type="button" id="btnPrizpusob" class="btn btn--ghost btn--sm">Přizpůsobit</button>
        </div>
        <!-- co kdo na nástěnce chce – pamatuje si to prohlížeč každého zvlášť -->
        <div id="nastenkaVolby" class="row row--wrap card" hidden
             style="gap:14px;padding:10px 14px;margin-bottom:12px;font-size:13px">
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="ukoly" checked> Zadané úkoly</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="todo" checked> TO-DO</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="quick" checked> Quick TO-DO</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="kalendar" checked> Kalendář</label>
            <label class="row" style="gap:6px;cursor:pointer">
                <input type="checkbox" data-widget="online" checked> Kdo tu byl</label>
            <label class="row" style="gap:6px;cursor:pointer" data-need="vykaz.view" hidden>
                <input type="checkbox" data-widget="aktivita" checked> Poslední aktivita</label>
        </div>

        <!-- všechny dlaždice stejně velké; delší obsah roluje uvnitř -->
        <div class="nastenka">
            <div class="card nastenka__karta" id="wUkoly">
                <div class="nastenka__hlava" data-otevri="ukoly.html?moje=1" title="Otevřít úkoly">
                    <b>Zadané úkoly</b>
                    <span class="nastenka__prep">
                        <button type="button" class="chip" data-rozsah="moje">Moje</button>
                        <button type="button" class="chip" data-rozsah="vse">Všechny</button>
                                            </span>
                </div>
                <div id="mojeUkoly" class="nastenka__telo col" style="gap:6px"></div>
            </div>
            <div class="card nastenka__karta" id="wTodo">
                <div class="nastenka__hlava" data-otevri="ukoly.html" data-otevri-todo title="Otevřít úkol">
                    <b>TO-DO — postup práce</b>
                    <span class="nastenka__prep">
                        <button type="button" class="chip" id="prepPodrobne" hidden
                            title="Přepne mezi jedním číslem a řadou kroků">styl %</button>
                                            </span>
                </div>
                <!-- nadpis vybraného úkolu – plní ho renderNastenka přes textContent -->
                <div id="todoNazev" class="todonazev" hidden></div>
                <div id="todoRozpad" class="nastenka__telo col" style="gap:2px"></div>
            </div>
            <div class="card nastenka__karta" id="wQuick">
                <div class="nastenka__hlava" data-otevri="panel" title="Otevřít panel Quick TO-DO">
                    <b>Quick TO-DO</b>
                </div>
                <div id="quickSeznam" class="nastenka__telo"></div>
            </div>
            <div class="card nastenka__karta" id="wKalendar">
                <div class="nastenka__hlava" data-otevri="kalendar.html" title="Otevřít kalendář">
                    <b>Kalendář — dnes a nejbližší dny</b>
                                    </div>
                <div id="kalendarSeznam" class="nastenka__telo"></div>
            </div>
            <div class="card nastenka__karta" id="wOnline">
                <div class="nastenka__hlava" data-otevri="reporty.html" data-jen-need="vykaz.view" title="Otevřít historii">
                    <b>Kdo tu byl</b>
                                    </div>
                <div id="onlineSeznam" class="nastenka__telo col" style="gap:4px"></div>
            </div>
            <!-- poslední aktivita je jen pro manažery – bez práv se karta nevykreslí -->
            <div class="card nastenka__karta" id="wAktivita" data-need="vykaz.view" hidden>
                <div class="nastenka__hlava" data-otevri="reporty.html" title="Otevřít historii">
                    <b>Poslední aktivita</b>
                                    </div>
                <div id="aktivitaSeznam" class="nastenka__telo col" style="gap:8px"></div>
            </div>
        </div>
    </section>

    <footer style="border-top:1px solid var(--line);padding:26px 0 calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--dim)">
        Pasport Kaňa · interní systém · data jsou určena pouze pro potřeby firmy
    </footer>
</main>

<script>
(function () {
    const esc = (value) => window.KBUI.esc(value);
    const V = window.KBVYK;
    const icon = (name) =>
        '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' + (window.KB_ICONS[name] || "") + "</svg>";

    /* ------------------------------------------------- nástěnka člověka --
       Dvě poloviny: vlevo úkoly zadané přihlášenému, vpravo TO-DO rozpad
       vybraného úkolu. Postup se zapisuje rovnou tady – posílá se jen
       `todo` a `stav` (KB.ulozUkolPostup), víc pravidla nedovolí. */

    const PCT_KROKY = [0, 25, 50, 75, 95, 100];
    let vybranyUkol = "";
    let sledovaniZapnuto = false;
    // rozsah karty úkolů: "moje" | "vse"; drží se jen v paměti stránky,
    // aby přepnutí přežilo překreslení, ale po načtení se začínalo od svých
    let rozsahUkolu = "moje";

    function zapniSledovani() {
        if (sledovaniZapnuto || !window.KB.currentUid || !window.KB.currentUid()) return;
        sledovaniZapnuto = true;
        // manažer poslouchá všechno (kvůli roletce projektů v liště),
        // ostatní jen svoje – širší dotaz by jim databáze odmítla
        if (window.KBUI.can("vykaz.view")) {
            window.KB.watchUkoly();
            window.KB.watchProjekty();
            window.KB.watchAktivity();
        } else {
            window.KB.watchMojeUkoly();
            window.KB.watchMojeProjekty();
        }
    }

    /* ---------------------------------------------- volitelné widgety ---
       Každý si zvolí, co na nástěnce chce; volba se drží v prohlížeči
       (na jiném počítači si ji člověk klikne znovu – to je v pořádku). */

    const VOLBY_KLIC = "kb-nastenka";

    const VYCHOZI_VOLBY = { ukoly: true, todo: true, quick: true, kalendar: true,
        online: true, aktivita: true };

    function nactiVolby() {
        try { return Object.assign({}, VYCHOZI_VOLBY,
            JSON.parse(localStorage.getItem(VOLBY_KLIC) || "{}")); }
        catch (err) { return Object.assign({}, VYCHOZI_VOLBY); }
    }

    function pouzijVolby() {
        const volby = nactiVolby();
        document.querySelectorAll("[data-widget]").forEach(ch => { ch.checked = volby[ch.dataset.widget] !== false; });
        // karta s data-need se skrývá i podle práv (paintUser), tady jen podle volby
        [["ukoly", "wUkoly"], ["todo", "wTodo"], ["quick", "wQuick"],
         ["kalendar", "wKalendar"], ["online", "wOnline"], ["aktivita", "wAktivita"]]
            .forEach(([klic, id]) => {
                const karta = document.getElementById(id);
                if (volby[klic] === false) karta.style.display = "none";
                else karta.style.removeProperty("display");
            });
    }

    /**
     * Kdo tu byl. Otisk se obnovuje po pěti minutách, takže „před 3 minutami"
     * znamená „je tady teď"; starší časy říkají, kdy kdo naposledy pracoval.
     * Šest posledních – delší seznam patří do Reportů.
     */
    function predJakDlouho(ms) {
        const minut = Math.max(0, Math.round((Date.now() - ms) / 60000));
        if (minut < 6) return "právě teď";
        if (minut < 60) return "před " + minut + " minutami";
        const hodin = Math.round(minut / 60);
        if (hodin < 24) return "před " + hodin + (hodin === 1 ? " hodinou" :
            hodin < 5 ? " hodinami" : " hodinami");
        const dnu = Math.round(hodin / 24);
        return "před " + dnu + (dnu === 1 ? " dnem" : " dny");
    }

    function renderOnline() {
        const tady = (window.KB.pritomnost || [])
            .map(p => {
                const u = (window.KB.users || []).find(x => x.id === p.id);
                return { jmeno: u ? ((u.first || "") + " " + (u.last || "")).trim() : (p.jmeno || ""),
                         ms: Number(p.ms) || 0 };
            })
            .filter(p => p.jmeno)
            .sort((a, b) => b.ms - a.ms)
            .slice(0, 6);

        document.getElementById("onlineSeznam").innerHTML = tady.length
            ? tady.map(p => {
                const cerstvy = Date.now() - p.ms < 10 * 60 * 1000;
                return '<div class="row" style="gap:8px;padding:4px 0;border-bottom:1px dashed var(--line-soft)">' +
                    '<span style="flex:none;width:8px;height:8px;border-radius:50%;background:' +
                        (cerstvy ? "var(--ok)" : "var(--dim)") + '"></span>' +
                    '<span class="grow truncate" style="font-size:13px">' + esc(p.jmeno) + "</span>" +
                    '<span class="tiny muted" style="flex:none">' + esc(predJakDlouho(p.ms)) + "</span>" +
                "</div>";
            }).join("")
            : '<span class="tiny muted">Zatím tu nikdo nebyl – seznam se plní sám, jak se lidé přihlašují.</span>';
    }

    /** Poslední aktivita – jen manažeři (data chodí jen jim). */
    function renderAktivita() {
        const cas = (ms) => {
            const d = new Date(ms);
            return d.getDate() + ". " + (d.getMonth() + 1) + ". " +
                String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        };
        // čas drobně nad textem – v řádku vedle sebe se čas a věta praly o místo
        document.getElementById("aktivitaSeznam").innerHTML =
            (window.KB.aktivity || []).slice(0, 10).map(a =>
                '<div class="akt">' +
                    '<span class="akt__cas">' + esc(cas(a.ms)) + "</span>" +
                    '<span class="akt__text"><b>' + esc(a.jmeno || "") + "</b> " + esc(a.text || "") + "</span>" +
                "</div>").join("")
            || '<span class="tiny muted">Zatím žádné záznamy – historie se začne plnit používáním webu.</span>';
    }

    const czDatum = (iso) => {
        if (!iso) return "";
        const [y, m, d] = iso.split("-");
        return Number(d) + ". " + Number(m) + ". " + y;
    };

    const pctUkolu = (u) => (u.todo && u.todo.length)
        ? Math.round(u.todo.reduce((s, t) => s + (Number(t.pct) || 0), 0) / u.todo.length)
        : (u.stav === "hotovo" ? 100 : 0);

    /* Stupeň rozpracovanosti pro barvu – stejná stupnice jako na stránce
       úkolů a na starém webu, ať se to nikde nečte jinak. */
    function pctUroven(pct) {
        const v = Number(pct) || 0;
        if (v >= 100) return "p100";
        if (v >= 95)  return "p95";
        if (v >= 75)  return "p75";
        if (v > 0)    return "p50";
        return "p0";
    }

    /* Jak si člověk přeje zapisovat procenta. Výchozí je jedno číslo
       (jako na starém webu); „% podrobně" ukáže celou řadu kroků.
       Volba je osobní, drží ji prohlížeč. */
    const PODROBNE_KLIC = "kb-pct-podrobne";
    const podrobne = () => {
        try { return localStorage.getItem(PODROBNE_KLIC) === "1"; } catch (err) { return false; }
    };
    const nastavPodrobne = (zap) => {
        try { localStorage.setItem(PODROBNE_KLIC, zap ? "1" : "0"); } catch (err) {}
    };

    const mojeUid = () => (window.KB.currentUid ? window.KB.currentUid() : "") || "";
    const jmenoUid = (uid) => { const u = V.clovek(uid); return u ? V.jmeno(u) : ""; };
    const jeMuj = (u) => (u.prirazeni || []).indexOf(mojeUid()) !== -1;

    /**
     * Co karta ukáže. „Moje" jsou úkoly, kde je přihlášený v `prirazeni`.
     * „Všechny" je prostě celé `KB.ukoly` – manažerovi tam databáze pošle
     * všechny úkoly, ostatním jen ty jejich (dotaz i pravidla to omezují),
     * takže víc než svoje stejně neuvidí a přepínač jim nic neprozradí.
     */
    function seznamUkolu() {
        return (window.KB.ukoly || []).filter(u => u.stav !== "hotovo" &&
            (rozsahUkolu === "vse" || jeMuj(u)));
    }

    function renderNastenka() {
        const seznam = seznamUkolu();
        // po přepnutí rozsahu může vybraný úkol z výpisu zmizet – ať pak
        // vpravo nesvítí TO-DO něčeho, co v seznamu vlevo není vidět
        if (!seznam.some(u => u.id === vybranyUkol)) vybranyUkol = seznam.length ? seznam[0].id : "";

        document.querySelectorAll("[data-rozsah]").forEach(tlacitko => {
            const zapnuto = tlacitko.dataset.rozsah === rozsahUkolu;
            tlacitko.classList.toggle("chip--active", zapnuto);
            tlacitko.setAttribute("aria-pressed", zapnuto ? "true" : "false");
        });

        document.getElementById("mojeUkoly").innerHTML = seznam.map(u => {
            const pct = pctUkolu(u);
            // u cizího úkolu je potřeba vědět, komu patří – u svých je to zbytečné
            const kdo = jeMuj(u) ? "" : (u.prirazeni || []).map(jmenoUid).filter(Boolean).join(", ");
            const meta = [u.projekt, kdo, u.termin ? "termín " + czDatum(u.termin) : ""]
                .filter(Boolean).join(" · ");
            return '<button type="button" class="mujukol mujukol--' + pctUroven(pct) +
                (u.id === vybranyUkol ? " je-vybrany" : "") + '" data-vyber="' + esc(u.id) + '">' +
                '<span class="grow"><span class="mujukol__nazev">' + esc(u.nazev) + "</span>" +
                '<span class="mujukol__meta" style="display:block">' + esc(meta) + "</span></span>" +
                '<span class="mujukol__prubeh"><i style="width:' + pct + '%"></i></span>' +
                '<span class="mujukol__pct">' + pct + " %</span>" +
            "</button>";
        }).join("") || '<div class="tiny muted" style="padding:10px 2px;line-height:1.6">' +
            "Žádný otevřený úkol. Nové úkoly zadávají manažeři na stránce Úkoly.</div>";

        const u = seznam.find(x => x.id === vybranyUkol);

        // ať je na první pohled vidět, čí TO-DO se vpravo ukazuje
        const nazev = document.getElementById("todoNazev");
        nazev.hidden = !u;
        nazev.innerHTML = u ? esc(u.nazev) +
            (u.projekt ? " <span>· " + esc(u.projekt) + "</span>" : "") : "";

        // přepínač „% podrobně" se ukáže, jen když je co odškrtávat
        document.getElementById("prepPodrobne").hidden = !u;
        document.getElementById("prepPodrobne").classList.toggle("chip--active", podrobne());

        document.getElementById("todoRozpad").innerHTML = !u
            ? '<div class="tiny muted" style="padding:10px 2px">Vyber vlevo úkol.</div>'
            : ((u.todo || []).map(t => {
                const pct = Number(t.pct) || 0;
                /* Výchozí je jedno číslo jako na starém webu – kliknutím
                   se posune po krocích. Podrobnou řadu si každý zapne sám
                   a volba mu zůstane (localStorage). */
                const ovladani = podrobne()
                    ? '<span class="ntodo__pcts">' + PCT_KROKY.map(p =>
                        '<button type="button" class="ntodo__pct' + (pct === p ? " je-aktivni" : "") +
                        '" data-npct="' + p + '" data-ntodo="' + esc(t.id) + '">' + p + "&nbsp;%</button>").join("") +
                      "</span>"
                    : '<button type="button" class="ntodo__cyklus" data-ncyklus="' + esc(t.id) +
                      '" title="Klikni pro další krok">' + pct + " %</button>";
                return '<div class="ntodo ntodo--' + pctUroven(pct) + '">' +
                    '<span class="ntodo__text">' + esc(t.text) + "</span>" + ovladani + "</div>";
            }).join("") || '<div class="tiny muted" style="padding:10px 2px">Úkol nemá TO-DO rozpad.</div>');
    }

    /* -------------------------------------------------- Quick TO-DO ----
       Vzkazy pro mě nahoře (odškrtávají se), pod nimi drobně co jsem
       poslal já. Nové se posílají z levého pásu. */

    function renderQuick() {
        const uid = mojeUid();
        const vse = window.KB.quicktodo || [];
        const proMe = vse.filter(q => q.proUid === uid);
        const odeMe = vse.filter(q => q.odKoho === uid && q.proUid !== uid);

        const termin = (q) => {
            if (!q.doKdy) return "";
            const poTerminu = !q.hotovo && q.doKdy < V.dnesISO();
            return ' · <span style="' + (poTerminu ? "color:var(--danger);font-weight:700" : "") +
                '">do ' + esc(czDatum(q.doKdy)) + "</span>";
        };

        const radek = (q, mujVzkaz) =>
            '<div class="row" style="gap:9px;padding:6px 0;border-bottom:1px dashed var(--line-soft);align-items:center">' +
                '<span class="grow" style="min-width:0;font-size:14.5px;line-height:1.5">' +
                    "<span style=\"" + (q.hotovo ? "text-decoration:line-through;color:var(--muted)" : "font-weight:700") + "\">" +
                        esc(q.text) + "</span>" +
                    '<span class="muted" style="display:block;font-size:12.5px">' +
                        (mujVzkaz ? "pro " + esc(jmenoUid(q.proUid) || "?")
                                  : "od " + esc(q.odKohoJmeno || jmenoUid(q.odKoho) || "?")) +
                        (q.projekt ? " · " + esc(q.projekt) : "") +
                        termin(q) + "</span>" +
                "</span>" +
                // splněné mizí ze seznamu – proto pořádné tlačítko, ne zaškrtávátko
                (q.hotovo
                    ? '<button type="button" class="btn btn--ghost btn--sm" data-quick-hotovo="' +
                        esc(q.id) + '" data-zpet="1">Vrátit</button>'
                    : '<button type="button" class="btn btn--sm quicksplnit" data-quick-hotovo="' +
                        esc(q.id) + '">Splněno</button>') +
                (q.odKoho === uid
                    ? '<button type="button" class="linkbtn" data-quick-smaz="' + esc(q.id) +
                      '" title="Smazat vzkaz" style="padding:2px 8px">×</button>' : "") +
            "</div>";

        /* Splněné se schovávají a seznam zůstává čistý; rozkliknou se dole. */
        const aktivniProMe = proMe.filter(q => !q.hotovo);
        const aktivniOdeMe = odeMe.filter(q => !q.hotovo);
        const splnene = proMe.concat(odeMe).filter(q => q.hotovo);

        document.getElementById("quickSeznam").innerHTML =
            (aktivniProMe.map(q => radek(q, false)).join("")
                || '<div class="tiny muted" style="padding:10px 2px;line-height:1.6">' +
                   "Žiješ šťastný život, nikdo po tobě nic nechce.</div>") +
            (aktivniOdeMe.length
                ? '<div class="tiny muted" style="padding:10px 2px 2px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">Poslal jsem</div>' +
                  aktivniOdeMe.map(q => radek(q, true)).join("")
                : "") +
            (splnene.length
                ? '<button type="button" class="linkbtn" data-quick-splnene-tile style="margin-top:12px">' +
                    (quickSplneneTile ? "Skrýt splněné" : "Zobrazit splněné Quick TO-DO (" + splnene.length + ")") +
                  "</button>" +
                  (quickSplneneTile
                      ? splnene.map(q => radek(q, q.odKoho === uid && q.proUid !== uid)).join("") : "")
                : "");
    }

    let quickSplneneTile = false;

    /* Splněno / Vrátit / smazání / rozbalení splněných – panel v pásu má
       vlastní obsluhu v ui.js, tohle patří jen dlaždici. */
    document.addEventListener("click", (event) => {
        if (event.target.closest("[data-quick-splnene-tile]")) {
            quickSplneneTile = !quickSplneneTile;
            return void renderQuick();
        }
        const hotovoBtn = event.target.closest("#quickSeznam [data-quick-hotovo]");
        if (hotovoBtn) {
            const q = (window.KB.quicktodo || []).find(x => x.id === hotovoBtn.dataset.quickHotovo);
            if (q) window.KB.saveQuickTodo(q.id, Object.assign({}, q, { hotovo: !hotovoBtn.dataset.zpet }))
                .catch(() => window.KBUI.toast("Uložení selhalo.", "error"));
            return;
        }
        const smaz = event.target.closest("#quickSeznam [data-quick-smaz]");
        if (smaz) window.KB.deleteQuickTodo(smaz.dataset.quickSmaz)
            .catch(() => window.KBUI.toast("Smazání selhalo.", "error"));
    });

    /* Klik na červenou hlavičku otevře, co dlaždice nese. Tlačítka a odkazy
       uvnitř hlavičky mají přednost a proklik nespouští. */
    document.addEventListener("click", (event) => {
        const hlava = event.target.closest("[data-otevri]");
        if (!hlava || event.target.closest("button, a, input, select")) return;
        const cil = hlava.dataset.otevri;
        if (hlava.dataset.jenNeed && !window.KBUI.can(hlava.dataset.jenNeed)) return;
        if (cil === "panel") {
            const tlacitko = document.querySelector("[data-quick-otevri]");
            if (tlacitko) tlacitko.click();
            return;
        }
        if (hlava.hasAttribute("data-otevri-todo")) {
            const u = seznamUkolu().find(x => x.id === vybranyUkol);
            location.href = u ? "ukoly.html?zak=" + encodeURIComponent(window.KBUI.slug(u.projekt || "")) : cil;
            return;
        }
        location.href = cil;
    });

    /* ------------------------------------------- kalendář na nástěnce ----
       Dnešek a nejbližší dny: absence a události z kalendáře plus termíny
       úkolů. Dny bez obsahu se vynechávají – prázdné řádky nic neřeknou. */

    const TYP_BARVA = { udalost: "#0f62c4", dovolena: "#0d7d3f", nemoc: "#c8102e",
        skoleni: "#8a2be2", homeoffice: "#0e7490" };
    const TYP_NAZEV = { udalost: "událost", dovolena: "Dovolená", nemoc: "Nemoc",
        skoleni: "Školení", homeoffice: "Home office" };

    function renderKalendarDlazdice() {
        const dny = [];
        const dnes = new Date();
        for (let i = 0; i < 7; i++) {
            const d = new Date(dnes.getFullYear(), dnes.getMonth(), dnes.getDate() + i);
            const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
                "-" + String(d.getDate()).padStart(2, "0");

            const radky = [];
            (window.KB.kalendar || []).forEach(k => {
                if ((k.od || "") <= iso && iso <= (k.do || k.od || "")) {
                    const druh = TYP_NAZEV[k.typ] || "událost";
                    radky.push({ barva: TYP_BARVA[k.typ] || TYP_BARVA.udalost,
                        text: k.typ === "udalost"
                            ? (k.text || "událost") + (k.osoba ? " – " + k.osoba : "")
                            : druh + " – " + (k.osoba || "") });
                }
            });
            (window.KB.ukoly || []).forEach(u => {
                if (u.termin === iso && u.stav !== "hotovo") {
                    radky.push({ barva: "#c26a00", text: "úkol: " + (u.nazev || "") });
                }
            });
            (window.KB.milniky || []).forEach(m => {
                if (m.datum === iso && !m.hotovo) {
                    radky.push({ barva: "#b3006b", text: "milník: " + (m.cinnost || "") +
                        (m.zakazka ? " (" + m.zakazka + ")" : "") });
                }
            });
            if (radky.length) dny.push({ iso, popis: i === 0 ? "Dnes" : i === 1 ? "Zítra" : czDatum(iso), radky });
        }

        document.getElementById("kalendarSeznam").innerHTML = dny.length
            ? dny.map(den =>
                '<div style="padding:5px 0;border-bottom:1px dashed var(--line-soft)">' +
                    '<span class="muted" style="font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase">' +
                        esc(den.popis) + "</span>" +
                    den.radky.map(r =>
                        '<span class="row" style="gap:8px;padding:3px 0;font-size:14.5px">' +
                            '<i style="flex:none;width:9px;height:9px;border-radius:3px;background:' + r.barva + '"></i>' +
                            '<span class="truncate">' + esc(r.text) + "</span></span>").join("") +
                "</div>").join("")
            : '<span class="muted" style="font-size:14px">Nejbližších sedm dní je volných.</span>';
    }

    async function zapisPct(todoId, pct) {
        const u = seznamUkolu().find(x => x.id === vybranyUkol);
        if (!u) return;
        const todo = (u.todo || []).map(t => t.id === todoId
            ? Object.assign({}, t, { pct: pct, by: window.KB_USER || "", ms: Date.now() }) : t);
        const hotovo = todo.length && todo.every(t => (Number(t.pct) || 0) === 100);
        try {
            await window.KB.ulozUkolPostup(u.id, todo, hotovo ? "hotovo" : "otevreny");
            if (hotovo) window.KBUI.toast("Úkol je hotový. 🎉");
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Zápis se nepovedl.", "error");
        }
    }

    document.addEventListener("click", (event) => {
        const rozsah = event.target.closest("[data-rozsah]");
        if (rozsah) { rozsahUkolu = rozsah.dataset.rozsah; return void renderNastenka(); }
        const vyber = event.target.closest("[data-vyber]");
        if (vyber) { vybranyUkol = vyber.dataset.vyber; return void renderNastenka(); }
        const pct = event.target.closest("[data-npct]");
        if (pct) return void zapisPct(pct.dataset.ntodo, Number(pct.dataset.npct));

        // klik na číslo posune procenta na další krok – jako na starém webu
        const cyklus = event.target.closest("[data-ncyklus]");
        if (cyklus) {
            const u = seznamUkolu().find(x => x.id === vybranyUkol);
            const t = u && (u.todo || []).find(x => x.id === cyklus.dataset.ncyklus);
            if (t) {
                const ted = Number(t.pct) || 0;
                const dalsi = PCT_KROKY.find(p => p > ted);
                zapisPct(t.id, dalsi === undefined ? 0 : dalsi);
            }
            return;
        }
        const prep = event.target.closest("#prepPodrobne");
        if (prep) { nastavPodrobne(!podrobne()); renderNastenka(); }
    });

    /* ---------------------------------------------------------- hledání */

    function guideRow(guide, query) {
        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div class="row row--wrap" style="gap:8px;margin-bottom:6px">' +
                '<span class="tag">' + esc(window.KB_categoryLabel(guide)) + "</span>" +
                '<span class="tiny muted">' + esc(guide.author || "Neznámý autor") + "</span>" +
            "</div>" +
            '<div style="font-size:15px;font-weight:900">' + window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
            (guide.desc ? '<div class="small muted" style="margin-top:4px;line-height:1.5">' +
                window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
        "</a>";
    }

    /* Hledání zůstává i tady – při psaní do pole v pásu se místo nástěnky
       ukážou nalezené návody. Dlaždice návodů na domovské stránce ale už
       nejsou, na ty vede lišta. */
    function runSearch(query) {
        const results = document.getElementById("searchResults");
        const nastenka = document.getElementById("nastenka");

        if (!query) {
            results.hidden = true;
            nastenka.hidden = false;
            return;
        }

        const found = window.KBUI.searchGuides(window.KB.guides, query);
        results.hidden = false;
        nastenka.hidden = true;
        document.getElementById("searchCount").textContent =
            found.length + " z " + window.KB.guides.length + " návodů";
        document.getElementById("searchList").innerHTML = found.length
            ? found.map(g => guideRow(g, query)).join("")
            : '<div class="card center" style="padding:34px;color:var(--muted);font-size:14px">' +
              'Nic nenalezeno. Zkus jiné slovo nebo <a href="navody.html" style="color:var(--accent)">projdi celou databázi</a>.</div>';
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "index.html", big: true });
        renderNastenka();
        window.KBUI.onSearch(runSearch);

        window.KB.on("guides", () => runSearch(window.KBUI.searchValue()));
        const obnov = () => { zapniSledovani(); renderNastenka(); renderOnline();
            renderQuick(); renderKalendarDlazdice(); };
        document.addEventListener("kb-role", obnov);
        window.KB.on("users", obnov);
        window.KB.on("ukoly", () => { renderNastenka(); renderKalendarDlazdice(); });
        window.KB.on("pritomnost", renderOnline);
        window.KB.on("aktivity", renderAktivita);
        window.KB.on("quicktodo", renderQuick);
        window.KB.on("kalendar", renderKalendarDlazdice);
        window.KB.on("milniky", renderKalendarDlazdice);

        // přizpůsobení nástěnky
        document.getElementById("btnPrizpusob").addEventListener("click", () => {
            const volby = document.getElementById("nastenkaVolby");
            volby.hidden = !volby.hidden;
        });
        document.getElementById("nastenkaVolby").addEventListener("change", () => {
            const volby = {};
            document.querySelectorAll("[data-widget]").forEach(ch => { volby[ch.dataset.widget] = ch.checked; });
            try { localStorage.setItem(VOLBY_KLIC, JSON.stringify(volby)); } catch (err) {}
            pouzijVolby();
        });
        pouzijVolby();
        renderOnline();
    });
})();
</script>
</body>
</html>
