<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasport Kaňa – firemní knowledge base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/app.css?v=1">
    <link rel="icon" href="Pasport_Kana_white.png">
</head>
<body class="min-h-screen font-sans">

<main class="hero-grid min-h-screen">

    <!-- ============================================================ hlavička -->
    <div class="max-w-[1180px] mx-auto px-6 pt-14 pb-10 text-center">

        <img src="Pasport_Kana_white.png" alt="Pasport Kaňa" class="h-24 md:h-28 mx-auto object-contain">

        <h1 class="mt-7 text-2xl md:text-3xl font-black tracking-tight text-white">
            Firemní knowledge base
        </h1>
        <p class="mt-2.5 text-sm text-slate-400 max-w-xl mx-auto leading-relaxed">
            Návody, pracovní postupy a metodika pasportizace na jednom místě.
            Vyber si oblast, nebo rovnou hledej v celé databázi.
        </p>

        <div class="mt-3 text-[11px] text-slate-500" data-cloud-status>Připojuji…</div>

        <!-- vyhledávání napříč celou databází -->
        <div class="mt-8 max-w-2xl mx-auto relative">
            <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input id="globalSearch" type="search" autocomplete="off"
                   placeholder="Hledat v návodech – název, postup, program, chyba…"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl pl-12 pr-4 py-3.5
                          text-sm text-white placeholder-slate-500 shadow-xl
                          focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
    </div>

    <!-- ============================================================ výsledky -->
    <section id="searchResults" class="hidden max-w-[1180px] mx-auto px-6 pb-14">
        <div class="section-head">
            <h2>Výsledky hledání</h2>
            <p id="searchCount"></p>
        </div>
        <div id="searchList" class="flex flex-col gap-2.5"></div>
    </section>

    <!-- ============================================================= sekce -->
    <div id="sections" class="max-w-[1180px] mx-auto px-6 pb-20 flex flex-col gap-14"></div>

    <footer class="border-t border-slate-800 py-8 text-center text-[11px] text-slate-600">
        Pasport Kaňa · interní dokumentace · data jsou určena pouze pro potřeby firmy
    </footer>
</main>

<script src="assets/js/taxonomy.js?v=1"></script>
<script src="assets/js/doc.js?v=1"></script>
<script src="assets/js/ui.js?v=1"></script>
<script type="module" src="assets/js/store.js?v=1"></script>

<script>
(function () {
    const icon = (name) =>
        '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' + (window.KB_ICONS[name] || "") + "</svg>";

    /* ------------------------------------------------------- dlaždice */

    function tileHtml(tile) {
        const accent = tile.accent || "#4f46e5";
        const inner =
            '<div>' +
                '<div class="tile__icon">' + icon(tile.icon) + "</div>" +
                '<div class="mt-3.5">' +
                    '<div class="tile__title">' + tile.title + "</div>" +
                    '<div class="tile__sub">' + (tile.sub || "") + "</div>" +
                "</div>" +
            "</div>" +
            (tile.children && tile.children.length
                ? '<div class="tile__children">' +
                    tile.children.slice(0, 4).map(child =>
                        '<span class="chip">' + child.title + "</span>").join("") +
                    (tile.children.length > 4
                        ? '<span class="chip">+' + (tile.children.length - 4) + "</span>" : "") +
                  "</div>"
                : "") +
            (tile.cat ? '<div class="tile__meta" data-count="' + tile.cat + '">—</div>'
                      : tile.soon ? '<div class="tile__meta">Připravujeme</div>' : "");

        if (tile.soon) return '<div class="tile tile--soon" style="--tile-accent:' + accent + '">' + inner + "</div>";
        if (tile.action) return '<button type="button" class="tile text-left" data-action="' + tile.action +
                                '" style="--tile-accent:' + accent + '">' + inner + "</button>";
        return '<a class="tile" href="' + tile.href + '" style="--tile-accent:' + accent + '">' + inner + "</a>";
    }

    function renderSections() {
        document.getElementById("sections").innerHTML = window.KB_SECTIONS.map(section =>
            "<section>" +
                '<div class="section-head">' +
                    "<h2>" + section.title + "</h2>" +
                    "<p>" + (section.desc || "") + "</p>" +
                "</div>" +
                '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
                    section.tiles.map(tileHtml).join("") +
                "</div>" +
            "</section>"
        ).join("");

        document.querySelectorAll("[data-action='ai-prompt']").forEach(button => {
            button.addEventListener("click", () => window.KBUI.copyAiPrompt());
        });
    }

    /* ------------------------------------------- počty návodů v kategoriích */

    function paintCounts(guides) {
        document.querySelectorAll("[data-count]").forEach(el => {
            const catId = el.dataset.count;
            const count = guides.filter(g => g.cat === catId).length;
            el.textContent = count === 0 ? "Zatím bez návodů"
                : count === 1 ? "1 návod"
                : count < 5 ? count + " návody"
                : count + " návodů";
        });
    }

    /* ---------------------------------------------------------- hledání */

    function guideRow(guide, query) {
        const label = window.KB_categoryLabel(guide);
        return '<a class="guide-row" href="navod.html?id=' + encodeURIComponent(guide.id) + '">' +
            '<div class="flex items-center gap-2 mb-1.5 flex-wrap">' +
                '<span class="text-[9px] font-extrabold uppercase tracking-wide bg-indigo-500/15 text-indigo-300 px-2 py-0.5 rounded">' +
                    window.KBDoc.esc(label) + "</span>" +
                '<span class="text-[10px] text-slate-500">' + window.KBDoc.esc(guide.author || "Neznámý autor") + "</span>" +
                '<span class="text-[10px] text-slate-600">' + (guide.version || "") + "</span>" +
            "</div>" +
            '<div class="text-sm font-bold text-white">' + window.KBUI.highlight(guide.title || "Bez názvu", query) + "</div>" +
            (guide.desc ? '<div class="text-xs text-slate-400 mt-1 line-clamp-2">' +
                window.KBUI.highlight(guide.desc, query) + "</div>" : "") +
        "</a>";
    }

    function runSearch() {
        const query = document.getElementById("globalSearch").value.trim();
        const resultsBox = document.getElementById("searchResults");
        const sectionsBox = document.getElementById("sections");

        if (!query) {
            resultsBox.classList.add("hidden");
            sectionsBox.classList.remove("hidden");
            return;
        }

        const found = window.KBUI.searchGuides(window.KB.guides, query);
        resultsBox.classList.remove("hidden");
        sectionsBox.classList.add("hidden");
        document.getElementById("searchCount").textContent =
            found.length + " z " + window.KB.guides.length + " návodů";
        document.getElementById("searchList").innerHTML = found.length
            ? found.map(g => guideRow(g, query)).join("")
            : '<div class="card p-8 text-center text-sm text-slate-500">Nic nenalezeno. ' +
              'Zkus jiné slovo nebo <a href="navody.html" class="text-indigo-400 underline">projdi celou databázi</a>.</div>';
    }

    /* ------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        renderSections();
        window.KBUI.bindCloudStatus("[data-cloud-status]");
        document.getElementById("globalSearch").addEventListener("input", runSearch);

        window.KB.on("guides", (event) => {
            paintCounts(event.detail);
            if (document.getElementById("globalSearch").value.trim()) runSearch();
        });
        if (window.KB.guides.length) paintCounts(window.KB.guides);
    });
})();
</script>
</body>
</html>
