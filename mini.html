<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1d556d">
    <meta name="robots" content="noindex, nofollow">
    <title>Mini okno – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=285">
    <link rel="stylesheet" href="assets/css/mini.css?v=285">
    <link rel="apple-touch-icon" href="ikona-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="Pasport_Kana_black.png">
</head>
<body class="mini-telo">

<!-- Mini okno: rychlý zápis dnešních hodin. Schválně bez lišty a svislého pásu
     (stránka nevolá mountNav) – vejde se do okna ~360 × 640. Celý kořen #mini
     se umí přestěhovat do plovoucího okna (assets/js/mini.js). -->
<div class="mini" id="mini">
    <header class="mini__hlava">
        <img class="mini__logo" data-mini-logo src="Pasport_Kana_white.png" alt="Pasport Kaňa">
        <div class="mini__hlavaakce">
            <button type="button" class="mini__hbtn" data-mini-plovouci hidden
                title="Plovoucí okno vždy navrchu">Plovoucí okno</button>
            <button type="button" class="mini__hbtn" data-mini-vratit hidden
                title="Vrátit mini okno z plovoucího okna">Vrátit</button>
            <button type="button" class="mini__hbtn" data-mini-cely
                title="Celý web (Alt+Shift+M)">Celý web</button>
        </div>
    </header>
    <div class="mini__telo" data-mini-telo>
        <section class="mini__karta mini__zprava"><p>Načítám…</p></section>
    </div>
</div>

<!-- místo mini okna, když je v plovoucím okně -->
<div class="mini-zastup" id="miniZastup" hidden>
    <p>Mini okno je teď v plovoucím okně.</p>
    <button type="button" class="btn btn--ghost btn--sm" data-mini-vratit>Vrátit sem</button>
</div>

<script src="assets/js/taxonomy.js?v=285"></script>
<script src="assets/js/ui.js?v=285"></script>
<script src="assets/js/vykazy.js?v=285"></script>
<script type="module" src="assets/js/store.js?v=285"></script>
<script src="assets/js/mini.js?v=285"></script>
</body>
</html>
