<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1d556d">
    <meta name="robots" content="noindex, nofollow">
    <title>Mini okno – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=295">
    <link rel="stylesheet" href="assets/css/mini.css?v=295">
    <link rel="apple-touch-icon" href="ikona-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="Pasport_Kana_black.png">
</head>
<body class="mini-telo">

<!-- Mini okno: rychlý zápis dnešních hodin a jednoduchý přehled (Quick TO-DO,
     hodiny proti fondu, úkoly s termínem, milníky). Schválně bez lišty
     a svislého pásu (stránka nevolá mountNav) – vejde se do okna ~360 × 640.
     Celý kořen #mini se umí přestěhovat do plovoucího okna a sbalit na
     proužek se šipkou (assets/js/mini.js). -->
<div class="mini" id="mini">
    <header class="mini__hlava">
        <div class="mini__hlavarad">
            <img class="mini__logo" data-mini-logo src="Pasport_Kana_white.png" alt="Pasport Kaňa">
            <div class="mini__hlavaakce">
                <button type="button" class="mini__hbtn" data-mini-plovouci hidden
                    title="Plovoucí okno vždy navrchu">Plovoucí okno</button>
                <button type="button" class="mini__hbtn" data-mini-vratit hidden
                    title="Vrátit mini okno z plovoucího okna">Vrátit</button>
                <button type="button" class="mini__hbtn" data-mini-cely
                    title="Celý web (Alt+Shift+M)">Celý web</button>
                <button type="button" class="mini__hbtn mini__hbtn--ikona" data-mini-sbalit hidden
                    title="Sbalit k okraji – zůstane proužek se šipkou" aria-label="Sbalit k okraji">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
                        fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M4 12h12M11 6l6 6-6 6M20 4v16"/></svg>
                </button>
            </div>
        </div>
        <div class="mini__zalozky" role="tablist" aria-label="Mini okno" data-mini-zalozky hidden>
            <button type="button" class="mini__zalozka" role="tab" id="miniTabZapis"
                aria-controls="miniPaneZapis" aria-selected="true" data-mini-zalozka="zapis">Zápis</button>
            <button type="button" class="mini__zalozka" role="tab" id="miniTabPrehled"
                aria-controls="miniPanePrehled" aria-selected="false" data-mini-zalozka="prehled">Přehled
                <b class="mini__odznak mini__odznak--zalozka" data-mini-zalozka-pocet hidden></b></button>
        </div>
    </header>
    <div class="mini__telo" data-mini-telo>
        <section class="mini__karta mini__zprava"><p>Načítám…</p></section>
    </div>
    <!-- sbalené okno: proužek se šipkou (jako video odsunuté k okraji na iPhonu) -->
    <div class="mini__prouzek" data-mini-prouzek>
        <button type="button" class="mini__vytahni" data-mini-vytahni
            title="Vytáhnout mini okno" aria-label="Vytáhnout mini okno">
            <span class="mini__sipka" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"
                focusable="false" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>
            <span class="mini__prouzekinfo" data-mini-prouzek-info></span>
        </button>
    </div>
</div>

<!-- místo mini okna, když je v plovoucím okně -->
<div class="mini-zastup" id="miniZastup" hidden>
    <p>Mini okno je teď v plovoucím okně.</p>
    <button type="button" class="btn btn--ghost btn--sm" data-mini-vratit>Vrátit sem</button>
</div>

<script src="assets/js/taxonomy.js?v=295"></script>
<script src="assets/js/ui.js?v=295"></script>
<script src="assets/js/vykazy.js?v=295"></script>
<script type="module" src="assets/js/store.js?v=295"></script>
<script src="assets/js/mini.js?v=295"></script>
</body>
</html>
