<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1d556d">
    <meta name="robots" content="noindex, nofollow">
    <title>Quick TO-DO – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=213">
    <link rel="apple-touch-icon" href="ikona-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* Stránka jen ukazuje – tvorba zůstává v panelu na pásu. Řádky
           (.quickrad) i nadpisy (.quickpanel__nadpis) jedou ze sdílených
           stylů, tady se jen omezí šířka, ať se dlouhé vzkazy dobře čtou. */
        .qstranka { max-width: 860px; }
        .qstranka .quickpanel__nadpis { margin-top: 18px; }
        .qstranka .quickpanel__nadpis:first-child { margin-top: 0; }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main class="wrap" style="padding-top:26px;padding-bottom:60px;display:flex;flex-direction:column;gap:16px">

    <div class="spread">
        <div>
            <h2 style="font-size:20px;font-weight:900;line-height:1.2">Quick TO-DO</h2>
            <p class="small muted" style="margin-top:3px;line-height:1.6">
                Rychlé vzkazy mezi lidmi – vidíš jen ty svoje: co ti kdo poslal
                a co jsi poslal ty. Splněný vzkaz zmizí všem, ostatní vidí, kdo ho splnil.
            </p>
        </div>
        <div class="row" style="gap:8px">
            <!-- tvorba jede přes panel na pásu – stejné tlačítko, stejné chování -->
            <button type="button" class="btn btn--primary" data-quick-otevri>+ Napsat vzkaz</button>
        </div>
    </div>

    <!-- ui.js kreslí seznam do každého [data-quick-seznam] – panel už žádný
         nemá (je jen na tvorbu), takže je tenhle jediný a přehled bydlí tady -->
    <section class="card qstranka" style="padding:16px 18px">
        <div data-quick-seznam>
            <span class="tiny muted">Načítám vzkazy…</span>
        </div>
    </section>

</main>

<script src="assets/js/taxonomy.js?v=213"></script>
<script src="assets/js/doc.js?v=213"></script>
<script src="assets/js/ui.js?v=213"></script>
<script src="assets/js/vykazy.js?v=213"></script>
<script type="module" src="assets/js/store.js?v=213"></script>

<script>
(function () {
    "use strict";
    /* Všechna práce (odběr vzkazů, vykreslení, obsluha tlačítek Splněno,
       Vrátit a ×) sedí v ui.js a je společná s panelem – stránka jen
       postaví hlavičku. */
    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "quicktodo.html" });
    });
})();
</script>
</body>
</html>
