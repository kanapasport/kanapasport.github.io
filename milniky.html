<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c8102e">
    <title>Milníky – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=46">
    <link rel="apple-touch-icon" href="Pasport_Kana_white.png">
    <link rel="icon" href="Pasport_Kana_black.png">
</head>
<body>

<div id="appHeader"></div>

<main class="wrap" style="padding-top:26px;padding-bottom:60px;display:flex;flex-direction:column;gap:18px">

    <div class="spread">
        <div>
            <h2 id="pageTitle" style="font-size:20px;font-weight:900;line-height:1.2">Milníky</h2>
            <p class="small muted" style="margin-top:3px">
                Termíny odevzdání po činnostech, seřazené tak, jak půjdou za sebou.
            </p>
        </div>
        <div class="row" style="gap:8px">
            <button id="btnHotove" class="btn btn--ghost btn--sm">Skrýt splněné</button>
            <button id="btnNew" class="btn btn--primary btn--sm" data-need="milnik.manage" hidden>+ Nový milník</button>
        </div>
    </div>

    <div id="zakRow" class="row row--wrap" style="gap:8px"></div>

    <div id="hint" class="card small muted" style="padding:14px 16px;line-height:1.6" hidden>
        Zapisovat a měnit milníky můžou jen <b>správci</b>. Ostatní je vidí, ale needitují.
    </div>

    <div id="empty" class="card center small muted" style="padding:40px" hidden>
        Zatím tu není žádný milník.
    </div>

    <div id="tableWrap" style="overflow-x:auto">
        <table id="table" class="milniky"></table>
    </div>
</main>

<!-- ======================================================== OKNO MILNÍKU -->
<div id="milnikOverlay" hidden style="position:fixed;inset:0;background:rgba(11,13,16,.55);z-index:110;display:flex;align-items:center;justify-content:center;padding:18px">
    <div class="card col" style="padding:22px;max-width:560px;width:100%;gap:14px;max-height:90vh;overflow-y:auto">
        <b id="formTitle" style="font-size:17px">Nový milník</b>

        <div class="row" style="gap:12px">
            <div class="grow">
                <label class="label" for="fCinnost">Činnost</label>
                <input type="text" id="fCinnost" class="field" placeholder="např. STAVBA, CHLAD, VZT">
            </div>
            <div style="width:190px;flex:none">
                <label class="label" for="fDatum">Datum dodání</label>
                <input type="date" id="fDatum" class="field">
            </div>
        </div>

        <div>
            <label class="label" for="fZakazka">Zakázka</label>
            <select id="fZakazka" class="field"></select>
        </div>

        <div>
            <span class="label">Zpracovatel</span>
            <div id="fOwners" class="people"></div>
        </div>

        <div>
            <label class="label" for="fNapln">Náplň milníku</label>
            <textarea id="fNapln" rows="3" class="field" placeholder="co konkrétně se odevzdává"></textarea>
            <div class="tiny muted" style="margin-top:6px">
                Bez data se milník zařadí na konec jako „bez termínu".
            </div>
        </div>

        <div class="row" style="justify-content:space-between;gap:10px">
            <button id="btnDelete" class="btn btn--ghost" style="color:var(--danger)" hidden>Smazat</button>
            <div class="row" style="gap:10px;margin-left:auto">
                <button id="btnCancel" class="btn btn--ghost">Zrušit</button>
                <button id="btnSave" class="btn btn--primary">Uložit</button>
            </div>
        </div>
    </div>
</div>

<script src="assets/js/taxonomy.js?v=46"></script>
<script src="assets/js/doc.js?v=46"></script>
<script src="assets/js/ui.js?v=46"></script>
<script type="module" src="assets/js/store.js?v=46"></script>

<script>
(function () {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const esc = (value) => window.KBUI.esc(value);

    let editingId = null;
    let activeZak = new URLSearchParams(location.search).get("zak") || "";   // slug zakázky
    let skryjHotove = false;

    const slug = (value) => window.KBUI.slug(value);
    const zakName = (item) => (item.zakazka || "").trim() || "Bez zakázky";

    const jmeno = (user) => ((user.first || "") + " " + (user.last || "")).trim() || user.email;

    /** Zpracovatelé – nová pole s UID mají přednost před starým textem. */
    function ownersText(item) {
        const lide = (item.owners || [])
            .map(uid => (window.KB.users || []).find(u => u.id === uid))
            .filter(Boolean);
        if (lide.length) return lide.map(jmeno).join(", ");
        return (item.owner || "").trim();
    }

    const czDate = (iso) => {
        if (!iso) return "";
        const [y, m, d] = iso.split("-");
        return d + ". " + m + ". " + y;
    };

    /** Barva termínu podle toho, jak je blízko – splněný je vždycky zelený. */
    function stavTerminu(item) {
        const iso = item.datum;
        if (item.hotovo) {
            return { text: iso ? czDate(iso) : "bez termínu", trida: "milnik--hotovo",
                     pozn: "splněno" + (item.hotovoKdo ? " · " + item.hotovoKdo : "") };
        }
        if (!iso) return { text: "bez termínu", trida: "milnik--zadny" };

        const dnes = new Date(); dnes.setHours(0, 0, 0, 0);
        const dny = Math.round((new Date(iso + "T00:00:00") - dnes) / 86400000);

        if (dny < 0)   return { text: czDate(iso), trida: "milnik--po", pozn: "po termínu" };
        if (dny === 0) return { text: czDate(iso), trida: "milnik--dnes", pozn: "dnes" };
        if (dny <= 7)  return { text: czDate(iso), trida: "milnik--blizko", pozn: "za " + dny + " dnů" };
        return { text: czDate(iso), trida: "", pozn: "za " + dny + " dnů" };
    }

    /* ------------------------------------------------------------ výpis */

    /** Seřazeno podle data – nejbližší nahoře, milníky bez data na konci. */
    const serazene = () => (window.KB.milniky || []).slice()
        .sort((a, b) => (a.datum || "9999-99-99").localeCompare(b.datum || "9999-99-99"));

    /** Pruh se zakázkami – stejný princip jako filtr v úkolovníku. */
    function paintZakRow() {
        const jmena = [];
        (window.KB.milniky || []).forEach(m => {
            const n = zakName(m);
            if (jmena.indexOf(n) === -1) jmena.push(n);
        });

        const chip = (label, aktivni, zak) =>
            '<button type="button" class="chip' + (aktivni ? " chip--active" : "") + '" ' +
            'data-zak="' + esc(zak) + '">' + esc(label) + "</button>";

        $("zakRow").innerHTML = jmena.length > 1
            ? chip("VŠE", !activeZak, "") + jmena.map(n => chip(n, slug(n) === activeZak, slug(n))).join("")
            : "";

        const vybrana = jmena.find(n => slug(n) === activeZak);
        $("pageTitle").textContent = vybrana ? "Milníky · " + vybrana : "Milníky";
    }

    function render() {
        const muzeMenit = window.KBUI.can("milnik.manage");
        $("hint").hidden = muzeMenit;
        $("btnHotove").textContent = skryjHotove ? "Zobrazit splněné" : "Skrýt splněné";
        $("btnHotove").className = "btn btn--sm " + (skryjHotove ? "btn--primary" : "btn--ghost");
        paintZakRow();

        let items = serazene();
        if (activeZak) items = items.filter(m => slug(zakName(m)) === activeZak);
        if (skryjHotove) items = items.filter(m => !m.hotovo);

        $("empty").hidden = !!items.length;
        $("tableWrap").hidden = !items.length;
        if (!items.length) return;

        // rozdělení podle zakázek – uvnitř každé zůstává řazení podle data
        const skupiny = new Map();
        items.forEach(m => {
            const n = zakName(m);
            if (!skupiny.has(n)) skupiny.set(n, []);
            skupiny.get(n).push(m);
        });
        const sloupcu = muzeMenit ? 5 : 4;

        $("table").innerHTML =
            "<thead><tr>" +
                "<th>Činnost</th><th>Zpracovatel</th><th>Náplň milníku</th><th>Datum dodání</th>" +
                (muzeMenit ? "<th></th>" : "") +
            "</tr></thead><tbody>" +
            Array.from(skupiny.entries()).map(([nazev, radky]) => {
                const hotovych = radky.filter(m => m.hotovo).length;
                const hlavicka = '<tr class="milniky__skupina"><td colspan="' + sloupcu + '">' +
                    "<b>" + esc(nazev) + "</b>" +
                    '<span>' + radky.length + " milníků · " + hotovych + " splněno</span>" +
                "</td></tr>";
                return hlavicka + radky.map(radek).join("");
            }).join("") +
            "</tbody>";

        function radek(item) {
                const t = stavTerminu(item);
                return '<tr class="' + t.trida + '">' +
                    '<td class="milniky__cinnost">' + esc(item.cinnost || "") + "</td>" +
                    "<td>" + esc(ownersText(item)) + "</td>" +
                    '<td class="milniky__napln">' + esc(item.napln || "") + "</td>" +
                    '<td class="milniky__datum"><b>' + t.text + "</b>" +
                        (t.pozn ? '<span class="milniky__pozn">' + esc(t.pozn) + "</span>" : "") + "</td>" +
                    (muzeMenit
                        ? '<td class="milniky__akce">' +
                            '<button type="button" class="btn btn--sm ' +
                                (item.hotovo ? "btn--ghost" : "btn--ok") + '" data-done="' + esc(item.id) + '">' +
                                (item.hotovo ? "Vrátit" : "Splněno") + "</button>" +
                            '<button type="button" class="btn btn--sm btn--ghost" data-edit="' + esc(item.id) + '">Upravit</button>' +
                          "</td>"
                        : "") +
                "</tr>";
        }
    }

    /* --------------------------------------------------------- formulář */

    function paintOwners(item) {
        const vybrani = item ? (item.owners || []).slice() : [];
        $("fOwners").innerHTML = (window.KB.users || [])
            .filter(u => u.active !== false)
            .map(u => {
                const on = vybrani.indexOf(u.id) !== -1;
                return '<label class="person' + (on ? " person--on" : "") + '">' +
                    '<input type="checkbox" value="' + esc(u.id) + '"' + (on ? " checked" : "") + ">" +
                    "<span>" + esc(jmeno(u)) + "</span></label>";
            }).join("") || '<div class="tiny muted">V seznamu zatím nikdo není.</div>';
    }

    $("fOwners").addEventListener("change", (event) => {
        const label = event.target.closest(".person");
        if (label) label.classList.toggle("person--on", event.target.checked);
    });

    function openForm(id) {
        editingId = id || null;
        const item = id ? (window.KB.milniky || []).find(m => m.id === id) : null;

        $("formTitle").textContent = item ? "Upravit milník" : "Nový milník";
        $("fCinnost").value = item ? (item.cinnost || "") : "";
        $("fNapln").value = item ? (item.napln || "") : "";
        $("fDatum").value = item ? (item.datum || "") : "";
        $("btnDelete").hidden = !item;

        const zakazky = (window.KB.zakazky || []).slice();
        $("fZakazka").innerHTML = '<option value="">— bez zakázky —</option>' +
            zakazky.map(z => '<option value="' + esc(z) + '"' +
                ((item && item.zakazka) === z ? " selected" : "") + ">" + esc(z) + "</option>").join("");

        paintOwners(item);
        $("milnikOverlay").hidden = false;
        $("fCinnost").focus();
    }

    async function ulozSeznam(items, hlaska) {
        try {
            await window.KB.saveMilniky(items);
            $("milnikOverlay").hidden = true;
            window.KBUI.toast(hlaska);
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Uložení selhalo – zapisovat milníky můžou jen správci.", "error");
        }
    }

    async function save() {
        const cinnost = $("fCinnost").value.trim();
        if (!cinnost) return window.KBUI.toast("Doplň činnost.", "warn");

        const puvodni = (window.KB.milniky || []).find(m => m.id === editingId) || {};
        const zaznam = {
            id: editingId || window.KB.newMilnikId(),
            cinnost: cinnost,
            owners: Array.from($("fOwners").querySelectorAll("input:checked")).map(i => i.value),
            owner: "",
            napln: $("fNapln").value.trim(),
            datum: $("fDatum").value,
            zakazka: $("fZakazka").value,
            // úprava milníku nesmí shodit značku „splněno"
            hotovo: !!puvodni.hotovo,
            hotovoKdo: puvodni.hotovoKdo || "",
            hotovoMs: puvodni.hotovoMs || 0
        };

        const items = (window.KB.milniky || []).slice();
        const index = items.findIndex(m => m.id === zaznam.id);
        if (index === -1) items.push(zaznam); else items[index] = zaznam;

        await ulozSeznam(items, editingId ? "Milník upraven." : "Milník přidán.");
    }

    async function remove() {
        const item = (window.KB.milniky || []).find(m => m.id === editingId);
        if (!item) return;
        if (!confirm('Opravdu smazat milník „' + (item.cinnost || "") + '"?')) return;
        await ulozSeznam((window.KB.milniky || []).filter(m => m.id !== editingId), "Milník smazán.");
    }

    /* ------------------------------------------------------------- start */

    /** Označení splněno / vrácení zpět – zapisuje kdo a kdy. */
    async function prepniHotovo(id) {
        const items = (window.KB.milniky || []).map(m => {
            if (m.id !== id) return m;
            return m.hotovo
                ? Object.assign({}, m, { hotovo: false, hotovoKdo: "", hotovoMs: 0 })
                : Object.assign({}, m, {
                    hotovo: true,
                    hotovoKdo: window.KB_USER || "",
                    hotovoMs: Date.now()
                  });
        });
        const byl = (window.KB.milniky || []).find(m => m.id === id);
        await ulozSeznam(items, byl && byl.hotovo ? "Milník vrácen mezi rozdělané." : "Milník označen jako splněný.");
    }

    document.addEventListener("click", (event) => {
        if (!window.KBUI.can("milnik.manage")) return;

        const hotovo = event.target.closest("[data-done]");
        if (hotovo) return prepniHotovo(hotovo.dataset.done);

        const uprav = event.target.closest("[data-edit]");
        if (uprav) openForm(uprav.dataset.edit);
    });

    // přepínače v hlavičce a filtr zakázek
    $("zakRow").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-zak]");
        if (!chip) return;
        activeZak = chip.dataset.zak;
        history.replaceState(null, "", location.pathname + (activeZak ? "?zak=" + encodeURIComponent(activeZak) : ""));
        render();
    });

    document.addEventListener("DOMContentLoaded", async () => {
        window.KBUI.mountNav({ active: "milniky.html" });

        $("btnNew").addEventListener("click", () => openForm(null));
        $("btnHotove").addEventListener("click", () => { skryjHotove = !skryjHotove; render(); });
        $("btnCancel").addEventListener("click", () => { $("milnikOverlay").hidden = true; });
        $("btnSave").addEventListener("click", save);
        $("btnDelete").addEventListener("click", remove);

        document.addEventListener("kb-role", render);
        window.KB.on("milniky", render);
        window.KB.on("users", render);

        render();
        await window.KB.whenReady();
        render();
    });
})();
</script>
</body>
</html>
