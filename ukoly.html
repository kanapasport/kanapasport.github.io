<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1d556d">
    <meta name="robots" content="noindex, nofollow">
    <title>Úkoly – Pasport Kaňa</title>
    <link rel="stylesheet" href="assets/css/app.css?v=303">
    <link rel="stylesheet" href="assets/css/nabidka.css?v=303">
    <link rel="apple-touch-icon" href="ikona-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="Pasport_Kana_black.png">
    <style>
        /* podnadpis druhu uvnitř projektu – menší než hlavička projektu */
        .skupina-druh { font-size: var(--fs-1); font-weight: 800; letter-spacing: .05em;
            text-transform: uppercase; color: var(--muted); margin: 10px 2px 4px; }

        /* Hlavička stránky je sdílený .spread z app.css: nadpis vlevo,
           tlačítka vpravo – stejně jako na ostatních stránkách. */

        .ukol { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
        .ukol__hlava { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
        .ukol__hlava:hover { background: var(--bg-soft); }
        /* název a jména na jednom řádku – kdo na úkolu dělá, musí být vidět
           hned, ne až v šedé metadatové drobnosti pod tím */
        .ukol__radek { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ukol__nazev { font-weight: 900; font-size: var(--fs-3); }
        .ukol__meta { font-size: var(--fs-1); color: var(--muted); margin-top: 3px; }
        /* zápis výkazu rovnou z řádku úkolu – bez rozbalování;
           na úzkém okně zůstanou jen hodiny, text by lámal řádek */
        .ukol__vykaz { flex: none; display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 11px; border-radius: var(--r-pill); font-size: var(--fs-1); font-weight: 800;
            text-decoration: none; white-space: nowrap;
            color: var(--accent); background: var(--accent-tint); border: 1px solid var(--accent-lt); }
        .ukol__vykaz:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
        /* čtení, ne zápis – proto tlumeně, aby si je nikdo nespletl */
        .ukol__vykaz--cist { color: var(--text-soft); background: var(--bg); border-color: var(--line); }
        .ukol__vykaz--cist:hover { color: var(--text); background: var(--surface); border-color: var(--line); }
        .ukol__vykaz svg { width: 14px; height: 14px; flex: none; }
        @media (max-width: 720px) { .ukol__vykaz span { display: none; } .ukol__vykaz { padding: 5px 8px; } }
        .ukol__pct { flex: none; font-weight: 900; font-size: var(--fs-3); width: 46px; text-align: right; }
        .ukol__prubeh { flex: none; width: 130px; height: 8px; border-radius: var(--r-pill); background: var(--bg); overflow: hidden; }
        .ukol__prubeh i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); }
        .ukol--hotovo .ukol__prubeh i { background: var(--p100-fg); }
        .ukol__telo { border-top: 1px solid var(--line-soft); }
        /* štítek se jménem přiřazeného člověka */
        .osoba { display: inline-block; font-size: var(--fs-1); font-weight: 800; line-height: 1.55;
            padding: 1px 9px; border-radius: var(--r-pill); white-space: nowrap;
            background: var(--accent-tint); color: var(--accent); border: 1px solid var(--accent-lt); }
        /* úkol bez lidí je chyba v zadání, ne stav – proto varovná barva */
        .osoba--nikdo { background: transparent; color: var(--warn); border-color: var(--warn); }
        /* štítky stavu: čeká na potvrzení, termín v dovolené jediného člověka */
        .osoba--ceka, .osoba--dovolena { background: var(--warn-tint); color: var(--warn); border-color: #e8c877; }
        .osoba--dovolena { cursor: help; }
        /* poznámka pod termínem v okně úkolu (dovolená, další opakování) */
        .terminInfo { margin-top: -4px; font-size: var(--fs-1); line-height: 1.5; color: var(--text-soft); }
        .terminInfo b { color: var(--warn); }
        /* TO-DO řádky (.subtask z app.css) si nesou vlastní odsazení i linku,
           proto jdou přes celou šířku a patička se od nich oddělí sama */
        .ukol__pata { display: flex; align-items: center; justify-content: space-between;
            gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line-soft); }
        /* číslo procent je tlačítko, ale nemá vypadat jako tlačítko */
        .subtask__pct { border: none; background: none; cursor: pointer; }
        /* kdo úkol nemá přiřazený, na ovládání nesáhne – ať je to i vidět */
        .subtask__check:disabled, .subtask__pct:disabled, .subtask__slider:disabled { cursor: default; opacity: .6; }
        .subtask__check:disabled:hover { border-color: var(--line); }
        .skupina-nadpis { font-size: var(--fs-2); font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
            color: var(--text-soft); margin: 14px 0 2px; display: flex; align-items: center; gap: 10px; }
        .skupina-nadpis .tag { font-weight: 700; }
        /* Formulář jede na sdílené mřížce .fmr z app.css (vzor = zápis
           výkazu): kompaktní buňky se poskládají samy a schovaná technologie
           nenechá v řádku díru. Vlastní mřížka tu proto žádná není. */
        .vybervse { border: none; background: none; font: inherit; font-size: var(--fs-1); font-weight: 700;
            color: var(--accent); cursor: pointer; padding: 2px 6px; }

        /* zapnutý přepínač (Moje úkoly / Všechny / styl %) – stejná velikost
           jako Rozbalit vše, jen zvýrazněný */
        .prepnac.je-zapnuty { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* formulář v kabátě výkazového bloku */
        .ublok { border: 1px solid var(--accent); border-radius: var(--radius-lg);
            background: var(--accent-tint); overflow: hidden; }
        .ublok__hlava { display: flex; align-items: center; justify-content: space-between;
            gap: 10px; padding: 8px 14px; background: var(--accent); }
        .ublok__stitek { font-size: var(--fs-1); font-weight: 900; letter-spacing: .09em;
            text-transform: uppercase; color: #fff; }
        .ublok__telo { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
        .ublok .field { background: var(--surface); }
        .ublok .lidevyber label { background: var(--surface); }

        /* Stejná výška řádku TO-DO v obou stylech zapisování procent –
           přepnutí nesmí řádky přeskládat. Výšku diktuje vyšší z ovládání. */
        .subtask { min-height: 64px; }

        /* Plnění úkolu bez TO-DO rozpadu („Celkem"): řada kroků stejné
           stupnice jako u TO-DO, vždy celá (nezávisle na „styl %"). Řádek
           si drží vlastní rozvržení – v mřížce .subtask by se šest tlačítek
           na telefonu nevešlo vedle názvu, takže se tu řada zalomí pod něj. */
        .subtask.celkem { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
        .celkem__popis { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .celkem__mimo { font-weight: 900; font-variant-numeric: tabular-nums; }
        .celkem__stupnice { display: flex; flex-wrap: wrap; gap: 6px; }
        .celkem__krok { min-width: 56px; min-height: 34px; padding: 4px 10px; border-radius: var(--r-pill);
            border: 1px solid var(--line); background: var(--surface); font-family: inherit;
            font-size: var(--fs-2); font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer; }
        /* barva čísla = barva stupně (--p0…--p100), zvolený krok plný */
        .celkem__krok--p0   { color: var(--p0-fg); }
        .celkem__krok--p50  { color: var(--p50-fg); }
        .celkem__krok--p75  { color: var(--p75-fg); }
        .celkem__krok--p95  { color: var(--p95-fg); }
        .celkem__krok--p100 { color: var(--p100-fg); }
        .celkem__krok:not(:disabled):hover { border-color: currentColor; }
        .celkem__krok.je-aktivni { color: #fff; }
        .celkem__krok--p0.je-aktivni   { background: var(--p0-fg);   border-color: var(--p0-fg); }
        .celkem__krok--p50.je-aktivni  { background: var(--p50-fg);  border-color: var(--p50-fg); }
        .celkem__krok--p75.je-aktivni  { background: var(--p75-fg);  border-color: var(--p75-fg); }
        .celkem__krok--p95.je-aktivni  { background: var(--p95-fg);  border-color: var(--p95-fg); }
        .celkem__krok--p100.je-aktivni { background: var(--p100-fg); border-color: var(--p100-fg); }
        .celkem__krok:disabled { cursor: default; opacity: .6; }
        /* odhad celku vedle skutečného rozpadu = varování, ne běžný stav */
        .celkem--navic .subtask__info { color: var(--warn); font-weight: 700; }
        /* telefon: šest kroků rovným dílem přes celou šířku, ne zalomené */
        @media (max-width: 599.98px) {
            .celkem__stupnice { width: 100%; flex-wrap: nowrap; gap: 4px; }
            .celkem__krok { flex: 1 1 0; min-width: 0; padding: 4px 2px; }
        }
        .lidevyber { display: flex; flex-wrap: wrap; gap: 7px; }
        .lidevyber label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
            border: 1px solid var(--line); border-radius: var(--r-pill); font-size: var(--fs-1); cursor: pointer; background: var(--surface); }
        .lidevyber label:has(input:checked) { background: var(--accent-tint); border-color: var(--accent-lt); color: var(--accent); font-weight: 700; }

        /* Telefon: hlavička úkolu nese zaškrtávátko, název, Zapsat výkaz, postup
           a „⋯" (44 px). Pruh postupu se zúží, ať název nezůstane ve sloupečku
           po slovech. Musí stát až za základními pravidly .ukol__prubeh/.ukol__pct. */
        @media (max-width: 599.98px) {
            .ukol__hlava { gap: 6px; padding: 10px 6px 10px 10px; flex-wrap: wrap; }
            .ukol__hlava .grow { min-width: 0; flex: 1 1 160px; }
            .ukol__prubeh { width: 44px; }
            .ukol__pct { width: auto; min-width: 36px; }
        }
    </style>
</head>
<body>

<div id="appHeader"></div>

<main class="wrap" style="padding-top:26px;padding-bottom:60px;display:flex;flex-direction:column;gap:16px">

    <div class="spread">
        <div>
            <h2 class="nadpis-stranky">Úkoly</h2>
            <p class="small muted" style="margin-top:3px">
                Každý úkol má TO-DO rozpad, ve kterém se zapisuje postup. Úkol bez rozpadu se zaklikává řádkem Celkem.
            </p>
        </div>
        <div class="row row--wrap" style="gap:8px">
            <button type="button" id="btnNovy" class="btn btn--primary" data-need="ukol.delete" hidden>+ Nový úkol</button>
            <!-- budovy, patra a technologie se nastavují u každého projektu
                 zvlášť, a to ve Správě projektů – tady se už jen čtou -->
            <a href="sprava.html" class="btn btn--ghost" data-need="zakazky.manage" hidden
                title="Budovy, patra a technologie se nastavují u každého projektu zvlášť">Správa projektů</a>
        </div>
    </div>

    <!-- filtry vlevo, přepínače zobrazení vpravo – stejná velikost tlačítek -->
    <div class="row row--wrap" style="gap:8px">
        <button type="button" class="btn btn--sm btn--ghost prepnac" data-pohled="moje">Moje úkoly</button>
        <!-- Všechny vidí každý: kdo pomáhal kolegovi, najde si tu jeho úkol
             a tlačítkem v hlavičce si na něj zapíše výkaz -->
        <button type="button" class="btn btn--sm btn--ghost prepnac" data-pohled="vse">Všechny</button>
        <select id="fProjekt" class="field" style="width:auto;min-width:180px"></select>
        <!-- U projektu se stovkou úkolů se bez těchhle dvou nedá nic najít
             (přání Michala 2. 9. 2026). Nabídka se plní z toho, co je
             opravdu vypsané, takže nenabízí prázdné volby. -->
        <select id="fTech" class="field" style="width:auto;min-width:130px"></select>
        <select id="fPatro" class="field" style="width:auto;min-width:120px"></select>
        <label class="row" style="gap:6px;font-size:var(--fs-2);cursor:pointer">
            <input type="checkbox" id="fHotove"> zobrazit hotové
        </label>
        <div class="grow"></div>
        <button type="button" id="prepPodrobne" class="btn btn--sm btn--ghost prepnac"
            title="Přepne mezi jedním číslem a řadou kroků">styl %</button>
        <button type="button" id="btnRozbal" class="btn btn--sm btn--ghost"
            title="Otevře nebo zavře TO-DO u všech vypsaných úkolů naráz">Rozbalit vše</button>
    </div>

    <!-- oblíbené projekty ze Správy – jeden klik místo roletky (přání 21. 8.) -->
    <div id="oblibeneChipy" class="row row--wrap" style="gap:6px" hidden></div>

    <!-- ============================================== TVORBA ÚKOLU -->
    <!-- stejný kabát jako blok nového výkazu: červený pruh, tónované tělo -->
    <!-- Úprava úkolu jede jako okno přes stránku, ne jako blok nahoře:
         seznam pod ním zůstane na svém místě a po zavření se člověk vrátí
         přesně tam, kde byl (přání Michala 24. 8.). -->
    <div id="tvorba" class="ublokOverlay" hidden>
      <div class="ublok ublok--okno">
        <div class="ublok__hlava">
            <span class="ublok__stitek" id="tvorbaNadpis">Nový úkol</span>
            <button type="button" class="linkbtn" id="btnZavri">Zavřít</button>
        </div>
        <div class="ublok__telo">
        <div class="fmr">
            <label><span class="label">Projekt</span><select id="uProjekt" class="field"></select></label>
            <label><span class="label">Druh práce</span>
                <select id="uDruh" class="field">
                    <option value="ArcGIS/Kreslení">ArcGIS/Kreslení</option>
                    <option value="Focení">Focení</option>
                    <option value="Skeny">Skeny</option>
                    <option value="Tabulky">Tabulky</option>
                </select></label>
            <label id="uTechBox"><span class="label">Technologie</span><select id="uTech" class="field"></select></label>
            <label><span class="label">Budova</span><select id="uBudova" class="field"></select></label>
            <label><span class="label">Patro</span><select id="uPatro" class="field"></select></label>
            <label><span class="label">Termín</span><input type="date" id="uTermin" class="field"></label>
            <!-- Po splnění vznikne kopie s dalším termínem (od tohohle termínu,
                 ne ode dne splnění) a s vynulovaným TO-DO. -->
            <label><span class="label">Opakovat</span>
                <select id="uOpakovani" class="field">
                    <option value="">ne</option>
                    <option value="tyden">každý týden</option>
                    <option value="14dni">každých 14 dní</option>
                    <option value="mesic">každý měsíc</option>
                </select></label>
            <p id="uTerminInfo" class="terminInfo fmr__cely" hidden></p>
            <!-- Název přes celý řádek schválně: skládá se z hodnot nad ním
                 a bývá nejdelší text formuláře, v úzké buňce by se usekl. -->
            <label class="fmr__cely"><span class="label">Název (doplní se sám, jde přepsat)</span>
                <input type="text" id="uNazev" class="field"></label>
            <div class="fmr__cely">
                <span class="label">Komu úkol patří
                    <button type="button" class="vybervse" data-vse="uLide">vybrat vše</button></span>
                <div id="uLide" class="lidevyber"></div>
            </div>
            <div class="fmr__cely">
                <span class="label">TO-DO rozpad (jeden řádek = jedna položka)</span>
                <div class="row row--wrap" style="gap:6px;margin-bottom:6px">
                    <button type="button" id="uSabTech" class="btn btn--sm btn--ghost" hidden></button>
                    <button type="button" id="uSabMist" class="btn btn--sm btn--ghost" hidden></button>
                </div>
                <textarea id="uTodo" rows="3" class="field" placeholder="Zákres půdorysu&#10;Kontrola polohových kódů&#10;Výkres do PDF"></textarea>
                <!-- odhad „Celkem" z úkolu bez rozpadu – v řádcích není, jen se tu oznámí -->
                <p id="uCelkemInfo" class="tiny muted" style="margin-top:6px" hidden></p>
            </div>
            <label class="fmr__cely"><span class="label">Poznámka</span><textarea id="uPoznamka" rows="2" class="field"></textarea></label>
        </div>
        <div class="row" style="justify-content:flex-end;gap:10px">
            <button type="button" id="btnSmazat" class="btn btn--ghost" hidden style="margin-right:auto;color:var(--danger)">Smazat úkol</button>
            <button type="button" id="btnZrusit" class="btn btn--ghost">Zrušit</button>
            <button type="button" id="btnUlozit" class="btn btn--primary">Uložit úkol</button>
        </div>
        </div>
      </div>
    </div>

    <div id="vypis" class="col" style="gap:10px"></div>

</main>

<script src="assets/js/taxonomy.js?v=303"></script>
<script src="assets/js/ui.js?v=303"></script>
<script src="assets/js/nabidka.js?v=303"></script>
<script src="assets/js/vykazy.js?v=303"></script>
<script type="module" src="assets/js/store.js?v=303"></script>

<script>
(function () {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const esc = (value) => window.KBUI.esc(value);
    const V = window.KBVYK;

    /* Vestavěné technologie kreslení – názvy výkresů, ne výkazová čísla.
       STAVBA je půdorys, zbytek profese. Platí u projektu, který si vlastní
       seznam ve Správě projektů ještě nenastavil. */
    /* Záloha pro projekt, který vlastní technologie nastavené nemá.
       Bere se z firemního číselníku (store.js), aby úkoly, výkaz i matice
       nabízely TOTÉŽ – dřív tu byl vlastní seznam a rozcházel se. */
    const TECH_KRESLENI = () => (window.KB.technologie || []).map(t => t.zkratka || t);
    const PATRA_VYCHOZI = ["3PP", "2PP", "1PP", "1NP", "2NP", "3NP", "4NP", "5NP", "6NP"];
    const PCT_KROKY = [0, 25, 50, 75, 95, 100];

    /* Úkol bez TO-DO rozpadu (třeba úkoly z milníků – „jeden milník = jeden
       úkol") neměl kam procenta zapsat. Plnění se mu proto zapisuje do
       jedné TO-DO položky „Celkem" se značkou `celkem: true` – je to obyčejná
       položka {id, text, pct, by, ms}, takže ji průměr TO-DO (V.pctUkolu),
       matice ve Správě, plán projektů i nástěnka počítají beze změny a zápis
       jde přes KB.ulozUkolPostup (pravidla pustí přiřazeného jen k `todo`).
       Značka, ne text: položka nazvaná „Celkem" ručně zůstává obyčejná. */
    const CELKEM_TEXT = "Celkem";
    const jeCelkem = (t) => !!t && t.celkem === true;

    /* Jak si člověk přeje zapisovat procenta: výchozí jedno číslo (starý web),
       nebo celá řada kroků. Osobní volba, drží ji prohlížeč – stejný klíč
       jako na nástěnce, ať se to chová všude stejně. */
    const PODROBNE_KLIC = "kb-pct-podrobne";
    const podrobne = () => {
        try { return localStorage.getItem(PODROBNE_KLIC) === "1"; } catch (err) { return false; }
    };
    const nastavPodrobne = (zap) => {
        try { localStorage.setItem(PODROBNE_KLIC, zap ? "1" : "0"); } catch (err) {}
    };

    /* Fajfka do zaškrtávátka – stejná jako na staré stránce postupu práce. */
    const CHECK = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
        '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"/></svg>';

    /* Hodiny do tlačítka „Zapsat výkaz" v hlavičce úkolu. (Lupa pro
       „Zobrazit výkazy" odešla s tlačítkem do nabídky „⋯".) */
    const HODINY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="9" stroke-width="2"/>' +
        '<path stroke-linecap="round" stroke-width="2" d="M12 7v5l3.5 2"/></svg>';

    const params = new URLSearchParams(location.search);
    let pohled = params.get("moje") ? "moje" : (params.get("zak") ? "zak" : "moje");
    const zakSlug = params.get("zak") || "";
    /* ?otevri=ID – proklik na jeden úkol (nástěnka, Správa, milníky, výkazy).
       Ten úkol je ve výpisu vždycky, ať je pohled a filtr jakýkoliv: dřív
       výchozí „Moje úkoly" cizí úkol schoval a odkaz nic neotevřel. */
    const otevriId = params.get("otevri") || "";
    let editovanyId = "";
    const historieOtevrena = new Set();   // u kterých úkolů je rozbalená historie
    let sledovaniZapnuto = false;
    const otevrene = new Set();

    function zapniSledovani() {
        if (sledovaniZapnuto || !window.KB.currentUid()) return;
        sledovaniZapnuto = true;
        /* Úkoly smí číst každý člen – budget v nich neleží (je v tajné
           kolekci budgety) a kdo pomáhal kolegovi, musí jeho úkol najít,
           aby si na něj zapsal výkaz. */
        window.KB.watchUkoly();
        if (window.KBUI.can("vykaz.view")) window.KB.watchProjekty();
        else window.KB.watchMojeProjekty();
    }

    /** Manažer (hlavní správce i správce) vidí a zapisuje všude. */
    const jeManazer = () => window.KBUI.can("vykaz.view");

    const jmenoUid = (uid) => { const u = V.clovek(uid); return u ? V.jmeno(u) : ""; };
    // vypnuté TO-DO se nepočítají – stejné pravidlo jako V.pctUkolu
    const pctUkolu = V.pctUkolu;

    const najdiUkol = (id) => (window.KB.ukoly || []).find(x => x.id === id) || null;
    const najdiTodo = (ukolId, todoId) => {
        const u = najdiUkol(ukolId);
        return u ? (u.todo || []).find(t => t.id === todoId) || null : null;
    };

    /** Datum a čas zápisu ve tvaru „3. 8. 2026 14:11". */
    function casRazitko(ms) {
        if (!ms) return "";
        const d = new Date(ms);
        return d.getDate() + ". " + (d.getMonth() + 1) + ". " + d.getFullYear() + " " +
            String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    /* Barevná stupnice rozpracovanosti: 0 % šedá · 25 a 50 % žlutá ·
       75 % oranžová · 95 % slabší zelená · 100 % zelená. */
    function pctUroven(pct) {
        const hodnota = Number(pct) || 0;
        if (hodnota >= 100) return "p100";
        if (hodnota >= 95) return "p95";
        if (hodnota >= 75) return "p75";
        if (hodnota > 0) return "p50";
        return "p0";
    }

    /* --------------------------------------------------- číselník úkolů ---
       Z čeho se úkol skládá, si drží každý projekt sám: budovy, patra
       i nabídku technologií. Nastavuje se to ve Správě projektů, tahle
       stránka číselník už jen čte. Projekt, který nic nastavené nemá,
       dostane vestavěné výchozí hodnoty – ať jde úkol založit hned. */

    function ciselnik(projektNazev) {
        const c = (window.KB.budgetCiselnik || {})[projektNazev] || {};
        /* Projekt s vlastním číselníkem dostane PŘESNĚ to, co si nastavil –
           prázdná osa znamená „tohle nepoužívám", žádný firemní fallback
           (přání Michala 31. 8. 2026: nabízela se patra, která projekt
           nemá). Firemní nabídka zbývá projektům bez vlastního nastavení. */
        const maVlastni = ["budovy", "patra", "technologie"].some(k =>
            Array.isArray(c[k]) && c[k].length);
        const nebo = (seznam, vychozi) =>
            (Array.isArray(seznam) && seznam.length) ? seznam : (maVlastni ? [] : vychozi);
        return {
            budovy: nebo(c.budovy, ["celá stavba"]),
            patra: nebo(c.patra, PATRA_VYCHOZI),
            technologie: nebo(c.technologie, TECH_KRESLENI()),
            cinnosti: (Array.isArray(c.cinnosti) && c.cinnosti.length)
                ? c.cinnosti : V.cinnosti()
        };
    }

    /** Doplní hodnotu, kterou úkol má, ale číselník ji už nenabízí – jinak by
        se při úpravě tiše přepsala na první položku roletky. */
    const sHodnotou = (seznam, hodnota) =>
        (hodnota && seznam.indexOf(hodnota) === -1) ? seznam.concat([hodnota]) : seznam;

    /* ------------------------------------------------------------- výpis */

    /* Oblíbené projekty (značí se hvězdičkou ve Správě, drží je prohlížeč).
       Kdo žádné označené nemá, vidí chipy všech načtených projektů –
       zaměstnanci se stejně načítají jen ty jeho. */
    let oblFiltr = "";

    function oblibeneProjekty() {
        let ids = [];
        try { ids = JSON.parse(localStorage.getItem("kb-sprava-oblibene") || "[]"); } catch (err) { }
        const vse = window.KB.projektyDocs || [];
        const vybrane = ids.length ? vse.filter(p => ids.indexOf(p.id) !== -1) : vse;
        return vybrane.slice(0, 8).map(p => p.nazev).filter(Boolean);
    }

    function vykresliOblibene() {
        const box = $("oblibeneChipy");
        const nazvy = oblibeneProjekty();
        box.hidden = !nazvy.length;
        box.innerHTML = nazvy.map(n =>
            '<button type="button" class="chip' + (oblFiltr === n ? " chip--active" : "") +
                '" data-obl-projekt="' + esc(n) + '">' + esc(n) + "</button>").join("");
    }

    /* Patro se v nabídce ukazuje i s budovou – „G61 1NP" a „G62 1NP" jsou
       dvě různá místa a slít je dohromady by filtr znehodnotilo. */
    const patroKlic = (u) => ((u.budova ? u.budova + " " : "") + (u.patro || "")).trim();

    function vybrane() {
        const uid = window.KB.currentUid();
        return (window.KB.ukoly || []).filter(u => {
            if (otevriId && u.id === otevriId) return true;     // proklik na tenhle úkol
            /* Bez zaškrtnutí se schovávají jen hotové POTVRZENÉ manažerem –
               hotové čekající na potvrzení musí zůstat na očích. */
            if (!$("fHotove").checked && u.stav === "hotovo" && u.potvrzeno === true
                && pohled !== "zak") return false;
            if (pohled === "moje" && (u.prirazeni || []).indexOf(uid) === -1) return false;
            if (pohled === "zak" && window.KBUI.slug(u.projekt || "") !== zakSlug) return false;
            if ($("fProjekt").value && (u.projekt || "") !== $("fProjekt").value) return false;
            if ($("fTech").value && (u.technologie || "") !== $("fTech").value) return false;
            if ($("fPatro").value && patroKlic(u) !== $("fPatro").value) return false;
            if (oblFiltr && (u.projekt || "") !== oblFiltr) return false;
            return true;
        });
    }

    /**
     * Jedna TO-DO položka. Celý řádek je podbarvený podle procent, aby se
     * stav dal přečíst z odstupu; zapisovat se dá třemi způsoby, protože
     * každý sahá po něčem jiném – fajfka (hotovo/nic), číslo (po krocích)
     * a táhlo (cokoliv po pěti procentech).
     */
    /* --------------------------------------------- poznámky u položky ---
       Verze 1.0 je měla a lidem chyběly: „čekám, až to na stavbě udělají".
       Bydlí UVNITŘ položky (`t.pozn`), ne vedle úkolu – pravidla databáze
       pouštějí zaměstnance jen k poli `todo`, takže jinam by je nezapsal. */

    /** Které poznámky jsou zrovna rozepsané (klíč ukolId|todoId). */
    const poznFormy = new Set();

    function poznamkyHtml(u, t, smiPsat) {
        const klic = u.id + "|" + t.id;
        const uid = window.KB.currentUid();
        const seznam = (t.pozn || []).map(p => {
            // svoji poznámku spraví každý, cizí jen manažer
            const smiMenit = jeManazer() || (p.uid && p.uid === uid);
            return '<div class="note" data-poznradek="' + esc(klic + "|" + p.id) + '">' +
                '<span class="note__text">' + window.KBUI.textSOdkazy(p.text, p.odkazy) + "</span>" +
                '<span class="note__who">' + esc(p.kdo || "neznámý") +
                    (p.ms ? " · " + esc(casRazitko(p.ms)) : "") +
                    (smiMenit
                        ? ' · <button type="button" class="note__akce" data-pozn-uprav="' +
                            esc(klic + "|" + p.id) + '">upravit</button>' +
                          ' · <button type="button" class="note__akce note__akce--smaz" data-pozn-smaz="' +
                            esc(klic + "|" + p.id) + '">smazat</button>'
                        : "") +
                "</span>" +
            "</div>";
        }).join("");

        const formular = poznFormy.has(klic)
            ? '<div class="row" style="gap:8px;margin-top:6px">' +
                '<input type="text" class="field grow" data-pozn-vstup="' + esc(klic) + '" ' +
                    'data-napoveda autocomplete="off" ' +
                    'placeholder="např. čekám, až to na stavbě udělají (@ kolega, # projekt či úkol)">' +
                '<button type="button" class="btn btn--sm btn--primary" data-pozn-uloz="' +
                    esc(klic) + '">Přidat</button>' +
              "</div>"
            : "";

        if (!seznam && !formular) return "";
        return '<div class="subtask__pozn">' + seznam + formular + "</div>";
    }

    /**
     * Řádek „Celkem" – plnění úkolu, který nemá TO-DO rozpad. Řada kroků je
     * stejná stupnice jako u TO-DO (0–25–50–75–95–100 %) a ukazuje se vždy
     * celá, ať se plnění dá zaklikat jedním klikem bez ohledu na „styl %".
     * `t` = už zapsaná položka Celkem (nebo null, dokud nikdo neklikl).
     * `navic` = úkol mezitím dostal skutečné TO-DO (třeba ve Správě) – odhad
     * celku by se pak průměroval s nimi, proto varování a tlačítko Smazat.
     */
    function celkemHtml(u, t, smiPsat, navic) {
        // bez položky platí to, co úkol ukazuje teď (0 %, u hotového 100 %)
        const pct = t ? (Number(t.pct) || 0) : pctUkolu(u);
        const id = esc(u.id);
        const zamek = smiPsat ? "" : ' disabled title="Plnění zapisuje přiřazený člověk nebo manažer"';
        const info = navic
            ? "Úkol už má TO-DO rozpad – tenhle odhad celku se průměruje s položkami. " +
                "Smaž ho, ať plnění počítají jen položky."
            : (t && t.by)
                ? "zapsal " + esc(t.by) + " · " + esc(casRazitko(t.ms))
                : (u.stav === "hotovo" && !t)
                    ? "úkol je označený jako hotový"
                    : "Úkol nemá TO-DO rozpad – klikni, kolik je zhruba hotovo.";
        // hodnota mimo stupnici (z posuvníku na nástěnce) – ať je vidět číslem
        const mimo = PCT_KROKY.indexOf(pct) === -1
            ? ' <span class="celkem__mimo">' + esc(pct) + " %</span>" : "";

        return '<div class="subtaskblok">' +
            '<div class="subtask celkem subtask--' + pctUroven(pct) +
                (navic ? " celkem--navic" : "") + '" data-celkem-radek="' + id + '">' +
                '<span class="celkem__popis">' +
                    '<span class="subtask__name">' + esc(CELKEM_TEXT) + mimo + "</span>" +
                    '<span class="subtask__info">' + info + "</span>" +
                "</span>" +
                '<span class="celkem__stupnice" role="group" aria-label="Kolik je z úkolu hotovo">' +
                    PCT_KROKY.map(p =>
                        '<button type="button" class="celkem__krok celkem__krok--' + pctUroven(p) +
                            (pct === p ? " je-aktivni" : "") + '" aria-pressed="' + (pct === p) + '"' +
                            ' data-celkem="' + p + "|" + id + '"' + zamek + ">" + p + "&nbsp;%</button>").join("") +
                "</span>" +
                (smiPsat && t
                    ? '<span class="subtask__akce">' +
                        (navic
                            ? '<button type="button" class="btn btn--sm btn--ghost subtask__vyp" data-celkem-smaz="' +
                                id + '" title="Smazat odhad celku – plnění pak počítají jen TO-DO položky">Smazat</button>'
                            : "") +
                        '<button type="button" class="btn btn--sm btn--ghost subtask__add" ' +
                            'data-pozn-nova="' + id + "|" + esc(t.id) + '" title="Přidat poznámku">+</button>' +
                      "</span>"
                    : "") +
            "</div>" +
            (t ? poznamkyHtml(u, t, smiPsat) : "") +
        "</div>";
    }

    function todoHtml(u, smiPsat) {
        const celkem = (u.todo || []).find(jeCelkem) || null;
        const polozky = (u.todo || []).filter(t => !jeCelkem(t));
        // bez skutečného rozpadu se plnění zaklikává do řádku Celkem
        if (!polozky.length) return celkemHtml(u, celkem, smiPsat, false);

        const radky = polozky.map(t => {
            const pct = Number(t.pct) || 0;
            const klic = esc(u.id) + "|" + esc(t.id);
            /* Vypnutá položka na tomhle místě nedává smysl (patro třeba
               rozvaděč nemá) – do procent se nepočítá a procenta u ní
               nejdou měnit, dokud ji někdo zase nezapne (Michal 14. 9. 2026). */
            const vyp = t.vypnuto === true;
            const zamek = (smiPsat && !vyp) ? "" : " disabled";
            const kdo = vyp
                ? "vypnuto – do procent se nepočítá"
                : t.by
                    ? "zapsal " + esc(t.by) + " · " + esc(casRazitko(t.ms))
                    : "zatím nikdo nepotvrdil";

            return '<div class="subtaskblok">' +
            '<div class="subtask subtask--' + pctUroven(pct) + (pct === 100 && !vyp ? " subtask--done" : "") +
                (vyp ? " subtask--vyp" : "") + '">' +
                '<button type="button" class="subtask__check" data-prepni="' + klic + '"' + zamek +
                    ' title="Přepnout mezi 0 a 100 %">' + CHECK + "</button>" +
                '<span class="subtask__name">' + esc(t.text) + "</span>" +
                '<span class="subtask__info">' + kdo + "</span>" +
                /* Výchozí je jedno číslo a táhlo jako na starém webu.
                   „% podrobně" místo nich vypíše celou řadu kroků –
                   volba je osobní a drží ji prohlížeč. */
                (podrobne()
                    ? '<span class="subtask__kroky">' + PCT_KROKY.map(p =>
                        '<button type="button" class="subtask__krok' + (pct === p ? " je-aktivni" : "") +
                        '" data-pct="' + p + "|" + klic + '"' + zamek + ">" + p + "&nbsp;%</button>").join("") +
                      "</span>"
                    : '<button type="button" class="subtask__pct" data-krok="' + klic + '"' + zamek +
                        ' title="Klikáním po krocích 0 → 25 → 50 → 75 → 95 → 100 %">' + pct + " %</button>" +
                      '<input type="range" class="subtask__slider" min="0" max="100" step="5" value="' + pct + '" ' +
                        'data-tahlo="' + klic + '"' + zamek +
                        ' title="Přetažením nastavíš přesná procenta" aria-label="Postup v procentech">') +
                (smiPsat
                    ? '<span class="subtask__akce">' +
                        '<button type="button" class="btn btn--sm btn--ghost subtask__vyp" data-vypni="' + klic +
                            '" title="' + (vyp
                                ? "Zapnout – položka se zase počítá do procent"
                                : "Tady to není – vypnout, ať se nepočítá do procent") + '">' +
                            (vyp ? "Zapnout" : "Vypnout") + "</button>" +
                        '<button type="button" class="btn btn--sm btn--ghost subtask__add" ' +
                            'data-pozn-nova="' + klic + '" title="Přidat poznámku">+</button>' +
                      "</span>"
                    : "") +
            "</div>" +
            poznamkyHtml(u, t, smiPsat) +
            "</div>";
        }).join("");

        // Celkem vedle skutečných položek: nahoře a s varováním
        return (celkem ? celkemHtml(u, celkem, smiPsat, true) : "") + radky;
    }

    /**
     * Štítky s tím, kdo na úkolu má pracovat. Jsou v hlavičce úkolu a barevné
     * schválně – tohle je první otázka, na kterou se u úkolu hledá odpověď.
     * Člověk, který ze seznamu lidí zmizel, se nezahazuje: úkol na někoho
     * pořád visí a musí to být vidět.
     */
    function lideHtml(u) {
        const jmena = (u.prirazeni || []).map(uid => jmenoUid(uid) || "neznámý člověk");
        return jmena.length
            ? jmena.map(j => '<span class="osoba">' + esc(j) + "</span>").join("")
            : '<span class="osoba osoba--nikdo">nikomu nepřiděleno</span>';
    }

    function ukolHtml(u) {
        const uid = window.KB.currentUid();
        const pct = pctUkolu(u);
        // zapisovat smí manažer všude, ostatní jen tam, kde jsou přiřazení
        const smiPsat = jeManazer() || (u.prirazeni || []).indexOf(uid) !== -1;
        const otevreny = otevrene.has(u.id);
        const meta = [u.druh, u.technologie, u.budova, u.patro].filter(Boolean).join(" · ");
        /* Jediný zpracovatel má v den termínu dovolenou (nebo jinou celodenní
           nepřítomnost) – u hotového úkolu už je to jedno. */
        const nepritomen = u.stav !== "hotovo" ? V.nepritomnostVTermin(u.prirazeni, u.termin) : null;
        const opakovani = (window.KB.OPAKOVANI_POPIS || {})[u.opakovani] || "";

        return '<div class="ukol' + (u.stav === "hotovo" ? " ukol--hotovo" : "") + '" id="ukol-' + esc(u.id) + '"' +
                ' data-ukol="' + esc(u.id) + '" data-vyber-radek>' +
            '<div class="ukol__hlava" data-rozbal="' + esc(u.id) + '">' +
                vyber.box(u.id, u.nazev || "") +
                '<div class="grow">' +
                    '<div class="ukol__radek">' +
                        '<span class="ukol__nazev">' + esc(u.nazev) + "</span>" +
                        (u.stav === "hotovo" && u.potvrzeno !== true
                            ? '<span class="osoba osoba--ceka" title="Všechna TO-DO jsou hotová – čeká na potvrzení manažerem">' +
                                "čeká na potvrzení</span>"
                            : "") +
                        (nepritomen
                            ? '<span class="osoba osoba--dovolena" title="' + esc(nepritomen.popis) + '">' +
                                esc(nepritomen.stitek) + "</span>"
                            : "") +
                        lideHtml(u) +
                    "</div>" +
                    '<div class="ukol__meta">' + esc(meta) +
                        (u.termin ? (meta ? " · " : "") + "termín " + esc(V.czDatum(u.termin)) : "") +
                        (opakovani ? ((meta || u.termin) ? " · " : "") + "↻ " + esc(opakovani) : "") +
                    "</div></div>" +
                /* Zápis výkazu je nejčastější důvod, proč se člověk k úkolu
                   vrací – proto stojí rovnou v hlavičce, ne až v patě uvnitř.
                   Do výkazu se předvyplní projekt, úkol i druh. */
                (window.KBUI.can("vykaz.otevrit") && u.stav !== "hotovo"
                    ? '<a class="ukol__vykaz" href="vykazy.html?ukol=' + encodeURIComponent(u.id) +
                        '" title="Zapsat odpracovaný čas na tenhle úkol">' + HODINY +
                        "<span>Zapsat výkaz</span></a>"
                    : "") +
                /* „Zobrazit výkazy", Upravit, Označit hotové, Smazat a další jsou
                   v nabídce „⋯" na konci hlavičky (i na pravém tlačítku). */
                '<span class="ukol__prubeh"><i style="width:' + esc(pct) + '%"></i></span>' +
                '<span class="ukol__pct">' + esc(pct) + " %</span>" +
                window.KBNabidka.tlacitko("Další akce: " + (u.nazev || "úkol")) +
            "</div>" +
            (otevreny
                ? '<div class="ukol__telo">' +
                    '<div class="ukol__todo">' + todoHtml(u, smiPsat) + "</div>" +
                    (historieOtevrena.has(u.id) && window.KBUI.can("vykaz.view")
                        ? '<div style="padding:8px 14px;border-top:1px dashed var(--line);font-size:var(--fs-1);color:var(--text-soft)">' +
                            ((u.historie || []).length ? "" :
                                "Zatím žádný záznam – historie se zapisuje od 20. 8. 2026, starší posuny procent v ní nejsou.") +
                            (u.historie || []).slice().reverse().map(h =>
                                '<div style="padding:2px 0">' + esc(casRazitko(h.ms)) + " · <b>" +
                                esc(h.kdo || "?") + "</b> · " + esc(h.text || "") + ": " +
                                (Number(h.z) || 0) + " % → <b>" + (Number(h.na) || 0) + " %</b></div>").join("") +
                          "</div>"
                        : "") +
                    '<div class="ukol__pata">' +
                        '<span class="tiny muted">' + (u.poznamka ? esc(u.poznamka) : "") + "</span>" +
                        '<span class="row" style="gap:8px">' +
                        // „Zapsat výkaz" je nahoře v hlavičce, ať se kvůli
                        // němu nemusí úkol rozbalovat – tady už podruhé není
                        /* Historie posunů procent je manažerská věc – kdo kdy
                           co posunul, zaměstnanci do toho nic není
                           (přání Michala 1. 9. 2026). */
                        (window.KBUI.can("vykaz.view")
                            ? '<button type="button" class="btn btn--sm btn--ghost" data-historie="' +
                                esc(u.id) + '">' +
                                (historieOtevrena.has(u.id) ? "Skrýt historii" : "Historie") + "</button>"
                            : "") +
                        /* Jedna hlavní akce: u hotového čekajícího Potvrdit,
                           jinak Označit hotové. Upravit, Smazat a ostatní
                           jsou v nabídce „⋯" v hlavičce. */
                        (window.KBUI.isAdmin() && u.stav === "hotovo" && u.potvrzeno !== true
                            ? '<button type="button" class="btn btn--sm btn--primary" data-potvrd="' +
                                esc(u.id) + '">Potvrdit hotové</button>'
                            : (smiPsat && u.stav !== "hotovo"
                                ? '<button type="button" class="btn btn--sm btn--ghost" data-hotovo="' + esc(u.id) + '">Označit hotové</button>' : "")) +
                        "</span>" +
                    "</div>" +
                  "</div>"
                : "") +
        "</div>";
    }

    function vykresli() {
        /* Rozepsaná úprava TO-DO by při překreslení zmizela i s textem –
           dokud je otevřená, seznam se nesahá. */
        if (document.querySelector("[data-todo-input]")) return;
        const seznam = vybrane();

        // roletka projektů ve filtru
        const nazvy = [];
        (window.KB.ukoly || []).forEach(u => {
            if (u.projekt && nazvy.indexOf(u.projekt) === -1) nazvy.push(u.projekt);
        });
        const drzene = $("fProjekt").value;
        $("fProjekt").innerHTML = V.options(nazvy, drzene, "— všechny projekty —");
        // projektů bývají desítky – do filtru se píše, nehledá se očima
        window.KBUI.naseptavac($("fProjekt"), {
            nazev: "Hledat projekt",
            popis: "Piš název projektu…",
            prazdne: "Zatím žádné projekty"
        });

        /* Technologie a patra jen z úkolů, které projdou OSTATNÍMI filtry –
           po výběru projektu tak nabídka ukazuje jen jeho osy. Vybraná
           hodnota v nabídce zůstane, i kdyby ji zrovna nic nesplňovalo,
           jinak by filtr sám vyskočil. */
        const proNabidku = (window.KB.ukoly || []).filter(u =>
            (!$("fProjekt").value || (u.projekt || "") === $("fProjekt").value) &&
            (!oblFiltr || (u.projekt || "") === oblFiltr));
        const naplnFiltr = (id, hodnoty, prazdne) => {
            const drzena = $(id).value;
            const seznam = hodnoty.filter(Boolean)
                .filter((v, i, p) => p.indexOf(v) === i)
                .sort((a, b) => a.localeCompare(b, "cs"));
            if (drzena && seznam.indexOf(drzena) === -1) seznam.push(drzena);
            $(id).innerHTML = V.options(seznam, drzena, prazdne);
        };
        naplnFiltr("fTech", proNabidku.map(u => u.technologie), "— všechny technologie —");
        naplnFiltr("fPatro", proNabidku.map(patroKlic), "— všechna patra —");

        document.querySelectorAll("[data-pohled]").forEach(ch =>
            ch.classList.toggle("je-zapnuty", ch.dataset.pohled === pohled));

        /* Tlačítko říká, co udělá: dokud je zavřený aspoň jeden vypsaný úkol,
           rozbaluje; teprve když jsou otevřené všechny, nabízí sbalení. */
        $("btnRozbal").textContent = vsePlneRozbaleno(seznam) ? "Sbalit vše" : "Rozbalit vše";
        $("prepPodrobne").classList.toggle("je-zapnuty", podrobne());
        $("btnRozbal").disabled = !seznam.length;

        vykresliOblibene();

        /* Dvě úrovně (přání Michala 21. 8.): nejdřív PROJEKT, uvnitř
           projektu podskupiny podle DRUHU práce (ArcGIS, Focení, Skeny…). */
        const projekty = new Map();
        seznam.forEach(u => {
            const klic = u.projekt || "Bez projektu";
            if (!projekty.has(klic)) projekty.set(klic, []);
            projekty.get(klic).push(u);
        });

        $("vypis").innerHTML = Array.from(projekty.entries())
            .sort((a, b) => a[0].localeCompare(b[0], "cs"))
            .map(([projekt, ukoly]) => {
            const prumer = Math.round(ukoly.reduce((s, u) => s + pctUkolu(u), 0) / ukoly.length);
            const druhy = new Map();
            ukoly.forEach(u => {
                const d = u.druh || "Bez druhu";
                if (!druhy.has(d)) druhy.set(d, []);
                druhy.get(d).push(u);
            });
            return '<div class="skupina-nadpis">' + esc(projekt) +
                '<span class="tag">' + prumer + " % · " +
                V.pocet(ukoly.length, ["úkol", "úkoly", "úkolů"]) + "</span></div>" +
                Array.from(druhy.entries())
                    .sort((a, b) => a[0].localeCompare(b[0], "cs"))
                    .map(([druh, du]) =>
                        '<div class="skupina-druh">' + esc(druh) +
                            ' <span class="muted">(' + du.length + ")</span></div>" +
                        du.map(ukolHtml).join("")).join("");
        }).join("") ||
            '<div class="card center" style="padding:34px;color:var(--muted);font-size:var(--fs-3)">' +
            (pohled === "moje" ? "Žádný úkol pro tebe. Až ti manažer nějaký přiřadí, objeví se tady."
                               : "Žádné úkoly.") + "</div>";
    }

    const vsePlneRozbaleno = (seznam) =>
        seznam.length > 0 && seznam.every(u => otevrene.has(u.id));

    /** Rozbalí (nebo sbalí) TO-DO u všech právě vypsaných úkolů naráz. */
    function prepniRozbaleniVsech() {
        const seznam = vybrane();
        const sbalit = vsePlneRozbaleno(seznam);
        seznam.forEach(u => { sbalit ? otevrene.delete(u.id) : otevrene.add(u.id); });
        vykresli();
    }

    /* -------------------------------------------- akce jednoho úkolu ----
       Stejné funkce volá tlačítko v úkolu, nabídka „⋯" / pravé tlačítko
       i hromadná lišta. */

    /** Zapisovat smí manažer všude, ostatní jen tam, kde jsou přiřazení. */
    const smiPsatNa = (u) => !!u && (jeManazer() ||
        (u.prirazeni || []).indexOf(window.KB.currentUid()) !== -1);

    /** Označit hotové = všechny TO-DO na 100 % a stav hotovo. */
    const oznacHotove = (u) => window.KB.ulozUkolPostup(u.id,
        (u.todo || []).map(t => Object.assign({}, t, { pct: 100 })), "hotovo");

    function potvrdHotove(id, btn) {
        if (btn) btn.disabled = true;
        window.KB.potvrdUkol(id)
            .then(() => window.KBUI.toast("Úkol potvrzen jako hotový."))
            .catch(() => { if (btn) btn.disabled = false;
                window.KBUI.toast("Potvrzení selhalo.", "error"); });
    }

    /** Smazání úkolu – stejné potvrzení jako v okně úprav. */
    async function smazUkol(id) {
        if (!id || !window.KBUI.can("ukol.delete")) return;
        if (!(await window.KBUI.potvrd({ nadpis: "Smazat celý úkol i s postupem?", ano: "Smazat",
            nebezpecne: true }))) return;
        await window.KB.deleteUkol(id).catch(() => window.KBUI.toast("Smazání selhalo.", "error"));
    }

    function prepniOtevreny(id, otevrit) {
        const ma = otevrene.has(id);
        if (otevrit === undefined ? ma : !otevrit) otevrene.delete(id); else otevrene.add(id);
        vykresli();
    }

    /* Nabídka úkolu – pravé tlačítko na hlavičce, „⋯" nebo podržení prstem.
       Jen to, co stránka uměla tlačítky už dřív. */
    window.KBNabidka.pripoj((cil) => {
        const box = cil.closest && cil.closest("[data-ukol]");
        if (!box || !$("vypis").contains(box)) return null;
        // TO-DO, poznámky a rozepsané pole uvnitř mají vlastní ovládání
        if (cil.closest(".ukol__telo") && !cil.closest(".ukol__pata")) return null;
        const u = najdiUkol(box.getAttribute("data-ukol"));
        if (!u) return null;
        const otevreny = otevrene.has(u.id);
        const hotovy = u.stav === "hotovo";
        return {
            nadpis: u.nazev || "Úkol",
            radek: box,
            polozky: [
                { text: otevreny ? "Sbalit" : "Rozbalit TO-DO", ikona: "rozbalit",
                    fn: () => prepniOtevreny(u.id) },
                window.KBUI.can("vykaz.otevrit") && !hotovy && {
                    text: "Zapsat výkaz na úkol", ikona: "hodiny",
                    odkaz: "vykazy.html?ukol=" + encodeURIComponent(u.id) },
                window.KBUI.can("vykaz.view") && {
                    text: "Zobrazit výkazy", ikona: "lupa",
                    odkaz: "vykazy.html?ukolFiltr=" + encodeURIComponent(u.id) },
                /* vzkaz k úkolu: v textu odkaz #úkol, adresáti = kdo na něm dělá */
                { text: "Quick TO-DO k úkolu…", ikona: "zprava",
                    fn: () => window.KBUI.otevriQuickPanel({
                        odkaz: odkazNaUkol(u), komu: u.prirazeni || [], projekt: u.projekt || "" }) },
                smiPsatNa(u) && !hotovy && {
                    text: "Označit hotové", ikona: "hotovo", fn: () => oznacHotove(u) },
                window.KBUI.isAdmin() && hotovy && u.potvrzeno !== true && {
                    text: "Potvrdit hotové", ikona: "potvrdit", fn: () => potvrdHotove(u.id) },
                window.KBUI.can("vykaz.view") && {
                    text: historieOtevrena.has(u.id) ? "Skrýt historii posunů" : "Historie posunů", ikona: "historie",
                    fn: () => {
                        if (historieOtevrena.has(u.id)) historieOtevrena.delete(u.id);
                        else { historieOtevrena.add(u.id); otevrene.add(u.id); }
                        vykresli();
                    } },
                window.KBUI.can("ukol.delete") && {
                    text: "Upravit…", ikona: "upravit", fn: () => naplnTvorbu(u) },
                window.KBUI.can("ukol.delete") && {
                    text: "Smazat úkol…", ikona: "smazat", nebezpeci: true, fn: () => smazUkol(u.id) }
            ]
        };
    });

    /* Hromadné akce (manažer): zaškrtávátko v hlavičce úkolu, Shift = rozsah. */
    const vyber = window.KBNabidka.vyber({
        koren: () => $("vypis"),
        radek: "[data-vyber-radek]",
        nazev: ["úkol", "úkoly", "úkolů"],
        zap: () => window.KBUI.can("ukol.delete"),
        akce: (ids) => {
            const vybrane = ids.map(najdiUkol).filter(Boolean);
            const nehotove = vybrane.filter(u => u.stav !== "hotovo" && smiPsatNa(u));
            const cekaji = window.KBUI.isAdmin()
                ? vybrane.filter(u => u.stav === "hotovo" && u.potvrzeno !== true) : [];
            const N = window.KBNabidka;
            const kusy = (n) => V.pocet(n, ["úkol", "úkoly", "úkolů"]);
            return [
                nehotove.length && { text: "Označit hotové (" + nehotove.length + ")", ikona: "hotovo",
                    fn: () => N.hromadne(nehotove.map(u => u.id), {
                        otazka: "Označit " + kusy(nehotove.length) + " jako hotové? Všechny TO-DO půjdou na 100 %.",
                        krok: (id) => { const u = najdiUkol(id);
                            return u && u.stav !== "hotovo" ? oznacHotove(u) : false; },
                        hotovo: "Hotové" }) },
                cekaji.length && { text: "Potvrdit hotové (" + cekaji.length + ")", ikona: "potvrdit",
                    fn: () => N.hromadne(cekaji.map(u => u.id), {
                        otazka: "Potvrdit " + kusy(cekaji.length) + " jako hotové?",
                        krok: (id) => window.KB.potvrdUkol(id), hotovo: "Potvrzeno" }) },
                window.KBUI.can("ukol.delete") && { text: "Smazat (" + vybrane.length + ")", ikona: "smazat",
                    nebezpeci: true,
                    fn: () => N.hromadne(vybrane.map(u => u.id), {
                        otazka: "Opravdu smazat " + kusy(vybrane.length) + " i s postupem? Nedá se to vrátit.",
                        krok: (id) => window.KB.deleteUkol(id), hotovo: "Smazáno" }) }
            ];
        }
    });

    /* ------------------------------------------------- zápis postupu ----
       Přiřazený člověk smí měnit jen `todo` a `stav` – přesně to posílá
       KB.ulozUkolPostup, aby zápis prošel pravidly databáze. */

    /**
     * Všechna TO-DO právě došla na 100 % – úkol se sám přepnul na „čeká na
     * potvrzení" (KB.ulozUkolPostup). Řekne se to, ať to nikoho nepřekvapí,
     * a u opakovaného úkolu i to, kdy přijde další.
     */
    function ohlasHotovo(u) {
        if (!u || u.stav === "hotovo") return;
        const dalsi = u.opakovani && window.KB.dalsiTerminOpakovani
            ? window.KB.dalsiTerminOpakovani(u.termin, u.opakovani, u.opakovaniDen) : "";
        window.KBUI.toast("Všechna TO-DO jsou na 100 % – úkol čeká na potvrzení manažerem." +
            (dalsi ? " Další opakování dostane termín " + V.czDatum(dalsi) + "." : ""));
    }

    async function zapisPct(ukolId, todoId, pct) {
        const u = najdiUkol(ukolId);
        if (!u) return;
        const puvodni = (u.todo || []).find(t => t.id === todoId);
        const todo = (u.todo || []).map(t => t.id === todoId
            ? Object.assign({}, t, { pct: pct, by: window.KB_USER || "", ms: Date.now() }) : t);
        const aktivni = todo.filter(t => t.vypnuto !== true);
        const hotovo = aktivni.length && aktivni.every(t => (Number(t.pct) || 0) === 100);
        try {
            await window.KB.ulozUkolPostup(ukolId, todo, hotovo ? "hotovo" : "otevreny",
                puvodni ? { text: puvodni.text, z: Number(puvodni.pct) || 0, na: pct } : null);
            if (hotovo) ohlasHotovo(u);
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Zápis se nepovedl – postup zapisuje jen přiřazený člověk.", "error");
        }
    }

    /* ------------------------------------------- zápis poznámek k TO-DO ---
       Poznámky leží uvnitř položky (`t.pozn`), takže se ukládají tímtéž
       zápisem jako procenta – přiřazený člověk na to má právo. */

    /** Uloží změněné položky; stav se dopočítá z procent. */
    async function ulozTodo(ukolId, todo, popis) {
        const aktivni = todo.filter(t => t.vypnuto !== true);
        const hotovo = aktivni.length && aktivni.every(t => (Number(t.pct) || 0) === 100);
        try {
            await window.KB.ulozUkolPostup(ukolId, todo, hotovo ? "hotovo" : "otevreny",
                null, popis);
            return true;
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Nepovedlo se – k úkolu píše jen přiřazený člověk.", "error");
            return false;
        }
    }

    /* Zmínka přes @ v poznámce u TO-DO: zmíněný dostane vzkaz do Quick
       TO-DO s odkazem na úkol (#název vede na ukoly.html?otevri=…). Při
       opravě poznámky jen ti, kdo v ní předtím zmínění nebyli. */
    const odkazNaUkol = (u) => ({ t: "u", id: u.id, n: String(u.nazev || "úkol").replace(/\s+/g, " ").trim().slice(0, 120) });

    async function ohlasZminkyPoznamky(u, text, odkazy, predtim) {
        const pred = window.KBUI.zminkyVTextu(predtim || "");
        const novi = window.KBUI.zminkyVTextu(text).filter(x => pred.indexOf(x) === -1);
        if (!novi.length) return;
        const ukol = odkazNaUkol(u);
        try {
            const jmena = await window.KBUI.ohlasZminky(novi,
                "Zmínil tě v poznámce u úkolu #" + ukol.n + ": " + text,
                { projekt: u.projekt || "", odkazy: [ukol].concat(odkazy) });
            if (jmena.length) window.KBUI.toast("Zmínka poslána do Quick TO-DO: " + jmena.join(", ") + ".");
        } catch (err) {
            console.warn("Vzkaz o zmínce se nezapsal:", err);
        }
    }

    /** Vymění jednu položku v seznamu za upravenou. */
    const sPolozkou = (u, todoId, uprav) =>
        (u.todo || []).map(t => t.id === todoId ? uprav(t) : t);

    /* ---------------------------------- plnění úkolu bez TO-DO (Celkem) ---
       Klik na stupnici zapíše procento do položky Celkem; dokud žádná není,
       založí ji. Smí přiřazený člověk a manažer – stejná hlídka jako u TO-DO
       (smiPsatNa), databáze pustí totéž (todo, stav, historie). */

    async function zapisCelkem(ukolId, pct) {
        const u = najdiUkol(ukolId);
        if (!u || !smiPsatNa(u)) return;
        const ma = (u.todo || []).find(jeCelkem);
        if (ma) return zapisPct(ukolId, ma.id, pct);

        const todo = (u.todo || []).concat([{
            id: "td_celkem_" + Date.now(), text: CELKEM_TEXT, celkem: true,
            pct: pct, by: window.KB_USER || "", ms: Date.now()
        }]);
        const aktivni = todo.filter(t => t.vypnuto !== true);
        const hotovo = aktivni.length && aktivni.every(t => (Number(t.pct) || 0) === 100);
        try {
            // do historie i se stavem před prvním klikem (0 %, u hotového 100 %)
            await window.KB.ulozUkolPostup(ukolId, todo, hotovo ? "hotovo" : "otevreny",
                { text: CELKEM_TEXT, z: pctUkolu(u), na: pct });
            if (hotovo) ohlasHotovo(u);
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Zápis se nepovedl – plnění zapisuje jen přiřazený člověk.", "error");
        }
    }

    /** Odebere odhad Celkem, když už úkol má skutečné TO-DO položky. */
    async function smazCelkem(ukolId) {
        const u = najdiUkol(ukolId);
        if (!u || !smiPsatNa(u)) return;
        const t = (u.todo || []).find(jeCelkem);
        if (!t) return;
        if (!(await window.KBUI.potvrd({
            nadpis: "Smazat odhad „" + CELKEM_TEXT + "“ (" + (Number(t.pct) || 0) + " %)?",
            text: "Plnění úkolu pak počítají jen TO-DO položky.",
            ano: "Smazat", nebezpecne: true
        }))) return;
        await ulozTodo(ukolId, (u.todo || []).filter(x => !jeCelkem(x)),
            "smazal odhad Celkem (" + (Number(t.pct) || 0) + " %)");
    }

    async function pridejPoznamku(klic) {
        const [ukolId, todoId] = klic.split("|");
        const vstup = document.querySelector('[data-pozn-vstup="' + klic + '"]');
        const text = vstup ? vstup.value.trim() : "";
        if (!text) { poznFormy.delete(klic); return void vykresli(); }

        const u = najdiUkol(ukolId);
        if (!u) return;
        poznFormy.delete(klic);
        const odkazy = window.KBUI.odkazyPole(vstup);
        const ulozeno = await ulozTodo(ukolId, sPolozkou(u, todoId, t => Object.assign({}, t, {
            pozn: (t.pozn || []).concat([Object.assign({
                id: "pz_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
                text: text.slice(0, 300),
                kdo: window.KB_USER || "",
                uid: window.KB.currentUid() || "",
                ms: Date.now()
            }, odkazy.length ? { odkazy: odkazy } : {})])
        })), "přidal poznámku k TO-DO");
        if (ulozeno) ohlasZminkyPoznamky(u, text.slice(0, 300), odkazy, "");
    }

    async function smazPoznamku(klic) {
        const [ukolId, todoId, poznId] = klic.split("|");
        const u = najdiUkol(ukolId);
        if (!u) return;
        if (!(await window.KBUI.potvrd({ nadpis: "Smazat poznámku?", ano: "Smazat", nebezpecne: true }))) return;
        await ulozTodo(ukolId, sPolozkou(u, todoId, t => Object.assign({}, t, {
            pozn: (t.pozn || []).filter(p => p.id !== poznId)
        })), "smazal poznámku u TO-DO");
    }

    /** Přepne poznámku do psaní. Enter uloží, Escape zruší, odkliknutí uloží. */
    function upravPoznamku(klic) {
        const [ukolId, todoId, poznId] = klic.split("|");
        const u = najdiUkol(ukolId);
        const polozka = u && (u.todo || []).find(t => t.id === todoId);
        const pozn = polozka && (polozka.pozn || []).find(p => p.id === poznId);
        if (!pozn) return;

        const radek = document.querySelector('[data-poznradek="' + klic + '"]');
        const misto = radek && radek.querySelector(".note__text");
        if (!misto) return;
        misto.innerHTML = '<input type="text" class="field note__vstup" data-todo-input data-napoveda autocomplete="off">';
        const vstup = misto.querySelector("input");
        vstup.value = pozn.text;
        vstup.kbOdkazy = window.KBUI.cisteOdkazy(pozn.odkazy);
        vstup.focus();
        vstup.select();

        let hotovo = false;
        const konec = async (ulozit) => {
            if (hotovo) return;
            hotovo = true;
            /* Značka pryč HNED: dokud tu je, `vykresli` se schválně nespouští
               (aby nesebrala rozepsaný text) a seznam by zůstal viset. */
            vstup.removeAttribute("data-todo-input");
            const text = vstup.value.trim();
            if (!ulozit || !text || text === pozn.text) return void vykresli();
            const odkazy = window.KBUI.odkazyPole(vstup);
            const ulozeno = await ulozTodo(ukolId, sPolozkou(u, todoId, t => Object.assign({}, t, {
                pozn: (t.pozn || []).map(x => x.id === poznId
                    ? Object.assign({}, x, { text: text.slice(0, 300), odkazy: odkazy }) : x)
            })), "opravil poznámku u TO-DO");
            if (ulozeno) ohlasZminkyPoznamky(u, text.slice(0, 300), odkazy, pozn.text);
        };
        vstup.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); konec(true); }
            if (e.key === "Escape") { e.preventDefault(); konec(false); }
        });
        vstup.addEventListener("blur", () => konec(true));
    }

    /* ------------------------------------------------------ tvorba ----- */

    let tvorbaSpinava = false;   // v okně tvorby je rozepsaná neuložená změna

    /** Zavře okno úpravy a pustí rolování stránky pod ním. */
    async function zavriTvorbu() {
        /* Rozepsaný úkol se nesmí zahodit potichu – Escape, křížek i klik
           na pozadí se napřed zeptají (přání Michala 31. 8. 2026). */
        if (tvorbaSpinava && !(await window.KBUI.potvrd({ nadpis: "Zahodit rozepsané změny úkolu?",
            ano: "Zahodit", nebezpecne: true }))) return;
        tvorbaSpinava = false;
        $("tvorba").hidden = true;
        document.body.style.overflow = "";
    }

    function doplnNazev() {
        const druh = $("uDruh").value;
        const tech = $("uTech").value;
        /* U ArcGIS zastupuje druh sama technologie – tak se úkoly psaly
           odjakživa („VZT – G61"). U ostatních druhů jde technologie za
           druh („Focení – CHL"). */
        const zacatek = druh === "ArcGIS/Kreslení" ? [tech || druh] : [druh, tech];
        const kusy = zacatek.concat([$("uBudova").value, $("uPatro").value])
            .filter(x => x && x !== "celá stavba");
        $("uNazev").value = kusy.join(" – ") || druh;
    }

    function naplnTvorbu(u) {
        editovanyId = u ? u.id : "";
        tvorbaSpinava = false;
        // čistý start termínové automatiky – značky nesmí přežít minulé okno
        delete $("uTermin").dataset.auto;
        delete $("uTermin").dataset.rucni;
        $("tvorbaNadpis").textContent = u ? "Úprava úkolu" : "Nový úkol";
        $("btnSmazat").hidden = !u;

        const projekty = (window.KB.projektyDocs || []).filter(p => !p.uzavreno)
            .map(p => p.nazev);
        $("uProjekt").innerHTML = V.options(projekty, u ? u.projekt || "" : "", "— vyber projekt —");
        window.KBUI.naseptavac($("uProjekt"), {
            nazev: "Hledat projekt",
            popis: "Piš číslo nebo název projektu…",
            prazdne: "Zatím žádné projekty"
        });
        $("uDruh").value = u ? u.druh || "ArcGIS/Kreslení" : "ArcGIS/Kreslení";
        prepniProjekt(u);
        $("uTermin").value = u ? u.termin || "" : "";
        $("uOpakovani").value = (u && window.KB.OPAKOVANI_POPIS && window.KB.OPAKOVANI_POPIS[u.opakovani])
            ? u.opakovani : "";
        $("uNazev").value = u ? u.nazev || "" : "";
        /* Odhad Celkem do řádků nepatří – není to krok práce. Při uložení
           s TO-DO položkami se odebere (viz ulozUkol), proto se tu oznámí. */
        $("uTodo").value = u ? (u.todo || []).filter(t => !jeCelkem(t)).map(t => t.text).join("\n") : "";
        const celkem = u ? (u.todo || []).find(jeCelkem) : null;
        $("uCelkemInfo").hidden = !celkem;
        $("uCelkemInfo").textContent = celkem
            ? "Plnění zapsané bez rozpadu (" + CELKEM_TEXT + "): " + (Number(celkem.pct) || 0) + " %. " +
              "Když sem napíšeš TO-DO položky, " + CELKEM_TEXT + " se při uložení odebere " +
              "a plnění se bude počítat jen z nich."
            : "";
        $("uPoznamka").value = u ? u.poznamka || "" : "";

        const vybrani = new Set(u ? u.prirazeni || [] : []);
        $("uLide").innerHTML = V.lide().map(cl =>
            "<label><input type=\"checkbox\" value=\"" + esc(cl.id) + "\"" +
            (vybrani.has(cl.id) ? " checked" : "") + "> " + esc(V.jmeno(cl)) + "</label>").join("");

        $("tvorba").hidden = false;
        document.body.style.overflow = "hidden";   // pod oknem se neroluje
        if (!u) doplnNazev();
        obnovTerminInfo();
        $("uProjekt").focus();
    }

    /**
     * Poznámka pod termínem v okně úkolu: jediný vybraný člověk má v den
     * termínu dovolenou (nebo jinou celodenní nepřítomnost) a u opakovaného
     * úkolu, kdy bude další. Kalendář čte každý člen, takže to platí pro
     * každého, kdo úkoly zakládá.
     */
    function obnovTerminInfo() {
        const termin = $("uTermin").value;
        const op = $("uOpakovani").value;
        const lide = Array.from($("uLide").querySelectorAll("input:checked")).map(ch => ch.value);
        const nep = V.nepritomnostVTermin(lide, termin);
        // u upravovaného úkolu se stejným termínem platí den, na kterém řada stojí
        const puv = najdiUkol(editovanyId);
        const den = puv && puv.termin === termin ? puv.opakovaniDen : 0;
        const dalsi = op && termin && window.KB.dalsiTerminOpakovani
            ? window.KB.dalsiTerminOpakovani(termin, op, den) : "";
        const casti = [];
        if (nep) casti.push("<b>" + esc(nep.stitek.charAt(0).toUpperCase() + nep.stitek.slice(1)) +
            ":</b> " + esc(nep.popis));
        if (op && !termin) casti.push("<b>Opakovaný úkol potřebuje termín</b> – další se počítá od něj.");
        else if (dalsi) casti.push("Po splnění vznikne kopie s termínem " + esc(V.czDatum(dalsi)) +
            " a s TO-DO od nuly.");
        $("uTerminInfo").innerHTML = casti.join("<br>");
        $("uTerminInfo").hidden = !casti.length;
    }

    /**
     * Nabídky budov, pater i technologií se řídí vybraným projektem.
     * `u` je úkol, který se právě otevřel k úpravě – jeho hodnoty se do
     * roletky doplní, i kdyby je číselník projektu už nenabízel, aby se při
     * uložení tiše nepřepsaly. Při ručním přepnutí projektu se naopak drží
     * jen to, co nový projekt zná.
     */
    function prepniProjekt(u) {
        const c = ciselnik($("uProjekt").value);
        const napln = (id, seznam, klic, prazdne) => {
            const hodnota = u ? (u[klic] || "") : $(id).value;
            $(id).innerHTML = V.options(u ? sHodnotou(seznam, hodnota) : seznam, hodnota, prazdne);
        };
        napln("uTech", c.technologie, "technologie", "— technologie —");
        napln("uBudova", c.budovy, "budova", null);
        napln("uPatro", c.patra, "patro", "— celé —");

        /* Druhy vypracování podle projektu (vlastní seznam ze Správy má
           přednost před firemním) – dřív byly natvrdo v HTML a projektové
           druhy tu nebyly vidět. */
        /* U nového úkolu na projektu s vlastními druhy je výchozí PRVNÍ
           z nich – firemní ArcGIS by se jinak cpal do nabídky navíc. */
        let drzenyDruh = u ? (u.druh || "") : ($("uDruh").value || "ArcGIS/Kreslení");
        if (!u && c.cinnosti.indexOf(drzenyDruh) === -1) drzenyDruh = c.cinnosti[0] || "";
        const druhy = (drzenyDruh && c.cinnosti.indexOf(drzenyDruh) === -1)
            ? c.cinnosti.concat([drzenyDruh]) : c.cinnosti;
        $("uDruh").innerHTML = V.options(druhy, drzenyDruh, null);

        // prázdná osa se vůbec nenabízí – projekt ji nepoužívá
        $("uTechBox").hidden = !c.technologie.length;
        $("uBudova").closest("label").hidden = !c.budovy.length;
        $("uPatro").closest("label").hidden = !c.patra.length;
        obnovSablony();


        /* Termín NOVÉHO úkolu se předvyplní koncem projektu – ať se
           nemusí dohledávat (přání Michala 31. 8. 2026). Automatické
           vyplnění se značí, ať se při přepnutí projektu přepočítá;
           editovaného úkolu (editovanyId) ani ručně nastaveného či
           ručně smazaného termínu (dataset.rucni) se automatika
           nedotýká. */
        const t = $("uTermin");
        if (!editovanyId && !t.dataset.rucni && (!t.value || t.dataset.auto)) {
            const proj = (window.KB.projektyDocs || []).find(x =>
                (x.nazev || "") === $("uProjekt").value);
            t.value = (proj && proj.konec) || "";
            if (t.value) t.dataset.auto = "1"; else delete t.dataset.auto;
        }
    }

    // ruční zásah do termínu automatiku vypne až do dalšího otevření okna
    $("uTermin").addEventListener("input", () => {
        const t = $("uTermin");
        t.dataset.rucni = "1";
        delete t.dataset.auto;
    });

    /* Šablony TO-DO projektu (nastavují se ve Správě → Nastavení úkolů).
       Tlačítka se ukážou, jen když pro vybranou technologii / patro šablona
       existuje – a od 1. 9. 2026 i u ÚKOLU, KTERÝ UŽ EXISTUJE: dřív se
       počítala jen při ruční změně roletky, takže při otevření úpravy
       zůstala schovaná a rozpad se nedal doplnit. */
    const projektDocSab = () => (window.KB.projektyDocs || [])
        .find(x => (x.nazev || "") === $("uProjekt").value);

    const sabTechText = () => {
        const p = projektDocSab();
        const t = (p && p.sablony && p.sablony.tech) || {};
        return String(t[$("uTech").value] || "").trim();
    };

    const sabMistText = () => {
        const p = projektDocSab();
        const m = (p && p.sablony && p.sablony.mistnosti) || {};
        return String(((m[$("uBudova").value] || {})[$("uPatro").value]) || "").trim();
    };

    function obnovSablony() {
        const t = sabTechText(), m = sabMistText();
        $("uSabTech").hidden = !t;
        if (t) $("uSabTech").textContent = "TO-DO ze šablony " + $("uTech").value +
            " (" + t.split("\n").length + ")";
        $("uSabMist").hidden = !m;
        if (m) $("uSabMist").textContent = "TO-DO = místnosti " + $("uPatro").value +
            " (" + m.split("\n").length + ")";
    }


    async function ulozUkol() {
        const projektNazev = $("uProjekt").value;
        if (!projektNazev) return void window.KBUI.toast("Vyber projekt.", "warn");
        const nazev = $("uNazev").value.trim();
        if (!nazev) return void window.KBUI.toast("Úkol potřebuje název.", "warn");
        const opakovani = $("uOpakovani").value;
        const termin = $("uTermin").value;
        if (opakovani && !termin) {
            return void window.KBUI.toast("Opakovaný úkol potřebuje termín – další se počítá od něj.", "warn");
        }

        const puvodni = najdiUkol(editovanyId);
        const projektDoc = (window.KB.projektyDocs || []).find(p => p.nazev === projektNazev);

        /* TO-DO řádky. Procenta se drží nejdřív podle textu, a co se
           nespáruje, podle POŘADÍ – jinak by oprava překlepu v položce
           vypadala jako nová položka a shodila by zapsaná procenta
           i s tím, kdo je zapsal. */
        /* Odhad Celkem se do párování nepouští – jinak by ho první nový
           řádek „opravou překlepu" převzal i s procenty. */
        const puvodniVse = puvodni ? puvodni.todo || [] : [];
        const puvodniCelkem = puvodniVse.filter(jeCelkem);
        const puvodniTodo = puvodniVse.filter(t => !jeCelkem(t));
        const texty = $("uTodo").value.split("\n").map(r => r.trim()).filter(Boolean);
        const podleTextu = new Map(puvodniTodo.map(t => [t.text, t]));
        const pouzite = new Set();
        const todo = texty.map((text, i) => {
            const shoda = podleTextu.get(text);
            if (shoda && !pouzite.has(shoda.id)) {
                pouzite.add(shoda.id);
                return shoda;
            }
            return { text: text, _index: i };
        }).map((polozka, i) => {
            if (!polozka._index && polozka._index !== 0) return polozka;   // už spárováno
            const naPozici = puvodniTodo[i];
            if (naPozici && !pouzite.has(naPozici.id) && !texty.includes(naPozici.text)) {
                pouzite.add(naPozici.id);
                return Object.assign({}, naPozici, { text: polozka.text });
            }
            return { id: "td_" + Date.now() + "_" + i, text: polozka.text,
                     pct: 0, by: "", ms: 0 };
        });
        /* Celkem žije jen do chvíle, než úkol dostane skutečný rozpad: odhad
           celku vedle položek by práci počítal dvakrát a průměr by lhal
           (Celkem 75 % + tři nové položky na nule = 19 %). Bez řádků
           zůstává, ať úprava názvu nebo termínu zapsané plnění nesmaže. */
        const todoUlozit = todo.length ? todo : puvodniCelkem;

        const id = editovanyId || window.KB.newUkolId();
        $("btnUlozit").disabled = true;
        try {
            await window.KB.saveUkol(id, {
                projektId: projektDoc ? projektDoc.id : (puvodni ? puvodni.projektId : ""),
                projekt: projektNazev,
                nazev: nazev,
                druh: $("uDruh").value,
                /* Technologie se ukládá u KAŽDÉHO druhu. Dřív se mimo ArcGIS
                   zahazovala, takže úkol založený z matice o ni po první
                   úpravě přišel a vypadl z matice i ze souhrnů. */
                technologie: $("uTech").value,
                /* Vazba na milník se při úpravě drží – dřív ji uložení smazalo
                   a potvrzení milníku pak úkol nenašlo. */
                milnikId: puvodni ? (puvodni.milnikId || "") : "",
                budova: $("uBudova").value === "celá stavba" ? "" : $("uBudova").value,
                patro: $("uPatro").value,
                prirazeni: Array.from($("uLide").querySelectorAll("input:checked")).map(ch => ch.value),
                termin: termin,
                /* Opakování; den v měsíci, na kterém řada stojí, platí jen
                   dokud se termín nezmění – nový termín ho určí znovu. */
                opakovani: opakovani,
                opakovaniDen: puvodni && puvodni.termin === termin ? (puvodni.opakovaniDen || 0) : 0,
                // budget se už nikde nezadává; u starších úkolů se jen přenese dál
                budgetHodin: puvodni ? puvodni.budgetHodin : 0,
                stav: puvodni ? puvodni.stav : "otevreny",
                todo: todoUlozit,
                poznamka: $("uPoznamka").value.trim(),
                createdMs: puvodni ? puvodni.createdMs : undefined,
                createdBy: puvodni ? puvodni.createdBy : undefined
            });
            zavriTvorbu();
            window.KBUI.toast("Úkol uložen.");
        } catch (err) {
            console.error(err);
            window.KBUI.toast("Uložení selhalo – úkoly zakládají manažeři.", "error");
        } finally {
            $("btnUlozit").disabled = false;
        }
    }

    /* -------------------------------------------------------------- start */

    document.addEventListener("DOMContentLoaded", () => {
        window.KBUI.mountNav({ active: "ukoly.html" });
        if (window.KBUI.can("vykaz.view") && (zakSlug || params.get("vse"))) pohled = zakSlug ? "zak" : "vse";

        $("btnNovy").addEventListener("click", () => naplnTvorbu(null));
        $("btnZrusit").addEventListener("click", zavriTvorbu);
        $("btnZavri").addEventListener("click", zavriTvorbu);
        // klik na tmavé pozadí a Escape zavírají stejně jako Zrušit
        $("tvorba").addEventListener("click", (event) => {
            if (event.target === $("tvorba")) zavriTvorbu();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key !== "Escape" || $("tvorba").hidden) return;
            /* `event.target` nemusí být prvek (klávesa mimo pole míří na
               document), proto se `closest` volá jen když existuje. */
            const cil = event.target;
            if (cil && cil.closest && cil.closest("[data-todo-input]")) return;
            zavriTvorbu();
        });
        $("btnUlozit").addEventListener("click", () => {
            tvorbaSpinava = false;      // ukládá se – hlídka už nemá co chránit
            ulozUkol();
        });
        // cokoliv v okně člověk přepíše, zvedne vlajku rozepsané změny
        // (samotný výběr projektu ještě rozepsaný úkol není)
        $("tvorba").addEventListener("input", (e) => {
            if (e.target && e.target.id === "uProjekt") return;
            tvorbaSpinava = true;
        });
        /* Odchod ze stránky s rozepsaným oknem tvorby nebo rozepsanou
           poznámkou u TO-DO zastaví prohlížeč dotazem. */
        window.addEventListener("beforeunload", (e) => {
            if ((!$("tvorba").hidden && tvorbaSpinava) ||
                    document.querySelector("[data-todo-input]")) {
                e.preventDefault();
                e.returnValue = "";
            }
        });
        $("btnRozbal").addEventListener("click", prepniRozbaleniVsech);
        $("btnSmazat").addEventListener("click", async () => {
            if (!editovanyId) return;
            if (!(await window.KBUI.potvrd({ nadpis: "Smazat celý úkol i s postupem?", ano: "Smazat",
                nebezpecne: true }))) return;
            await window.KB.deleteUkol(editovanyId).catch(() => window.KBUI.toast("Smazání selhalo.", "error"));
            zavriTvorbu();
        });
        const vlozTodo = (text) => {
            if (!text) return;
            const ted = $("uTodo").value.trim();
            $("uTodo").value = (ted ? ted + "\n" : "") + text;
        };
        $("uSabTech").addEventListener("click", () => vlozTodo(sabTechText()));
        $("uSabMist").addEventListener("click", () => vlozTodo(sabMistText()));
        ["uProjekt", "uTech", "uBudova", "uPatro"].forEach(id =>
            $(id).addEventListener("change", obnovSablony));

        // termín, opakování a lidé → poznámka o dovolené a dalším termínu
        ["input", "change"].forEach(typ => $("uTermin").addEventListener(typ, obnovTerminInfo));
        $("uOpakovani").addEventListener("change", obnovTerminInfo);
        $("uLide").addEventListener("change", obnovTerminInfo);
        $("uDruh").addEventListener("change", doplnNazev);
        $("uProjekt").addEventListener("change", () => { prepniProjekt(null); doplnNazev(); });
        ["uTech", "uBudova", "uPatro"].forEach(id => $(id).addEventListener("change", doplnNazev));
        $("fHotove").addEventListener("change", vykresli);
